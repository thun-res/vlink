[launcher]
name = "vlink-example"
ctrl_enabled = true
ctrl_scheme = "dds"
ctrl_namespace = "launcher"
ctrl_domain = 0
shutdown_timeout_ms = 10000
plugin_dirs = ["${this_dir}"]

# 同进程加载的组件（与独立进程共享同一份 LauncherComponent 代码）
[[component]]
name = "sensor_inproc"
group = "core"
lib = "launcher_demo_sensor_plugin"
class = "SensorNode"
dedicated = false
watchdog_ms = 2000
restart = "on_failure"
restart_delay_ms = 500
[component.params]
rate_hz = 10
url = "dds://sensor/inproc/event/0"
[component.ready]
type = "component"
timeout_ms = 5000

# 独立进程运行的同一组件（链接 VLINK_LAUNCHER_COMPONENT_MAIN 或任意外部程序）
[[process]]
name = "sensor_standalone"
group = "core"
depends_on = ["sensor_inproc"]
cmd = "${this_dir}/launcher_demo_sensor_node"
watchdog_ms = 2000
restart = "on_failure"
restart_delay_ms = 500
restart_max_ms = 10000
start_burst = 5
start_window_ms = 60000
output = "screen"
[process.params]
rate_hz = 5
url = "dds://sensor/standalone/event/0"
[process.ready]
type = "notify"
timeout_ms = 5000
