# Example 3: Embedded C++ LauncherServer + LauncherAPI Programmatic Orchestrator
# Self-contained manifest using intra:// control plane, three logical groups
# (@core, @driving, @parking), active/standby failover, and isolate_group mode switch.

[launcher]
name = "vlink-embedded-orchestrator"
startup = "parallel"
stop_timeout_ms = 5000
ctrl_scheme = "intra"
ctrl_namespace = "embedded_demo"
plugin_dirs = ["${this_dir}"]

[urls]
odom = "intra://embedded/vehicle/odom"
cmd  = "intra://embedded/vehicle/cmd"

[logger]
console_level = "info"
file_level = "debug"
history = 1024

[[group]]
name = "core"
mode = "parallel"

[[group]]
name = "driving"
mode = "parallel"

[[group]]
name = "parking"
mode = "parallel"

[[scheduler]]
name = "control_pinned"
mode = "pinned"
queue = "priority"
threads = 2

[[scheduler]]
name = "algo_pool"
mode = "pool"
queue = "lockfree"
threads = 2

# Stage 0 (@core): Chassis bridge kept online across @driving -> @parking switches
[[component]]
name = "vehicle_bridge"
group = "core"
stage = 0
lib = "example_launcher_embedded_components"
class = "VehicleBridge"
scheduler = "control_pinned"
worker = 1
[component.inputs]
cmd = "${url.cmd}"
[component.ready]
type = "component"
timeout_ms = 3000

# Stage 1 (@driving): Active primary cruise planner
[[component]]
name = "cruise_primary"
group = "driving"
stage = 1
lib = "example_launcher_embedded_components"
class = "CruisePlanner"
scheduler = "control_pinned"
pool = "algo_pool"
worker = 0
reload = "component"
requires = ["vehicle_bridge"]
after = ["vehicle_bridge"]
[component.inputs]
odom = "${url.odom}"
[component.outputs]
cmd = "${url.cmd}"
[component.params]
role = "primary"
target_speed_mps = 15.0
[component.ready]
type = "component"
timeout_ms = 3000

# Stage 1 (@driving): Warm standby cruise planner (starts in kInactive)
[[component]]
name = "cruise_backup"
group = "driving"
stage = 1
lib = "example_launcher_embedded_components"
class = "CruisePlanner"
scheduler = "control_pinned"
pool = "algo_pool"
worker = 0
init_state = "inactive"
requires = ["vehicle_bridge"]
after = ["vehicle_bridge"]
[component.inputs]
odom = "${url.odom}"
[component.outputs]
cmd = "${url.cmd}"
[component.params]
role = "backup"
target_speed_mps = 15.0
[component.ready]
type = "component"
timeout_ms = 3000

# Stage 2 (@driving): Odometry feed driving the active cruise planner
[[component]]
name = "odom_feed"
group = "driving"
stage = 2
lib = "example_launcher_embedded_components"
class = "OdomFeed"
scheduler = "control_pinned"
worker = 0
requires = ["vehicle_bridge"]
after = ["cruise_primary"]
[component.outputs]
odom = "${url.odom}"
[component.params]
period_ms = 120
[component.ready]
type = "component"
timeout_ms = 3000

# Stage 1 (@parking): On-demand parking planner (cold-boot idle, started by isolate_group)
[[component]]
name = "parking_planner"
group = "parking"
stage = 1
lib = "example_launcher_embedded_components"
class = "ParkingPlanner"
scheduler = "control_pinned"
worker = 0
autostart = false
requires = ["vehicle_bridge"]
after = ["vehicle_bridge"]
[component.outputs]
cmd = "${url.cmd}"
[component.params]
period_ms = 100
slot_id = "B2-08"
[component.ready]
type = "component"
timeout_ms = 3000
