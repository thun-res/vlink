# Example 2: Hybrid Multi-Process + Isolated Container Plugin Dataflow
# Demonstrates defining an ENTIRE cross-process + container dataflow in TOML:
#   sensor_front (process) --+
#                            +--> planner (container plugin) --> actuator (process)
#   sensor_rear  (process) --+                                        ^
#                                 safety_supervisor (container) ------+ (RPC)

[launcher]
name = "vlink-hybrid-dataflow"
startup = "parallel"
stop_timeout_ms = 5000
ctrl_scheme = "dds"
ctrl_namespace = "hybrid_launcher"
ctrl_domain = 0
plugin_dirs = ["${this_dir}"]

[args.transport]
default = "dds"
choices = ["dds", "zenoh", "shm"]
desc = "Cross-process transport scheme"

[args.sensors]
default = "front,rear"
desc = "Comma-separated sensor instances expanded via for_each"

[args.max_speed]
default = "1.5"
desc = "Initial planner speed cap (m/s)"

[args.domain]
default = "0"
desc = "Dataflow DDS/Zenoh domain ID (override to isolate from other domain-0 apps)"

# System-wide VLink URLs (referenced via ${url.<key>} and injected as VLINK_* env vars)
[urls]
scan_front = "${arg.transport}://hybrid/sensor/front/scan?domain=${arg.domain}"
scan_rear  = "${arg.transport}://hybrid/sensor/rear/scan?domain=${arg.domain}"
cmd_vel    = "${arg.transport}://hybrid/control/cmd_vel?domain=${arg.domain}"
status_rpc = "${arg.transport}://hybrid/actuator/status?domain=${arg.domain}"

[logger]
console_level = "info"
file_level = "debug"
history = 2048

[[slice]]
name = "drive_slice"
cpu_quota_percent = 200
mem_max_mb = 1024

[[group]]
name = "drive"
mode = "parallel"
slice = "drive_slice"

[[group]]
name = "diagnostics"
mode = "parallel"

[[scheduler]]
name = "planner_pinned"
mode = "pinned"
queue = "priority"
threads = 2

[[scheduler]]
name = "planner_pool"
mode = "pool"
queue = "lockfree"
threads = 2

# Stage 0: Cross-platform preflight oneshot task
[[task]]
name = "preflight"
group = "drive"
stage = 0
kind = "oneshot"
cmd = "${this_dir}/example_launcher_sensor_node"
args = ["--check"]
timeout_ms = 5000
output = "log"

# Stage 1: External actuator process (receives VLINK_INPUT_CMD_VEL & VLINK_URL_STATUS_RPC)
[[process]]
name = "actuator"
group = "drive"
stage = 1
cmd = "${this_dir}/example_launcher_actuator_node"
args = ["--in", "${url.cmd_vel}", "--rpc", "${url.status_rpc}"]
restart = "on_failure"
start_burst = 5
start_window_ms = 30000
output = "screen"
[process.inputs]
cmd_vel = "${url.cmd_vel}"
[process.urls]
status_rpc = "${url.status_rpc}"
[process.ready]
type = "stdout"
pattern = "READY actuator"
timeout_ms = 5000

# Stage 2: Isolated plugin host container for planning & safety components
[[container]]
name = "planning_host"
group = "drive"
stage = 2
after = ["actuator"]
restart = "on_failure"
output = "screen"

[[component]]
name = "planner"
group = "drive"
container = "planning_host"
stage = 2
lib = "example_launcher_planner_plugin"
class = "HybridPlanner"
scheduler = "planner_pinned"
pool = "planner_pool"
worker = 0
[component.inputs]
scan_front = "${url.scan_front}"
scan_rear = "${url.scan_rear}"
[component.outputs]
cmd_vel = "${url.cmd_vel}"
[component.params]
max_speed_mps = "${arg.max_speed}"
[component.ready]
type = "component"
timeout_ms = 5000

[[component]]
name = "safety_supervisor"
group = "diagnostics"
container = "planning_host"
stage = 2
lib = "example_launcher_planner_plugin"
class = "SafetySupervisor"
scheduler = "planner_pinned"
worker = 1
after = ["planner"]
[component.urls]
status_rpc = "${url.status_rpc}"
[component.params]
period_ms = 1000
[component.ready]
type = "component"
timeout_ms = 5000

# Stage 3: Fan-out external sensor processes via for_each (front & rear)
[[process]]
name = "sensor_${item}"
group = "drive"
stage = 3
for_each = "${arg.sensors}"
cmd = "${this_dir}/example_launcher_sensor_node"
args = ["--name", "sensor_${item}", "--out", "${url.scan}", "--period_ms", "250"]
after = ["planning_host"]
binds_to = ["planning_host"]
restart = "on_failure"
output = "log"
[process.outputs]
scan = "${arg.transport}://hybrid/sensor/${item}/scan?domain=${arg.domain}"
[process.ready]
type = "stdout"
pattern = "READY sensor="
timeout_ms = 5000
