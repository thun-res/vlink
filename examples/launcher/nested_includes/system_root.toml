# Example 4: Multi-Level Nested TOML Manifests ([[include]] + Nested [params])
# Level 1 (Root) -> Level 2 (Subsystems) -> Level 3 (Camera Template via for_each)
#
# Quick check:
#   ./vlink-launcher validate nested_includes/system_root.toml
#   ./vlink-launcher graph nested_includes/system_root.toml --format ascii
#   ./vlink-launcher inspect nested_includes/system_root.toml --json
#   ./vlink-launcher run nested_includes/system_root.toml --arg cameras=front,rear,left

[launcher]
name = "vlink-nested-fleet"
namespace = "fleet"
startup = "parallel"
stop_timeout_ms = 5000
ctrl_scheme = "dds"
ctrl_namespace = "nested_fleet"
ctrl_domain = 0
plugin_dirs = ["${this_dir}", "${this_dir}/.."]

[args.profile]
default = "sim"
choices = ["sim", "vehicle"]
desc = "Deployment profile forwarded into child manifests"

[args.transport]
default = "intra"
choices = ["intra", "dds", "zenoh"]
desc = "Dataflow transport shared across all nested subsystems"

[args.cameras]
default = "front,rear"
desc = "Comma-separated camera list expanded by Level-2 -> Level-3 for_each [[include]]"

[args.rate_ms]
default = "200"
desc = "Camera publish interval (ms) propagated through 3 include levels"

[args.enable_diagnostics]
default = "true"
choices = ["true", "false"]
desc = "Toggle conditional [[include]] of diagnostics subsystem"

# Shared absolute URLs (leading '/' after '://' opts out of per-unit namespace prefixing)
[urls]
scan      = "${arg.transport}:///fleet/perception/scan"
obstacles = "${arg.transport}:///fleet/perception/obstacles"
cmd_vel   = "${arg.transport}:///fleet/control/cmd_vel"

[env]
FLEET_PROFILE = "${arg.profile}"

# Nested global parameter sub-tables (flattened to safety.max_speed_mps, safety.watchdog_enabled)
[params]
fleet_name = "alpha"

[params.safety]
max_speed_mps = 1.5
watchdog_enabled = true

[logger]
console_level = "info"
file_level = "debug"
history = 2048

[[scheduler]]
name = "rt_pinned"
mode = "pinned"
queue = "priority"
threads = 2

[[scheduler]]
name = "compute_pool"
mode = "pool"
queue = "lockfree"
threads = 2

# Level 2 (conditional include): fleet/diag/*
[[include]]
path = "subsystems/diagnostics.toml"
namespace = "diag"
condition = "${arg.enable_diagnostics} == true"

# Level 2 (args forwarding with string + float): fleet/control/*
[[include]]
path = "subsystems/control.toml"
namespace = "control"
[include.args]
mode = "${arg.profile}"
max_speed = 1.5

# Level 2 -> Level 3 recursive include: fleet/perception/* + fleet/perception/cam_*/*
[[include]]
path = "subsystems/perception.toml"
namespace = "perception"
[include.args]
cameras = "${arg.cameras}"
rate_ms = "${arg.rate_ms}"
threshold_m = 4.5
