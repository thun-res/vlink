# Level 2 Subsystem: Control (included by system_root.toml under namespace "fleet/control")

[args.mode]
default = "sim"
desc = "Controller operating mode"

[args.max_speed]
default = "1.5"
desc = "Maximum command speed (m/s)"

[[component]]
name = "controller"
stage = 1
lib = "demo_launcher_components"
class = "DemoController"
scheduler = "rt_pinned"
worker = 1
reload = "component"
[component.inputs]
obstacles = "${url.obstacles}"
[component.outputs]
cmd_vel = "${url.cmd_vel}"
[component.params]
mode = "${arg.mode}"
[component.params.pid]
kp = 1.2
ki = 0.1
kd = 0.05
max_speed = "${arg.max_speed}"
[component.ready]
type = "component"
timeout_ms = 5000
