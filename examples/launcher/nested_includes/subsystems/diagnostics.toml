# Level 2 Subsystem: Diagnostics (conditionally included by system_root.toml)

[[component]]
name = "monitor"
stage = 0
lib = "demo_launcher_components"
class = "DemoMonitor"
scheduler = "rt_pinned"
worker = 1
[component.inputs]
cmd_vel = "${url.cmd_vel}"
[component.params]
period_ms = 1000
[component.ready]
type = "component"
timeout_ms = 5000
