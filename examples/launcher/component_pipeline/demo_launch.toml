# Example 1: In-Process Zero-Copy Dataflow Pipeline
# Demonstrates TOML-defined [urls], [component.inputs], [component.outputs],
# pinned deterministic scheduling, lock-free pool offload,
# ROS 2-style kInactive standby controller, and live ctl control plane.

[launcher]
name = "vlink-launcher-pipeline"
startup = "parallel"
stop_timeout_ms = 5000
ctrl_scheme = "dds"
ctrl_namespace = "launcher"
ctrl_domain = 0
plugin_dirs = ["${this_dir}"]

[args.transport]
default = "intra"
choices = ["intra", "dds", "zenoh"]
desc = "Transport scheme for pipeline channels"

[args.period_ms]
default = "250"
desc = "DemoSensor publish interval in milliseconds"

[args.sensor_id]
default = "lidar_front"
desc = "Logical sensor identifier"

# Centralized VLink URLs defining the entire dataflow topology
[urls]
scan      = "${arg.transport}://pipeline/sensor/scan"
obstacles = "${arg.transport}://pipeline/perception/obstacles"
cmd_vel   = "${arg.transport}://pipeline/control/cmd_vel"

[logger]
console_level = "info"
file_level = "debug"
history = 2048

[[group]]
name = "pipeline"
mode = "parallel"

[[scheduler]]
name = "rt_pinned"
mode = "pinned"
queue = "priority"
threads = 2

[[scheduler]]
name = "compute_pool"
mode = "pool"
queue = "lockfree"
threads = 2

[[component]]
name = "monitor"
group = "pipeline"
lib = "demo_launcher_components"
class = "DemoMonitor"
scheduler = "rt_pinned"
worker = 1
[component.inputs]
cmd_vel = "${url.cmd_vel}"
[component.params]
period_ms = 1000
[component.ready]
type = "component"
timeout_ms = 5000

[[component]]
name = "controller"
group = "pipeline"
lib = "demo_launcher_components"
class = "DemoController"
scheduler = "rt_pinned"
worker = 1
reload = "component"
after = ["monitor"]
[component.inputs]
obstacles = "${url.obstacles}"
[component.outputs]
cmd_vel = "${url.cmd_vel}"
[component.params]
mode = "primary"
[component.ready]
type = "component"
timeout_ms = 5000

[[component]]
name = "controller_backup"
group = "pipeline"
lib = "demo_launcher_components"
class = "DemoController"
scheduler = "rt_pinned"
worker = 1
init_state = "inactive"
after = ["monitor"]
[component.inputs]
obstacles = "${url.obstacles}"
[component.outputs]
cmd_vel = "${url.cmd_vel}"
[component.params]
mode = "backup"
[component.ready]
type = "component"
timeout_ms = 5000

[[component]]
name = "fusion"
group = "pipeline"
lib = "demo_launcher_components"
class = "DemoFusion"
scheduler = "rt_pinned"
pool = "compute_pool"
worker = 0
after = ["controller"]
binds_to = ["controller"]
[component.inputs]
scan = "${url.scan}"
[component.outputs]
obstacles = "${url.obstacles}"
[component.params]
threshold_m = 4.0
[component.ready]
type = "component"
timeout_ms = 5000

[[component]]
name = "sensor"
group = "pipeline"
lib = "demo_launcher_components"
class = "DemoSensor"
scheduler = "rt_pinned"
worker = 0
watchdog_ms = 5000
reload = "component"
after = ["fusion"]
[component.outputs]
scan = "${url.scan}"
[component.params]
period_ms = "${arg.period_ms}"
sensor_id = "${arg.sensor_id}"
[component.ready]
type = "component"
timeout_ms = 5000
