name: Release Portable macOS

on:
  workflow_call:
    inputs:
      qt_version:
        required: true
        type: string
      osg_sdk_repository:
        required: true
        type: string
      osg_sdk_ref:
        required: true
        type: string

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CCACHE_COMPRESS: "true"
  CCACHE_MAXSIZE: 2G
  PIP_DISABLE_PIP_VERSION_CHECK: 1

jobs:
  portable-macos-arm64:
    name: portable-macos-arm64
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install release tools
        run: brew install --quiet ccache git-lfs nasm yasm

      - name: Setup Qt and QtIFW
        uses: ./.github/actions/setup-qt-ifw
        with:
          host: mac
          qt-version: ${{ inputs.qt_version }}
          qt-arch: clang_64
          qtifw-package: qt.tools.ifw.47
          cache-suffix: clang_64-base-ifw-47

      - name: Setup OSG SDK
        uses: ./.github/actions/setup-osg-sdk
        with:
          repository: ${{ inputs.osg_sdk_repository }}
          ref: ${{ inputs.osg_sdk_ref }}
          platform-dir: darwin_universal
          validation-paths: |
            include/osg
            lib
            lib/libOpenThreads.3.3.1.dylib
            lib/libosg.161.dylib
            lib/libosgDB.161.dylib
            lib/libosgGA.161.dylib
            lib/libosgManipulator.161.dylib
            lib/libosgUtil.161.dylib
            lib/libosgText.161.dylib
            lib/libosgViewer.161.dylib
            lib/osgPlugins-3.6.5/osgdb_obj.so
            lib/osgPlugins-3.6.5/osgdb_osg.so
            lib/osgPlugins-3.6.5/osgdb_serializers_osg.so
          cache-suffix: v1

      - name: Restore Conan and CPM caches
        uses: ./.github/actions/restore-build-cache
        with:
          path: |
            ~/.conan2
            ~/.vlink-cpm-cache
          key: conan-cpm-macos-arm64-${{ hashFiles('conanfile.py', 'packup/conan_profile', 'cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}
          restore-keys: conan-cpm-macos-arm64-

      - name: Setup ccache
        id: ccache
        uses: ./.github/actions/setup-compiler-cache
        with:
          backend: ccache
          cache-key: ccache-release-macos-arm64-${{ github.sha }}
          restore-keys: ccache-release-macos-arm64-
          max-size: 2G
          cmake-wrapper: "true"
          disable-ipo: "true"

      - name: Build portable archive and QtIFW installer
        run: |
          set -euo pipefail
          bash packup/build-conan.sh . arm64 2> >(
            awk '
              /strip: error: symbols referenced by indirect symbol table entries/ {drop=1; next}
              drop && /^__/ {next}
              {drop=0; print > "/dev/stderr"}
            '
          )

      - name: Save ccache
        if: always() && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ccache.outputs.cache-path }}
          key: ${{ steps.ccache.outputs.cache-key }}

      - name: Verify bundled macOS OSG files
        run: |
          set -euo pipefail
          for path in \
            lib/libOpenThreads.21.dylib \
            lib/libosg.161.dylib \
            lib/libosgDB.161.dylib \
            lib/libosgGA.161.dylib \
            lib/libosgManipulator.161.dylib \
            lib/libosgUtil.161.dylib \
            lib/libosgText.161.dylib \
            lib/libosgViewer.161.dylib \
            lib/osgPlugins-3.6.5/osgdb_obj.so \
            lib/osgPlugins-3.6.5/osgdb_osg.so \
            lib/osgPlugins-3.6.5/osgdb_serializers_osg.so; do
            test -f "build-conan/packup/darwin/vlink/${path}"
          done

      - name: Check Qt SVG runtime dependency
        run: |
          set -euo pipefail
          test -f build-conan/packup/darwin/vlink/lib/QtSvg.framework/Versions/A/QtSvg
          test -f build-conan/packup/darwin/vlink/lib/imageformats/libqsvg.dylib
          bash .github/scripts/check-macho-deps.sh build-conan/packup/darwin/vlink/lib/imageformats/libqsvg.dylib

      - name: Check macOS bundle metadata
        run: |
          set -euo pipefail
          version=$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "build-conan/packup/darwin/VLink Player.app/Contents/Info.plist")
          test "${version}" = "12.0"

      - name: Compress macOS app bundles
        run: |
          set -euo pipefail
          shopt -s nullglob
          for app in build-conan/packup/darwin/vlink-*.app; do
            zip_path="${app%.app}.zip"
            ditto -c -k --sequesterRsrc --keepParent "${app}" "${zip_path}"
          done
          app="build-conan/packup/darwin/VLink Player.app"
          test -d "${app}"
          zip_path="${app%.app}.zip"
          ditto -c -k --sequesterRsrc --keepParent "${app}" "${zip_path}"

      - name: Verify macOS portable outputs
        uses: ./.github/actions/verify-artifacts
        with:
          globs: |
            build-conan/packup/darwin/*.tgz
            build-conan/packup/darwin/vlink-*.zip
            build-conan/packup/darwin/VLink Player.zip

      - name: Upload macOS portable artifacts
        uses: actions/upload-artifact@v7
        with:
          name: vlink-portable-macos-arm64
          if-no-files-found: error
          path: |
            build-conan/packup/darwin/*.tgz
            build-conan/packup/darwin/*.zip
