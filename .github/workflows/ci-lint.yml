name: CI Lint

on:
  pull_request:
    branches:
      - master
      - main
      - develop
      - dev
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - '.github/wiki/**'
  push:
    branches:
      - master
      - main
      - develop
      - dev
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - '.github/wiki/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-lint-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_GENERATOR: Ninja
  VLINK_UBUNTU22_IMAGE: ghcr.io/${{ github.repository_owner }}/vlink-ubuntu22:latest
  VLINK_CI_CMAKE_ARGS: >-
    -DCMAKE_BUILD_TYPE=Release
    -DENABLE_CCACHE_BUILD=ON
    -DBUILD_SHARED_LIBS=ON
    -DENABLE_CPM=ON
    -DENABLE_CPM_SQLITE3=ON
    -DENABLE_CPM_ZSTD=ON
    -DENABLE_CPM_PROTOBUF=ON
    -DENABLE_CPM_FLATBUFFERS=ON
    -DENABLE_CXX_STD_20=OFF
    -DENABLE_VIEWER=OFF
    -DENABLE_WEBVIZ=OFF
    -DENABLE_IOX_ROUDI=OFF
    -DENABLE_EXAMPLES=ON
    -DENABLE_TEST=ON
    -DENABLE_TEST_WARN=ON

jobs:
  lint:
    name: lint + clang-tidy
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore CPM cache
        uses: actions/cache@v5
        with:
          path: ~/.vlink-cpm-cache
          key: cpm-ci-linux-x86_64-${{ hashFiles('cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}
          restore-keys: cpm-ci-linux-x86_64-

      - name: Set ccache epoch
        id: ccache-epoch
        run: echo "value=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-ci-linux-x86_64-tidy-v4-${{ steps.ccache-epoch.outputs.value }}-${{ hashFiles('.clang-tidy', '.github/scripts/ccache-clang-tidy.sh', '.github/scripts/ci-tidy.sh', '.github/docker/Dockerfile', '.github/workflows/docker-images.yml', 'CMakeLists.txt', 'cmake/**/*.cmake', 'conanfile.py', 'packup/patch/*.patch') }}
          restore-keys: ccache-ci-linux-x86_64-tidy-v4-

      - name: Run lint gates
        run: bash .github/scripts/docker-run.sh "${VLINK_UBUNTU22_IMAGE}" bash .github/scripts/ci-lint.sh

      - name: Configure and run clang-tidy
        run: >-
          bash .github/scripts/docker-run.sh "${VLINK_UBUNTU22_IMAGE}"
          env VLINK_CI_TIDY_CCACHE=1 bash .github/scripts/ci-tidy.sh
