name: CI Lint

on:
  pull_request:
    branches:
      - master
      - main
      - develop
  push:
    branches:
      - master
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-lint-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: 1.7.12
  PIP_DISABLE_PIP_VERSION_CHECK: 1

jobs:
  format-and-check:
    name: format.sh + check.sh
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Validate workflow files
        run: |
          set -euo pipefail
          python3 -m pip install --user PyYAML==6.0.2
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          files = sorted(Path(".github").rglob("*.yml")) + sorted(Path(".github").rglob("*.yaml"))
          for path in files:
              with path.open(encoding="utf-8") as handle:
                  yaml.safe_load(handle)
          PY
          python3 .github/scripts/check-github-actions.py
          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT
          curl -fsSL \
            -o "${tmp}/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf "${tmp}/actionlint.tar.gz" -C "${tmp}" actionlint
          "${tmp}/actionlint" .github/workflows/*.yml

      - name: Validate Android.bp files
        run: python3 .github/scripts/check-android-bp.py .

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare CI image
        id: ci-image
        uses: ./.github/actions/prepare-ci-image
        with:
          image: ghcr.io/${{ github.repository_owner }}/vlink-ci-ubuntu24:latest
          required-tools: clang-format cmake-format cpplint python3

      - name: Run format and check gates
        uses: ./.github/actions/docker-run
        with:
          image: ${{ steps.ci-image.outputs.image }}
          command: |
            set -euo pipefail
            git config --global --add safe.directory "${GITHUB_WORKSPACE}"
            if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
              git status --short
            else
              echo "Checkout has no .git metadata; creating a local baseline for tools/format.sh."
              git init -q
              git config user.name "github-actions"
              git config user.email "github-actions@github.com"
              git add -A
              git commit -q -m "format baseline"
            fi

            bash tools/format.sh "${GITHUB_WORKSPACE}"

            if ! git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              echo "No parent commit available; no changed C files to check."
              bash tools/check.sh .
              exit 0
            fi
            mapfile -t candidates < <(git diff --name-only --diff-filter=ACMR HEAD^ -- '*.c' | sort)
            c_sources=()
            for path in "${candidates[@]}"; do
              case "${path}" in
                thirdparty/*|*/thirdparty/*|builtin/*|*/builtin/*|prebuilt/*|*/prebuilt/*|android-bp/*|*/android-bp/*|build/*|*/build/*|build-*/*|*/build-*/*)
                  continue
                  ;;
              esac
              c_sources+=("${path}")
            done
            if [ "${#c_sources[@]}" -gt 0 ]; then
              clang-format --dry-run --Werror "${c_sources[@]}"
            fi
            bash tools/check.sh .

      - name: Show formatting diff
        if: failure()
        run: git diff -- . ':!CMakeUserPresets.json'
