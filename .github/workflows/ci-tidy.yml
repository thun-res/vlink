name: CI Clang-Tidy

on:
  pull_request:
    branches:
      - master
      - main
      - develop
  push:
    branches:
      - master
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-tidy-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  VLINK_CI_CMAKE_ARGS: >-
    -G Ninja
    -DCMAKE_BUILD_TYPE=Release
    -DBUILD_SHARED_LIBS=ON
    -DENABLE_CPM=ON
    -DENABLE_CPM_SQLITE3=ON
    -DENABLE_CPM_ZSTD=ON
    -DENABLE_CPM_PROTOBUF=ON
    -DENABLE_CPM_FLATBUFFERS=ON
    -DENABLE_CXX_STD_20=OFF
    -DENABLE_VIEWER=OFF
    -DENABLE_WEBVIZ=OFF
    -DENABLE_IOX_ROUDI=OFF
    -DENABLE_EXAMPLES=OFF
    -DENABLE_TEST=OFF
    -DENABLE_TEST_WARN=ON

jobs:
  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare CI image
        id: ci-image
        uses: ./.github/actions/prepare-ci-image
        with:
          image: ghcr.io/${{ github.repository_owner }}/vlink-ci-ubuntu24:latest
          context: .github/docker/ci-ubuntu24
          dockerfile: .github/docker/ci-ubuntu24/Dockerfile
          local-tag: vlink-ci-ubuntu24:local
          required-tools: clang-tidy cmake ninja python3

      - name: Restore CPM cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: ~/.vlink-cpm-cache
          key: cpm-ci-tidy-${{ runner.os }}-${{ hashFiles('cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}

      - name: Restore CPM build cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: build-tidy/_deps
          key: cpm-build-ci-tidy-v1-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}

      - name: Configure and run clang-tidy
        uses: ./.github/actions/docker-run
        with:
          image: ${{ steps.ci-image.outputs.image }}
          command: |
            set -euo pipefail
            git config --global --add safe.directory "${GITHUB_WORKSPACE}"
            cmake -S . -B build-tidy ${VLINK_CI_CMAKE_ARGS} -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
            export BUILD_DIR=build-tidy
            export REQUIRED_DEFINES="VLINK_ENABLE_SECURITY
            VLINK_ENABLE_SQLITE
            VLINK_ENABLE_ZSTD"
            export REQUIRED_SOURCE_PREFIXES="src/
            modules/intra/
            modules/shm/
            modules/dds/
            modules/ddsc/
            proxy/
            cli/info/
            cli/bag/
            cli/eproto/
            cli/efbs/
            cli/list/
            cli/monitor/
            cli/dump/
            cli/check/
            cli/bench/"
            python3 .github/scripts/assert-cmake-config.py
            python3 .github/scripts/run-clang-tidy.py
