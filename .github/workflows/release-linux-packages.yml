name: Release Linux Packages

on:
  workflow_call:
    inputs:
      container_image_tag:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CCACHE_COMPRESS: "true"
  CCACHE_MAXSIZE: 2G

jobs:
  package-deb:
    name: deb-${{ matrix.distro }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu20.04
            ubuntu_version: "20.04"
            arch: x86_64
            runner: ubuntu-24.04
            image: vlink-release-ubuntu20
            context: .github/docker/release-ubuntu20
            dockerfile: .github/docker/release-ubuntu20/Dockerfile
            deb_depends: "libssl1.1, libsqlite3-0, libzstd1"
          - distro: ubuntu20.04
            ubuntu_version: "20.04"
            arch: aarch64
            runner: ubuntu-24.04-arm
            image: vlink-release-ubuntu20
            context: .github/docker/release-ubuntu20
            dockerfile: .github/docker/release-ubuntu20/Dockerfile
            deb_depends: "libssl1.1, libsqlite3-0, libzstd1"
          - distro: ubuntu22.04
            ubuntu_version: "22.04"
            arch: x86_64
            runner: ubuntu-24.04
            image: vlink-package-ubuntu22
            context: .github/docker/package-ubuntu22
            dockerfile: .github/docker/package-ubuntu22/Dockerfile
            deb_depends: "libssl3, libsqlite3-0, libzstd1"
          - distro: ubuntu22.04
            ubuntu_version: "22.04"
            arch: aarch64
            runner: ubuntu-24.04-arm
            image: vlink-package-ubuntu22
            context: .github/docker/package-ubuntu22
            dockerfile: .github/docker/package-ubuntu22/Dockerfile
            deb_depends: "libssl3, libsqlite3-0, libzstd1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare deb package image
        id: deb-image
        uses: ./.github/actions/prepare-ci-image
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ inputs.container_image_tag || format('df-{0}', hashFiles(matrix.dockerfile)) }}
          required-tools: bash ccache cmake file git patch

      - name: Restore CPM cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: ~/.vlink-cpm-cache
          key: cpm-deb-${{ matrix.distro }}-${{ matrix.arch }}-${{ hashFiles('cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}
          restore-keys: cpm-deb-${{ matrix.distro }}-${{ matrix.arch }}-

      - name: Setup ccache
        id: ccache
        uses: ./.github/actions/setup-compiler-cache
        with:
          backend: ccache
          cache-key: ccache-deb-${{ matrix.distro }}-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: ccache-deb-${{ matrix.distro }}-${{ matrix.arch }}-
          max-size: 2G
          cmake-wrapper: "false"
          disable-ipo: "true"

      - name: Build deb package
        uses: ./.github/actions/docker-run
        with:
          image: ${{ steps.deb-image.outputs.image }}
          cmake-wrapper: "true"
          disable-ipo: "true"
          command: |
            set -euo pipefail
            export DEB_DEPENDS="${{ matrix.deb_depends }}"

            bash packup/build-deb.sh .

      - name: Save ccache
        if: always() && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ccache.outputs.cache-path }}
          key: ${{ steps.ccache.outputs.cache-key }}

      - name: Add distro suffix to deb package names
        run: |
          set -euo pipefail
          for file in build-deb/packup/linux/*.deb; do
            dir=$(dirname "${file}")
            base=$(basename "${file}" .deb)
            mv "${file}" "${dir}/${base}-${{ matrix.distro }}.deb"
          done

      - name: Verify deb package
        uses: ./.github/actions/verify-artifacts
        with:
          globs: build-deb/packup/linux/*.deb

      - name: Upload deb package
        uses: actions/upload-artifact@v7
        with:
          name: vlink-deb-${{ matrix.distro }}-${{ matrix.arch }}
          if-no-files-found: error
          path: build-deb/packup/linux/*.deb

  package-rpm:
    name: rpm-fedora43-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare rpm package image
        id: rpm-image
        uses: ./.github/actions/prepare-ci-image
        with:
          image: ghcr.io/${{ github.repository_owner }}/vlink-package-fedora43:${{ inputs.container_image_tag || format('df-{0}', hashFiles('.github/docker/package-fedora43/Dockerfile')) }}
          required-tools: bash ccache cmake g++ git patch

      - name: Restore CPM cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: ~/.vlink-cpm-cache
          key: cpm-rpm-fedora43-${{ matrix.arch }}-${{ hashFiles('cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}
          restore-keys: cpm-rpm-fedora43-${{ matrix.arch }}-

      - name: Setup ccache
        id: ccache
        uses: ./.github/actions/setup-compiler-cache
        with:
          backend: ccache
          cache-key: ccache-rpm-fedora43-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: ccache-rpm-fedora43-${{ matrix.arch }}-
          max-size: 2G
          cmake-wrapper: "false"
          disable-ipo: "true"

      - name: Build rpm package
        uses: ./.github/actions/docker-run
        with:
          image: ${{ steps.rpm-image.outputs.image }}
          cmake-wrapper: "true"
          disable-ipo: "true"
          command: |
            set -euo pipefail

            bash packup/build-rpm.sh .

      - name: Save ccache
        if: always() && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ccache.outputs.cache-path }}
          key: ${{ steps.ccache.outputs.cache-key }}

      - name: Verify rpm package
        uses: ./.github/actions/verify-artifacts
        with:
          globs: build-rpm/packup/linux/*.rpm

      - name: Upload rpm package
        uses: actions/upload-artifact@v7
        with:
          name: vlink-rpm-fedora43-${{ matrix.arch }}
          if-no-files-found: error
          path: build-rpm/packup/linux/*.rpm

  package-arch:
    name: arch-pkg-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            image: vlink-package-arch
            context: .github/docker/package-arch
            dockerfile: .github/docker/package-arch/Dockerfile
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: vlink-package-arch-aarch64
            context: .github/docker/package-arch-aarch64
            dockerfile: .github/docker/package-arch-aarch64/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Arch package image
        id: arch-image
        uses: ./.github/actions/prepare-ci-image
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ inputs.container_image_tag || format('df-{0}', hashFiles(matrix.dockerfile)) }}
          required-tools: bash bsdtar ccache cmake git patch

      - name: Restore CPM cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: ~/.vlink-cpm-cache
          key: cpm-arch-${{ matrix.arch }}-${{ hashFiles('cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}
          restore-keys: cpm-arch-${{ matrix.arch }}-

      - name: Setup ccache
        id: ccache
        uses: ./.github/actions/setup-compiler-cache
        with:
          backend: ccache
          cache-key: ccache-arch-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: ccache-arch-${{ matrix.arch }}-
          max-size: 2G
          cmake-wrapper: "false"
          disable-ipo: "true"

      - name: Build Arch package
        uses: ./.github/actions/docker-run
        with:
          image: ${{ steps.arch-image.outputs.image }}
          cmake-wrapper: "true"
          disable-ipo: "true"
          command: |
            set -euo pipefail
            test "$(uname -m)" = "${{ matrix.arch }}"

            bash packup/build-arch.sh .

      - name: Save ccache
        if: always() && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ccache.outputs.cache-path }}
          key: ${{ steps.ccache.outputs.cache-key }}

      - name: Verify Arch package
        uses: ./.github/actions/verify-artifacts
        with:
          globs: build-arch/packup/linux/*.pkg.tar.zst

      - name: Upload Arch package
        uses: actions/upload-artifact@v7
        with:
          name: vlink-arch-${{ matrix.arch }}
          if-no-files-found: error
          path: build-arch/packup/linux/*.pkg.tar.zst
