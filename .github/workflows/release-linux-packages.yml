name: Release Linux Packages

on:
  workflow_call:
    inputs:
      container_image_tag:
        required: false
        type: string
        default: latest

permissions:
  contents: read
  packages: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CCACHE_COMPRESS: "true"
  CCACHE_MAXSIZE: 2G

jobs:
  package-deb:
    name: deb-${{ matrix.distro }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    container:
      image: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ inputs.container_image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu20.04
            ubuntu_version: "20.04"
            arch: x86_64
            runner: ubuntu-24.04
            image: vlink-release-ubuntu20
            deb_depends: "libssl1.1, libsqlite3-0, libzstd1"
          - distro: ubuntu20.04
            ubuntu_version: "20.04"
            arch: aarch64
            runner: ubuntu-24.04-arm
            image: vlink-release-ubuntu20
            deb_depends: "libssl1.1, libsqlite3-0, libzstd1"
          - distro: ubuntu22.04
            ubuntu_version: "22.04"
            arch: x86_64
            runner: ubuntu-24.04
            image: vlink-package-ubuntu22
            deb_depends: "libssl3, libsqlite3-0, libzstd1"
          - distro: ubuntu22.04
            ubuntu_version: "22.04"
            arch: aarch64
            runner: ubuntu-24.04-arm
            image: vlink-package-ubuntu22
            deb_depends: "libssl3, libsqlite3-0, libzstd1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check build host
        run: |
          grep -q '${{ matrix.ubuntu_version }}' /etc/os-release
          test "$(uname -m)" = "${{ matrix.arch }}"
          patch --version | head -n 1

      - name: Restore CPM cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: ~/.vlink-cpm-cache
          key: cpm-deb-${{ matrix.distro }}-${{ matrix.arch }}-${{ hashFiles('cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}
          restore-keys: cpm-deb-${{ matrix.distro }}-${{ matrix.arch }}-

      - name: Setup ccache
        uses: ./.github/actions/setup-compiler-cache
        with:
          backend: ccache
          cache-key: ccache-deb-${{ matrix.distro }}-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: ccache-deb-${{ matrix.distro }}-${{ matrix.arch }}-
          max-size: 2G
          cmake-wrapper: "true"

      - name: Build deb package
        env:
          DEB_DEPENDS: ${{ matrix.deb_depends }}
        run: bash packup/build-deb.sh .

      - name: Show ccache stats
        if: always()
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats || true
          fi

      - name: Add distro suffix to deb package names
        run: |
          set -euo pipefail
          for file in build-deb/packup/linux/*.deb; do
            dir=$(dirname "${file}")
            base=$(basename "${file}" .deb)
            mv "${file}" "${dir}/${base}-${{ matrix.distro }}.deb"
          done

      - name: Verify deb package
        uses: ./.github/actions/verify-artifacts
        with:
          globs: build-deb/packup/linux/*.deb

      - name: Upload deb package
        uses: actions/upload-artifact@v4
        with:
          name: vlink-deb-${{ matrix.distro }}-${{ matrix.arch }}
          if-no-files-found: error
          path: build-deb/packup/linux/*.deb

  package-rpm:
    name: rpm-fedora43-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    container:
      image: ghcr.io/${{ github.repository_owner }}/vlink-package-fedora43:${{ inputs.container_image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check build host
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          patch --version | head -n 1

      - name: Restore CPM cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: ~/.vlink-cpm-cache
          key: cpm-rpm-fedora43-${{ matrix.arch }}-${{ hashFiles('cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}
          restore-keys: cpm-rpm-fedora43-${{ matrix.arch }}-

      - name: Setup ccache
        uses: ./.github/actions/setup-compiler-cache
        with:
          backend: ccache
          cache-key: ccache-rpm-fedora43-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: ccache-rpm-fedora43-${{ matrix.arch }}-
          max-size: 2G
          cmake-wrapper: "true"

      - name: Build rpm package
        run: bash packup/build-rpm.sh .

      - name: Show ccache stats
        if: always()
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats || true
          fi

      - name: Verify rpm package
        uses: ./.github/actions/verify-artifacts
        with:
          globs: build-rpm/packup/linux/*.rpm

      - name: Upload rpm package
        uses: actions/upload-artifact@v4
        with:
          name: vlink-rpm-fedora43-${{ matrix.arch }}
          if-no-files-found: error
          path: build-rpm/packup/linux/*.rpm

  package-arch:
    name: arch-pkg-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    container:
      image: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ inputs.container_image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            image: vlink-package-arch
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: vlink-package-arch-aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check build host
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          patch --version | head -n 1

      - name: Restore CPM cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: ~/.vlink-cpm-cache
          key: cpm-arch-${{ matrix.arch }}-${{ hashFiles('cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}
          restore-keys: cpm-arch-${{ matrix.arch }}-

      - name: Setup ccache
        uses: ./.github/actions/setup-compiler-cache
        with:
          backend: ccache
          cache-key: ccache-arch-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: ccache-arch-${{ matrix.arch }}-
          max-size: 2G
          cmake-wrapper: "true"

      - name: Build Arch package
        run: bash packup/build-arch.sh .

      - name: Show ccache stats
        if: always()
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats || true
          fi

      - name: Verify Arch package
        uses: ./.github/actions/verify-artifacts
        with:
          globs: build-arch/packup/linux/*.pkg.tar.zst

      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: vlink-arch-${{ matrix.arch }}
          if-no-files-found: error
          path: build-arch/packup/linux/*.pkg.tar.zst
