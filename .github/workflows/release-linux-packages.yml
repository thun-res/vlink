name: Release Linux Packages

on:
  workflow_call:
    inputs:
      container_image_tag:
        required: false
        type: string
        default: latest

permissions:
  contents: read
  packages: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CCACHE_COMPRESS: "true"
  CCACHE_MAXSIZE: 2G

jobs:
  package-deb:
    name: deb-${{ matrix.distro }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    container:
      image: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ inputs.container_image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu20.04
            ubuntu_version: "20.04"
            arch: x86_64
            runner: ubuntu-24.04
            image: vlink-release-ubuntu20
            deb_depends: "libssl1.1, libsqlite3-0, libzstd1"
          - distro: ubuntu20.04
            ubuntu_version: "20.04"
            arch: aarch64
            runner: ubuntu-24.04-arm
            image: vlink-release-ubuntu20
            deb_depends: "libssl1.1, libsqlite3-0, libzstd1"
          - distro: ubuntu22.04
            ubuntu_version: "22.04"
            arch: x86_64
            runner: ubuntu-24.04
            image: vlink-package-ubuntu22
            deb_depends: "libssl3, libsqlite3-0, libzstd1"
          - distro: ubuntu22.04
            ubuntu_version: "22.04"
            arch: aarch64
            runner: ubuntu-24.04-arm
            image: vlink-package-ubuntu22
            deb_depends: "libssl3, libsqlite3-0, libzstd1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check build host
        run: |
          grep -q '${{ matrix.ubuntu_version }}' /etc/os-release
          test "$(uname -m)" = "${{ matrix.arch }}"
          patch --version | head -n 1

      - name: Restore CPM cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: ~/.vlink-cpm-cache
          key: cpm-deb-${{ matrix.distro }}-${{ matrix.arch }}-${{ hashFiles('cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}
          restore-keys: cpm-deb-${{ matrix.distro }}-${{ matrix.arch }}-

      - name: Setup ccache
        uses: ./.github/actions/setup-compiler-cache
        with:
          backend: ccache
          cache-key: ccache-deb-${{ matrix.distro }}-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: ccache-deb-${{ matrix.distro }}-${{ matrix.arch }}-
          max-size: 2G
          cmake-wrapper: "true"
          disable-ipo: "true"

      - name: Build deb package
        env:
          DEB_DEPENDS: ${{ matrix.deb_depends }}
        run: bash packup/build-deb.sh .

      - name: Show ccache stats
        if: always()
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats || true
          fi

      - name: Add distro suffix to deb package names
        run: |
          set -euo pipefail
          for file in build-deb/packup/linux/*.deb; do
            dir=$(dirname "${file}")
            base=$(basename "${file}" .deb)
            mv "${file}" "${dir}/${base}-${{ matrix.distro }}.deb"
          done

      - name: Verify deb package
        uses: ./.github/actions/verify-artifacts
        with:
          globs: build-deb/packup/linux/*.deb

      - name: Upload deb package
        uses: actions/upload-artifact@v4
        with:
          name: vlink-deb-${{ matrix.distro }}-${{ matrix.arch }}
          if-no-files-found: error
          path: build-deb/packup/linux/*.deb

  package-rpm:
    name: rpm-fedora43-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    container:
      image: ghcr.io/${{ github.repository_owner }}/vlink-package-fedora43:${{ inputs.container_image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check build host
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          patch --version | head -n 1

      - name: Restore CPM cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: ~/.vlink-cpm-cache
          key: cpm-rpm-fedora43-${{ matrix.arch }}-${{ hashFiles('cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}
          restore-keys: cpm-rpm-fedora43-${{ matrix.arch }}-

      - name: Setup ccache
        uses: ./.github/actions/setup-compiler-cache
        with:
          backend: ccache
          cache-key: ccache-rpm-fedora43-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: ccache-rpm-fedora43-${{ matrix.arch }}-
          max-size: 2G
          cmake-wrapper: "true"
          disable-ipo: "true"

      - name: Build rpm package
        run: bash packup/build-rpm.sh .

      - name: Show ccache stats
        if: always()
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats || true
          fi

      - name: Verify rpm package
        uses: ./.github/actions/verify-artifacts
        with:
          globs: build-rpm/packup/linux/*.rpm

      - name: Upload rpm package
        uses: actions/upload-artifact@v4
        with:
          name: vlink-rpm-fedora43-${{ matrix.arch }}
          if-no-files-found: error
          path: build-rpm/packup/linux/*.rpm

  package-arch:
    name: arch-pkg-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            image: vlink-package-arch
            context: .github/docker/package-arch
            dockerfile: .github/docker/package-arch/Dockerfile
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: vlink-package-arch-aarch64
            context: .github/docker/package-arch-aarch64
            dockerfile: .github/docker/package-arch-aarch64/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Arch package image
        id: arch-image
        uses: ./.github/actions/prepare-ci-image
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ inputs.container_image_tag }}
          context: ${{ matrix.context }}
          dockerfile: ${{ matrix.dockerfile }}
          local-tag: ${{ matrix.image }}:package-local
          required-tools: bash bsdtar ccache cmake git patch
          verify-command: test "$(uname -m)" = "${{ matrix.arch }}"

      - name: Check build host
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          docker run --rm "${{ steps.arch-image.outputs.image }}" bash -lc 'test "$(uname -m)" = "${{ matrix.arch }}"; patch --version | head -n 1'

      - name: Restore CPM cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: ~/.vlink-cpm-cache
          key: cpm-arch-${{ matrix.arch }}-${{ hashFiles('cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}
          restore-keys: cpm-arch-${{ matrix.arch }}-

      - name: Restore ccache
        uses: ./.github/actions/restore-build-cache
        with:
          path: ~/.ccache
          key: ccache-arch-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: ccache-arch-${{ matrix.arch }}-

      - name: Build Arch package
        uses: ./.github/actions/docker-run
        with:
          image: ${{ steps.arch-image.outputs.image }}
          command: |
            set -euo pipefail
            test "$(uname -m)" = "${{ matrix.arch }}"
            export CCACHE_DIR="${HOME}/.ccache"
            export CCACHE_BASEDIR="${GITHUB_WORKSPACE}"
            export CCACHE_COMPRESS=true
            export CCACHE_MAXSIZE=2G
            ccache --zero-stats || true

            wrapper_dir="${HOME}/.vlink-cmake-wrapper"
            mkdir -p "${wrapper_dir}"
            real_cmake="$(command -v cmake)"
            cat > "${wrapper_dir}/cmake" <<'EOF'
            #!/usr/bin/env bash
            set -euo pipefail
            args=("$@")
            inject=1
            have_c=0
            have_cxx=0
            have_ipo=0
            for arg in "$@"; do
              case "${arg}" in
                --build|--install|-E|-P|--version|--help|--help-*|--system-information|--find-package|--workflow)
                  inject=0
                  break
                  ;;
                -DCMAKE_C_COMPILER_LAUNCHER=*) have_c=1 ;;
                -DCMAKE_CXX_COMPILER_LAUNCHER=*) have_cxx=1 ;;
                -DENABLE_IPO=*) have_ipo=1 ;;
              esac
            done
            if [ "${inject}" = "1" ]; then
              [ "${have_c}" = "1" ] || args+=("-DCMAKE_C_COMPILER_LAUNCHER=ccache")
              [ "${have_cxx}" = "1" ] || args+=("-DCMAKE_CXX_COMPILER_LAUNCHER=ccache")
              [ "${have_ipo}" = "1" ] || args+=("-DENABLE_IPO=OFF")
            fi
            exec "${VLINK_REAL_CMAKE}" "${args[@]}"
            EOF
            chmod +x "${wrapper_dir}/cmake"
            export VLINK_REAL_CMAKE="${real_cmake}"
            export PATH="${wrapper_dir}:${PATH}"

            bash packup/build-arch.sh .
            ccache --show-stats || true

      - name: Show ccache stats
        if: ${{ always() && steps.arch-image.outcome == 'success' && steps.arch-image.outputs.image != '' }}
        run: docker run --rm --volume "${HOME}/.ccache:/github/home/.ccache" --env CCACHE_DIR=/github/home/.ccache "${{ steps.arch-image.outputs.image }}" bash -lc 'ccache --show-stats || true'

      - name: Verify Arch package
        uses: ./.github/actions/verify-artifacts
        with:
          globs: build-arch/packup/linux/*.pkg.tar.zst

      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: vlink-arch-${{ matrix.arch }}
          if-no-files-found: error
          path: build-arch/packup/linux/*.pkg.tar.zst
