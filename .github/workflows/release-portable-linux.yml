name: Release Portable Linux

on:
  workflow_call:
    inputs:
      qt_version:
        required: true
        type: string
      osg_sdk_repository:
        required: true
        type: string
      osg_sdk_ref:
        required: true
        type: string
      container_image_tag:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CCACHE_COMPRESS: "true"
  CCACHE_MAXSIZE: 2G
  PIP_DISABLE_PIP_VERSION_CHECK: 1

jobs:
  portable-linux:
    name: portable-linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            image: vlink-release-ubuntu20
            context: .github/docker/release-ubuntu20
            dockerfile: .github/docker/release-ubuntu20/Dockerfile
            osg_platform: linux_x86_64
            qt_arch: linux_gcc_64
            qt_modules: qtwaylandcompositor
            qt_cache_suffix: linux_gcc_64-waylandcompositor-ifw-47
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GHCR
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare portable image
        id: portable-image
        uses: ./.github/actions/prepare-ci-image
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ inputs.container_image_tag }}
          context: ${{ matrix.context }}
          dockerfile: ${{ matrix.dockerfile }}
          local-tag: ${{ matrix.image }}-${{ matrix.arch }}:portable-local
          required-tools: bash ccache cmake conan git git-lfs ninja patch patchelf pkg-config

      - name: Setup Qt and QtIFW
        uses: ./.github/actions/setup-qt-ifw
        with:
          host: linux
          qt-version: ${{ inputs.qt_version }}
          qt-arch: ${{ matrix.qt_arch }}
          qt-modules: ${{ matrix.qt_modules }}
          qtifw-package: qt.tools.ifw.47
          cache-suffix: ${{ matrix.qt_cache_suffix }}
          install-conan: "false"

      - name: Setup OSG SDK
        uses: ./.github/actions/setup-osg-sdk
        with:
          repository: ${{ inputs.osg_sdk_repository }}
          ref: ${{ inputs.osg_sdk_ref }}
          platform-dir: ${{ matrix.osg_platform }}
          validation-paths: |
            include/osg
            lib
            lib/libOpenThreads.so.3.3.1
            lib/libosg.so.161
            lib/libosgDB.so.161
            lib/libosgGA.so.161
            lib/libosgManipulator.so.161
            lib/libosgUtil.so.161
            lib/libosgText.so.161
            lib/libosgViewer.so.161
            lib/osgPlugins-3.6.5/osgdb_freetype.so
            lib/osgPlugins-3.6.5/osgdb_obj.so
            lib/osgPlugins-3.6.5/osgdb_osg.so
            lib/osgPlugins-3.6.5/osgdb_serializers_osg.so
          cache-suffix: v1

      - name: Restore Conan and CPM caches
        uses: ./.github/actions/restore-build-cache
        with:
          path: |
            ~/.conan2
            ~/.vlink-cpm-cache
          key: conan-cpm-linux-${{ matrix.arch }}-${{ hashFiles('conanfile.py', 'packup/conan_profile', 'cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}
          restore-keys: conan-cpm-linux-${{ matrix.arch }}-

      - name: Setup ccache
        uses: ./.github/actions/setup-compiler-cache
        with:
          backend: ccache
          cache-key: ccache-release-linux-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: ccache-release-linux-${{ matrix.arch }}-
          max-size: 2G
          cmake-wrapper: "false"
          disable-ipo: "true"

      - name: Build portable archive and QtIFW installer
        uses: ./.github/actions/docker-run
        with:
          image: ${{ steps.portable-image.outputs.image }}
          command: |
            set -euo pipefail
            QT_QMAKE=$(find "/github/home/.vlink-ci/qt/${{ inputs.qt_version }}" -type f -path "*/bin/qmake" -print -quit)
            QTIFW_BINARYCREATOR=$(find /github/home/.vlink-ci/qt/Tools/QtInstallerFramework -type f -name binarycreator -print -quit)
            test -n "${QT_QMAKE}"
            test -n "${QTIFW_BINARYCREATOR}"
            export QT_DIR
            QT_DIR=$(dirname "$(dirname "${QT_QMAKE}")")
            export QTIFW_DIR
            QTIFW_DIR=$(dirname "$(dirname "${QTIFW_BINARYCREATOR}")")
            export OSG_DIR="/github/home/.vlink-ci/osg_sdk/${{ matrix.osg_platform }}"
            test -d "${OSG_DIR}/include/osg"
            export CCACHE_DIR="${HOME}/.ccache"
            export CCACHE_BASEDIR="${GITHUB_WORKSPACE}"
            export CCACHE_COMPRESS=true
            export CCACHE_MAXSIZE=2G
            export PATH="${QTIFW_DIR}/bin:${QT_DIR}/bin:${PATH}"
            ccache --zero-stats || true
            trap 'ccache --show-stats || true' EXIT

            wrapper_dir="${HOME}/.vlink-cmake-wrapper"
            mkdir -p "${wrapper_dir}"
            real_cmake="$(command -v cmake)"
            cat > "${wrapper_dir}/cmake" <<'EOF'
            #!/usr/bin/env bash
            set -euo pipefail
            args=("$@")
            inject=1
            have_c=0
            have_cxx=0
            have_ipo=0
            for arg in "$@"; do
              case "${arg}" in
                --build|--install|-E|-P|--version|--help|--help-*|--system-information|--find-package|--workflow)
                  inject=0
                  break
                  ;;
                -DCMAKE_C_COMPILER_LAUNCHER=*) have_c=1 ;;
                -DCMAKE_CXX_COMPILER_LAUNCHER=*) have_cxx=1 ;;
                -DENABLE_IPO=*) have_ipo=1 ;;
              esac
            done
            if [ "${inject}" = "1" ]; then
              [ "${have_c}" = "1" ] || args+=("-DCMAKE_C_COMPILER_LAUNCHER=ccache")
              [ "${have_cxx}" = "1" ] || args+=("-DCMAKE_CXX_COMPILER_LAUNCHER=ccache")
              if [ "${VLINK_CMAKE_DISABLE_IPO:-false}" = "true" ] && [ "${have_ipo}" = "0" ]; then
                args+=("-DENABLE_IPO=OFF")
              fi
            fi
            exec "${VLINK_REAL_CMAKE}" "${args[@]}"
            EOF
            chmod +x "${wrapper_dir}/cmake"
            export VLINK_REAL_CMAKE="${real_cmake}"
            export PATH="${wrapper_dir}:${PATH}"

            bash packup/build-conan.sh . ${{ matrix.arch }}

      - name: Verify bundled Linux OSG files
        uses: ./.github/actions/docker-run
        with:
          image: ${{ steps.portable-image.outputs.image }}
          command: |
            set -euo pipefail
            for path in \
              lib/libOpenThreads.so.21 \
              lib/libosg.so.161 \
              lib/libosgDB.so.161 \
              lib/libosgGA.so.161 \
              lib/libosgManipulator.so.161 \
              lib/libosgUtil.so.161 \
              lib/libosgText.so.161 \
              lib/libosgViewer.so.161 \
              lib/osgPlugins-3.6.5/osgdb_freetype.so \
              lib/osgPlugins-3.6.5/osgdb_obj.so \
              lib/osgPlugins-3.6.5/osgdb_osg.so \
              lib/osgPlugins-3.6.5/osgdb_serializers_osg.so; do
              test -f "build-conan/packup/linux/vlink/${path}"
            done

      - name: Check Linux runtime closure
        uses: ./.github/actions/docker-run
        with:
          image: ${{ steps.portable-image.outputs.image }}
          command: |
            set -euo pipefail
            export LD_LIBRARY_PATH="$PWD/build-conan/packup/linux/vlink/lib:${LD_LIBRARY_PATH:-}"
            while IFS= read -r binary; do
              echo "ldd -r ${binary}"
              ldd -r "${binary}" >/tmp/ldd.out
              cat /tmp/ldd.out
              if grep -q "not found" /tmp/ldd.out; then
                exit 1
              fi
            done < <(find build-conan/packup/linux/vlink/bin build-conan/packup/linux/vlink/lib -type f -print0 \
              | xargs -0 file \
              | awk -F: '/ELF/ {print $1}')

      - name: Verify Linux portable outputs
        uses: ./.github/actions/verify-artifacts
        with:
          globs: |
            build-conan/packup/linux/*.tgz
            build-conan/packup/linux/*.run

      - name: Upload Linux portable artifacts
        uses: actions/upload-artifact@v7
        with:
          name: vlink-portable-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            build-conan/packup/linux/*.tgz
            build-conan/packup/linux/*.run

  portable-linux-aarch64:
    name: portable-linux-aarch64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GHCR
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare aarch64 Qt release image
        id: release-image
        uses: ./.github/actions/prepare-ci-image
        with:
          image: ghcr.io/${{ github.repository_owner }}/vlink-release-ubuntu20-qt-aarch64:${{ inputs.container_image_tag }}
          context: .github/docker/release-ubuntu20-qt-aarch64
          dockerfile: .github/docker/release-ubuntu20-qt-aarch64/Dockerfile
          local-tag: vlink-release-ubuntu20-qt-aarch64:release-local
          allow-build: "false"
          required-tools: bash binarycreator ccache cmake conan git git-lfs ninja patch patchelf qmake

      - name: Setup OSG SDK
        uses: ./.github/actions/setup-osg-sdk
        with:
          repository: ${{ inputs.osg_sdk_repository }}
          ref: ${{ inputs.osg_sdk_ref }}
          platform-dir: linux_aarch64
          validation-paths: |
            include/osg
            lib
            lib/libOpenThreads.so.3.3.1
            lib/libosg.so.161
            lib/libosgDB.so.161
            lib/libosgGA.so.161
            lib/libosgManipulator.so.161
            lib/libosgUtil.so.161
            lib/libosgText.so.161
            lib/libosgViewer.so.161
            lib/osgPlugins-3.6.5/osgdb_freetype.so
            lib/osgPlugins-3.6.5/osgdb_obj.so
            lib/osgPlugins-3.6.5/osgdb_osg.so
            lib/osgPlugins-3.6.5/osgdb_serializers_osg.so
          cache-suffix: v1

      - name: Restore Conan and CPM caches
        uses: ./.github/actions/restore-build-cache
        with:
          path: |
            ~/.conan2
            ~/.vlink-cpm-cache
          key: conan-cpm-linux-aarch64-${{ hashFiles('conanfile.py', 'packup/conan_profile', 'cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}
          restore-keys: conan-cpm-linux-aarch64-

      - name: Restore ccache
        uses: ./.github/actions/restore-build-cache
        with:
          path: ~/.ccache
          key: ccache-release-linux-aarch64-${{ github.sha }}
          restore-keys: ccache-release-linux-aarch64-

      - name: Build aarch64 portable archive and QtIFW installer
        uses: ./.github/actions/docker-run
        with:
          image: ${{ steps.release-image.outputs.image }}
          command: |
            set -euo pipefail
            grep -q '20.04' /etc/os-release
            test "$(uname -m)" = "aarch64"
            "${QT_DIR}/bin/qmake" -query QT_VERSION | grep -q '^${{ inputs.qt_version }}$'
            test -x "${QTIFW_DIR}/bin/binarycreator"
            conan --version
            git lfs version
            patch --version | head -n 1

            export OSG_DIR="${HOME}/.vlink-ci/osg_sdk/linux_aarch64"
            for path in \
              include/osg \
              lib \
              lib/libOpenThreads.so.3.3.1 \
              lib/libosg.so.161 \
              lib/libosgDB.so.161 \
              lib/libosgGA.so.161 \
              lib/libosgManipulator.so.161 \
              lib/libosgUtil.so.161 \
              lib/libosgText.so.161 \
              lib/libosgViewer.so.161 \
              lib/osgPlugins-3.6.5/osgdb_freetype.so \
              lib/osgPlugins-3.6.5/osgdb_obj.so \
              lib/osgPlugins-3.6.5/osgdb_osg.so \
              lib/osgPlugins-3.6.5/osgdb_serializers_osg.so; do
              test -e "${OSG_DIR}/${path}"
            done

            export CCACHE_DIR="${HOME}/.ccache"
            export CCACHE_BASEDIR="${GITHUB_WORKSPACE}"
            export CCACHE_COMPRESS=true
            export CCACHE_MAXSIZE=2G
            ccache --zero-stats || true
            trap 'ccache --show-stats || true' EXIT

            wrapper_dir="${HOME}/.vlink-cmake-wrapper"
            mkdir -p "${wrapper_dir}"
            real_cmake="$(command -v cmake)"
            cat > "${wrapper_dir}/cmake" <<'EOF'
            #!/usr/bin/env bash
            set -euo pipefail
            args=("$@")
            inject=1
            have_c=0
            have_cxx=0
            have_ipo=0
            for arg in "$@"; do
              case "${arg}" in
                --build|--install|-E|-P|--version|--help|--help-*|--system-information|--find-package|--workflow)
                  inject=0
                  break
                  ;;
                -DCMAKE_C_COMPILER_LAUNCHER=*) have_c=1 ;;
                -DCMAKE_CXX_COMPILER_LAUNCHER=*) have_cxx=1 ;;
                -DENABLE_IPO=*) have_ipo=1 ;;
              esac
            done
            if [ "${inject}" = "1" ]; then
              [ "${have_c}" = "1" ] || args+=("-DCMAKE_C_COMPILER_LAUNCHER=ccache")
              [ "${have_cxx}" = "1" ] || args+=("-DCMAKE_CXX_COMPILER_LAUNCHER=ccache")
              [ "${have_ipo}" = "1" ] || args+=("-DENABLE_IPO=OFF")
            fi
            exec "${VLINK_REAL_CMAKE}" "${args[@]}"
            EOF
            chmod +x "${wrapper_dir}/cmake"
            export VLINK_REAL_CMAKE="${real_cmake}"
            export PATH="${wrapper_dir}:${PATH}"

            bash packup/build-conan.sh . aarch64

      - name: Verify bundled Linux OSG files
        run: |
          set -euo pipefail
          for path in \
            lib/libOpenThreads.so.21 \
            lib/libosg.so.161 \
            lib/libosgDB.so.161 \
            lib/libosgGA.so.161 \
            lib/libosgManipulator.so.161 \
            lib/libosgUtil.so.161 \
            lib/libosgText.so.161 \
            lib/libosgViewer.so.161 \
            lib/osgPlugins-3.6.5/osgdb_freetype.so \
            lib/osgPlugins-3.6.5/osgdb_obj.so \
            lib/osgPlugins-3.6.5/osgdb_osg.so \
            lib/osgPlugins-3.6.5/osgdb_serializers_osg.so; do
            test -f "build-conan/packup/linux/vlink/${path}"
          done

      - name: Check Linux runtime closure
        uses: ./.github/actions/docker-run
        with:
          image: ${{ steps.release-image.outputs.image }}
          command: |
            set -euo pipefail
            export LD_LIBRARY_PATH="$PWD/build-conan/packup/linux/vlink/lib:${LD_LIBRARY_PATH:-}"
            while IFS= read -r binary; do
              echo "ldd -r ${binary}"
              ldd -r "${binary}" >/tmp/ldd.out
              cat /tmp/ldd.out
              if grep -q "not found" /tmp/ldd.out; then
                exit 1
              fi
            done < <(find build-conan/packup/linux/vlink/bin build-conan/packup/linux/vlink/lib -type f -print0 \
              | xargs -0 file \
              | awk -F: '/ELF/ {print $1}')

      - name: Verify Linux portable outputs
        uses: ./.github/actions/verify-artifacts
        with:
          globs: |
            build-conan/packup/linux/*.tgz
            build-conan/packup/linux/*.run

      - name: Upload Linux portable artifacts
        uses: actions/upload-artifact@v7
        with:
          name: vlink-portable-linux-aarch64
          if-no-files-found: error
          path: |
            build-conan/packup/linux/*.tgz
            build-conan/packup/linux/*.run
