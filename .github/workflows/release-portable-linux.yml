name: Release Portable Linux

on:
  workflow_call:
    inputs:
      qt_version:
        required: true
        type: string
      osg_sdk_repository:
        required: true
        type: string
      osg_sdk_ref:
        required: true
        type: string
      container_image_tag:
        required: false
        type: string
        default: latest

permissions:
  contents: read
  packages: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  PIP_DISABLE_PIP_VERSION_CHECK: 1

jobs:
  portable-linux:
    name: portable-linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    container:
      image: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ inputs.container_image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            image: vlink-release-ubuntu20
            osg_platform: linux_x86_64
            setup_qt: "true"
            qt_arch: linux_gcc_64
            qt_modules: qtsvg qtwayland
            qt_cache_suffix: linux_gcc_64-ifw-47
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: vlink-release-ubuntu20-qt-aarch64
            osg_platform: linux_aarch64
            setup_qt: "false"
            qt_arch: none
            qt_modules: ""
            qt_cache_suffix: prebuilt-aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check build host
        run: |
          set -euo pipefail
          grep -q '20.04' /etc/os-release
          test "$(uname -m)" = "${{ matrix.arch }}"
          cmake --version
          ninja --version
          patch --version | head -n 1
          git lfs version
          if [ "${{ matrix.setup_qt }}" = "false" ]; then
            test -n "${QT_DIR:-}"
            test -n "${QTIFW_DIR:-}"
            "${QT_DIR}/bin/qmake" -query QT_VERSION | grep -q '^${{ inputs.qt_version }}$'
            "${QTIFW_DIR}/bin/binarycreator" --version
            conan --version
          fi

      - name: Setup Qt and QtIFW
        if: matrix.setup_qt == 'true'
        uses: ./.github/actions/setup-qt-ifw
        with:
          host: linux
          qt-version: ${{ inputs.qt_version }}
          qt-arch: ${{ matrix.qt_arch }}
          qt-modules: ${{ matrix.qt_modules }}
          qtifw-package: qt.tools.ifw.47
          cache-suffix: ${{ matrix.qt_cache_suffix }}

      - name: Setup OSG SDK
        uses: ./.github/actions/setup-osg-sdk
        with:
          repository: ${{ inputs.osg_sdk_repository }}
          ref: ${{ inputs.osg_sdk_ref }}
          platform-dir: ${{ matrix.osg_platform }}
          validation-paths: |
            include/osg
            lib
            lib/libOpenThreads.so.3.3.1
            lib/libosg.so.161
            lib/libosgDB.so.161
            lib/libosgGA.so.161
            lib/libosgManipulator.so.161
            lib/libosgUtil.so.161
            lib/libosgText.so.161
            lib/libosgViewer.so.161
            lib/osgPlugins-3.6.5/osgdb_freetype.so
            lib/osgPlugins-3.6.5/osgdb_obj.so
            lib/osgPlugins-3.6.5/osgdb_osg.so
            lib/osgPlugins-3.6.5/osgdb_serializers_osg.so
          cache-suffix: v1

      - name: Restore Conan and CPM caches
        uses: ./.github/actions/restore-build-cache
        with:
          path: |
            ~/.conan2
            ~/.vlink-cpm-cache
          key: conan-cpm-linux-${{ matrix.arch }}-${{ hashFiles('conanfile.py', 'packup/conan_profile', 'cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}

      - name: Build portable archive and QtIFW installer
        run: bash packup/build-conan.sh . ${{ matrix.arch }}

      - name: Verify bundled Linux OSG files
        run: |
          set -euo pipefail
          for path in \
            lib/libOpenThreads.so.21 \
            lib/libosg.so.161 \
            lib/libosgDB.so.161 \
            lib/libosgGA.so.161 \
            lib/libosgManipulator.so.161 \
            lib/libosgUtil.so.161 \
            lib/libosgText.so.161 \
            lib/libosgViewer.so.161 \
            lib/osgPlugins-3.6.5/osgdb_freetype.so \
            lib/osgPlugins-3.6.5/osgdb_obj.so \
            lib/osgPlugins-3.6.5/osgdb_osg.so \
            lib/osgPlugins-3.6.5/osgdb_serializers_osg.so; do
            test -f "build-conan/packup/linux/vlink/${path}"
          done

      - name: Check Linux runtime closure
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/build-conan/packup/linux/vlink/lib:${LD_LIBRARY_PATH:-}"
          while IFS= read -r binary; do
            echo "ldd -r ${binary}"
            ldd -r "${binary}" >/tmp/ldd.out
            cat /tmp/ldd.out
            if grep -q "not found" /tmp/ldd.out; then
              exit 1
            fi
          done < <(find build-conan/packup/linux/vlink/bin build-conan/packup/linux/vlink/lib -type f -print0 \
            | xargs -0 file \
            | awk -F: '/ELF/ {print $1}')

      - name: Verify Linux portable outputs
        uses: ./.github/actions/verify-artifacts
        with:
          globs: |
            build-conan/packup/linux/*.tgz
            build-conan/packup/linux/*.run

      - name: Upload Linux portable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vlink-portable-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            build-conan/packup/linux/*.tgz
            build-conan/packup/linux/*.run
