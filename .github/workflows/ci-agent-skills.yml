name: CI Agent Skills

on:
  pull_request:
    branches:
      - master
      - main
      - develop
      - dev
    paths:
      - 'AGENTS.md'
      - 'AI-POLICY.md'
      - '.agents/**'
      - 'tools/install_skills.sh'
      - '.github/copilot-instructions.md'
      - '.github/scripts/test-validate-agent-skills.sh'
      - '.github/scripts/validate-agent-skills.sh'
      - '.github/workflows/ci-agent-skills.yml'
  push:
    branches:
      - master
      - main
      - develop
      - dev
    paths:
      - 'AGENTS.md'
      - 'AI-POLICY.md'
      - '.agents/**'
      - 'tools/install_skills.sh'
      - '.github/copilot-instructions.md'
      - '.github/scripts/test-validate-agent-skills.sh'
      - '.github/scripts/validate-agent-skills.sh'
      - '.github/workflows/ci-agent-skills.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-agent-skills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate Agent skills
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check shell syntax
        run: |
          bash -n tools/install_skills.sh
          bash -n .github/scripts/test-validate-agent-skills.sh
          bash -n .github/scripts/validate-agent-skills.sh

      - name: Test Agent skill validator
        env:
          PYTHONPYCACHEPREFIX: ${{ github.workspace }}/build-ai/ci-agent-skills/__pycache__
        run: bash .github/scripts/test-validate-agent-skills.sh

      - name: Validate Agent skills
        env:
          PYTHONPYCACHEPREFIX: ${{ github.workspace }}/build-ai/ci-agent-skills/__pycache__
        run: bash .github/scripts/validate-agent-skills.sh
