name: CI Test

on:
  pull_request:
    branches:
      - master
      - main
      - develop
    paths:
      - CMakeLists.txt
      - cmake/**
      - conanfile.py
      - include/**
      - src/**
      - modules/**
      - proxy/**
      - c_api/**
      - cli/**
      - exprtk/**
      - python_api/**
      - test/**
      - thirdparty/**
      - packup/patch/**
      - .github/actions/assert-cmake-config/**
      - .github/actions/cmake-build/**
      - .github/actions/docker-run/**
      - .github/actions/prepare-ci-image/**
      - .github/actions/restore-build-cache/**
      - .github/actions/setup-compiler-cache/**
      - .github/actions/setup-msvc-devcmd/**
      - .github/actions/setup-windows-msvc-tools/**
      - .github/actions/setup-windows-openssl/**
      - .github/docker/ci-ubuntu24/**
      - .github/scripts/assert-cmake-config.py
      - .github/workflows/ci-test.yml
  push:
    branches:
      - master
      - main
      - develop
    paths:
      - CMakeLists.txt
      - cmake/**
      - conanfile.py
      - include/**
      - src/**
      - modules/**
      - proxy/**
      - c_api/**
      - cli/**
      - exprtk/**
      - python_api/**
      - test/**
      - thirdparty/**
      - packup/patch/**
      - .github/actions/assert-cmake-config/**
      - .github/actions/cmake-build/**
      - .github/actions/docker-run/**
      - .github/actions/prepare-ci-image/**
      - .github/actions/restore-build-cache/**
      - .github/actions/setup-compiler-cache/**
      - .github/actions/setup-msvc-devcmd/**
      - .github/actions/setup-windows-msvc-tools/**
      - .github/actions/setup-windows-openssl/**
      - .github/docker/ci-ubuntu24/**
      - .github/scripts/assert-cmake-config.py
      - .github/workflows/ci-test.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-test-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CCACHE_COMPRESS: "true"
  CCACHE_MAXSIZE: 1G
  CTEST_OUTPUT_ON_FAILURE: 1
  VLINK_CI_CMAKE_ARGS: >-
    -G Ninja
    -DCMAKE_BUILD_TYPE=Release
    -DENABLE_IPO=OFF
    -DBUILD_SHARED_LIBS=ON
    -DENABLE_CPM=ON
    -DENABLE_CPM_SQLITE3=ON
    -DENABLE_CPM_ZSTD=ON
    -DENABLE_CPM_PROTOBUF=ON
    -DENABLE_CPM_FLATBUFFERS=ON
    -DENABLE_CXX_STD_20=OFF
    -DENABLE_VIEWER=OFF
    -DENABLE_WEBVIZ=OFF
    -DENABLE_IOX_ROUDI=OFF
    -DENABLE_EXAMPLES=OFF
    -DENABLE_PYTHON_API=ON
    -DENABLE_TEST=ON
    -DENABLE_TEST_SANITIZE=OFF
    -DENABLE_TEST_WARN=ON

jobs:
  test-linux-x86:
    name: linux-x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GHCR
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare CI image
        id: ci-image
        uses: ./.github/actions/prepare-ci-image
        with:
          image: ghcr.io/${{ github.repository_owner }}/vlink-ci-ubuntu24:latest
          context: .github/docker/ci-ubuntu24
          dockerfile: .github/docker/ci-ubuntu24/Dockerfile
          local-tag: vlink-ci-ubuntu24:test-local
          required-tools: /opt/vlink/python-tools/bin/python ccache cmake ninja python3 python3-config
          verify-command: /opt/vlink/python-tools/bin/python -c 'import nanobind'

      - name: Restore CPM cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: ~/.vlink-cpm-cache
          key: cpm-test-linux-x86_64-${{ hashFiles('cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}
          restore-keys: cpm-test-linux-x86_64-

      - name: Setup ccache
        uses: ./.github/actions/setup-compiler-cache
        with:
          backend: ccache
          cache-key: ccache-ci-linux-x86_64-test-${{ github.sha }}
          restore-keys: |
            ccache-ci-linux-x86_64-
          max-size: 1G

      - name: Restore CPM build cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: build-test/_deps
          key: cpm-build-test-linux-x86_64-v1-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}

      - name: Configure, build and test
        uses: ./.github/actions/docker-run
        with:
          image: ${{ steps.ci-image.outputs.image }}
          command: |
            set -euo pipefail
            git config --global --add safe.directory "${GITHUB_WORKSPACE}"
            test "$(uname -m)" = "x86_64"
            export CCACHE_DIR="${HOME}/.ccache"
            export CCACHE_BASEDIR="${GITHUB_WORKSPACE}"
            ccache --zero-stats || true
            cmake -S . -B build-test ${VLINK_CI_CMAKE_ARGS} \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DPython_EXECUTABLE=/opt/vlink/python-tools/bin/python \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DENABLE_TEST_SANITIZE=ON
            cmake --build build-test --parallel
            export BUILD_DIR=build-test
            export REQUIRED_CACHE="ENABLE_WEBVIZ=OFF
            ENABLE_IPO=OFF
            ENABLE_PYTHON_API=ON
            ENABLE_TEST=ON
            ENABLE_TEST_SANITIZE=ON
            ENABLE_TEST_WARN=ON"
            export REQUIRED_SOURCE_PREFIXES="python_api/"
            python3 .github/scripts/assert-cmake-config.py
            export ASAN_OPTIONS=detect_leaks=1:halt_on_error=1:abort_on_error=1
            export LSAN_OPTIONS=print_suppressions=0
            asan_lib="$(gcc -print-file-name=libasan.so)"
            stdcxx_lib="$(g++ -print-file-name=libstdc++.so)"
            test -f "${asan_lib}"
            test -f "${stdcxx_lib}"
            export LD_PRELOAD="${asan_lib}:${stdcxx_lib}${LD_PRELOAD:+:${LD_PRELOAD}}"
            export LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/build-test/output/bin:${GITHUB_WORKSPACE}/build-test/output/lib:${GITHUB_WORKSPACE}/build-test/output/external/lib:${LD_LIBRARY_PATH:-}"
            proxy_pid=""
            if [ ! -x build-test/output/bin/vlink-proxy ]; then
              echo "Missing vlink-proxy before unit tests" >&2
              exit 1
            fi
            build-test/output/bin/vlink-proxy -c -n -m off > build-test/vlink-proxy.log 2>&1 &
            proxy_pid="$!"
            trap 'if [ -n "${proxy_pid}" ]; then kill "${proxy_pid}" 2>/dev/null || true; wait "${proxy_pid}" 2>/dev/null || true; fi' EXIT
            sleep 2
            if ! kill -0 "${proxy_pid}" 2>/dev/null; then
              cat build-test/vlink-proxy.log || true
              echo "vlink-proxy exited before unit tests" >&2
              exit 1
            fi
            ctest --test-dir build-test --output-on-failure --timeout 180 --parallel 1 --exclude-regex '^(xmltest|ucunit)$|^CUnit_'
            export PYTHONPATH="${GITHUB_WORKSPACE}/python_api:${GITHUB_WORKSPACE}/build-test/output/lib"
            ASAN_OPTIONS=detect_leaks=0:halt_on_error=1:abort_on_error=1 /opt/vlink/python-tools/bin/python python_api/test/test_vlink.py
            ccache --show-stats || true

  test-windows-x64:
    name: windows-x64
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable MSVC developer environment
        uses: ./.github/actions/setup-msvc-devcmd

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Python dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install nanobind==2.13.0
          $PythonExecutable = (python -c "import sys; print(sys.executable)").Replace("\", "/")
          "PYTHON_EXECUTABLE=$PythonExecutable" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup OpenSSL
        uses: ./.github/actions/setup-windows-openssl

      - name: Setup sccache
        uses: ./.github/actions/setup-compiler-cache
        with:
          backend: sccache
          cache-key: vlink-test-windows-msvc-v1

      - name: Setup MSVC tools
        uses: ./.github/actions/setup-windows-msvc-tools

      - name: Restore CPM cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: ~/.vlink-cpm-cache
          key: cpm-test-windows-x64-${{ hashFiles('cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}
          restore-keys: cpm-test-windows-x64-

      - name: Restore CPM build cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: build-test/_deps
          key: cpm-build-test-windows-x64-v1-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}

      - name: Configure and build
        uses: ./.github/actions/cmake-build
        with:
          build-dir: build-test
          cmake-args: ${{ env.VLINK_CI_CMAKE_ARGS }}
          configure-extra-args: >-
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
            -DCMAKE_C_COMPILER_LAUNCHER=sccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
            -DENABLE_WEBVIZ=OFF
            -DENABLE_TEST_SANITIZE=OFF

      - name: Assert configured features
        uses: ./.github/actions/assert-cmake-config
        with:
          build-dir: build-test
          required-cache: |
            ENABLE_WEBVIZ=OFF
            ENABLE_IPO=OFF
            ENABLE_PYTHON_API=ON
            ENABLE_TEST=ON
            ENABLE_TEST_SANITIZE=OFF
            ENABLE_TEST_WARN=ON
          required-source-prefixes: |
            python_api/

      - name: Run unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:Path = "$PWD\build-test\output\bin;$PWD\build-test\output\lib;$PWD\build-test\output\external\bin;$PWD\build-test\output\external\lib;$env:Path"
          $ProxyExe = Join-Path $PWD "build-test\output\bin\vlink-proxy.exe"
          if (!(Test-Path $ProxyExe)) {
            throw "Missing vlink-proxy before unit tests: $ProxyExe"
          }
          $ProxyOut = Join-Path $PWD "build-test\vlink-proxy.out.log"
          $ProxyErr = Join-Path $PWD "build-test\vlink-proxy.err.log"
          $Proxy = Start-Process -FilePath $ProxyExe -ArgumentList @("-c", "-n", "-m", "off") -PassThru -RedirectStandardOutput $ProxyOut -RedirectStandardError $ProxyErr
          try {
            Start-Sleep -Seconds 2
            if ($Proxy.HasExited) {
              if (Test-Path $ProxyOut) { Get-Content $ProxyOut }
              if (Test-Path $ProxyErr) { Get-Content $ProxyErr }
              throw "vlink-proxy exited before unit tests"
            }
            ctest --test-dir build-test --output-on-failure --timeout 180 --parallel 1 --exclude-regex '^(xmltest|ucunit)$|^CUnit_'
          } finally {
            if ($Proxy -and -not $Proxy.HasExited) {
              Stop-Process -Id $Proxy.Id -Force -ErrorAction SilentlyContinue
              Wait-Process -Id $Proxy.Id -ErrorAction SilentlyContinue
            }
          }

      - name: Run Python API tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Module = Get-ChildItem -Path "$PWD\build-test" -Recurse -Filter "_vlink_nanobind*.pyd" | Select-Object -First 1
          if (-not $Module) {
            throw "Missing _vlink_nanobind*.pyd under build-test"
          }
          $DllDirs = Get-ChildItem -Path "$PWD\build-test" -Recurse -Include "*.dll","*.pyd" |
            ForEach-Object { $_.DirectoryName } |
            Sort-Object -Unique
          $RuntimeDirs = @(
            "$PWD\build-test\output\bin",
            "$PWD\build-test\output\lib",
            "$PWD\build-test\output\external\bin",
            "$PWD\build-test\output\external\lib"
          )
          $env:PYTHONPATH = (@("$PWD\python_api", "$PWD\build-test\output\lib", $Module.DirectoryName) |
            Sort-Object -Unique) -join ";"
          $env:Path = (($RuntimeDirs + $DllDirs | Where-Object { Test-Path $_ } | Sort-Object -Unique) -join ";") + ";$env:Path"
          python python_api\test\test_vlink.py

      - name: Show sccache stats
        if: always()
        shell: pwsh
        run: sccache --show-stats || true

  test-macos-x86:
    name: macos-x86_64
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build tools
        run: brew install ccache ninja openssl@3

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install nanobind==2.13.0
          echo "PYTHON_EXECUTABLE=$(python -c 'import sys; print(sys.executable)')" >> "${GITHUB_ENV}"

      - name: Check toolchain
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          cmake --version
          ninja --version
          ccache --version
          patch --version | head -n 1
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "${GITHUB_ENV}"

      - name: Restore CPM cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: ~/.vlink-cpm-cache
          key: cpm-test-macos-x86_64-${{ hashFiles('cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}
          restore-keys: cpm-test-macos-x86_64-

      - name: Setup ccache
        uses: ./.github/actions/setup-compiler-cache
        with:
          backend: ccache
          cache-key: ccache-ci-macos-x86_64-test-${{ github.sha }}
          restore-keys: |
            ccache-ci-macos-x86_64-
          max-size: 1G

      - name: Restore CPM build cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: build-test/_deps
          key: cpm-build-test-macos-x86_64-v1-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}

      - name: Configure and build
        uses: ./.github/actions/cmake-build
        with:
          build-dir: build-test
          cmake-args: ${{ env.VLINK_CI_CMAKE_ARGS }}
          configure-extra-args: >-
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            -DBUILD_SHARED_LIBS=OFF
            -DENABLE_WEBVIZ=OFF
            -DENABLE_TEST_SANITIZE=OFF

      - name: Assert configured features
        uses: ./.github/actions/assert-cmake-config
        with:
          build-dir: build-test
          required-cache: |
            ENABLE_WEBVIZ=OFF
            BUILD_SHARED_LIBS=OFF
            ENABLE_IPO=OFF
            ENABLE_PYTHON_API=ON
            ENABLE_TEST=ON
            ENABLE_TEST_SANITIZE=OFF
            ENABLE_TEST_WARN=ON
          required-source-prefixes: |
            python_api/

      - name: Run unit tests
        run: |
          export DYLD_LIBRARY_PATH="${PWD}/build-test/output/bin:${PWD}/build-test/output/lib:${PWD}/build-test/output/external/lib:${DYLD_LIBRARY_PATH:-}"
          proxy_pid=""
          if [ ! -x build-test/output/bin/vlink-proxy ]; then
            echo "Missing vlink-proxy before unit tests" >&2
            exit 1
          fi
          build-test/output/bin/vlink-proxy -c -n -m off > build-test/vlink-proxy.log 2>&1 &
          proxy_pid="$!"
          trap 'if [ -n "${proxy_pid}" ]; then kill "${proxy_pid}" 2>/dev/null || true; wait "${proxy_pid}" 2>/dev/null || true; fi' EXIT
          sleep 2
          if ! kill -0 "${proxy_pid}" 2>/dev/null; then
            cat build-test/vlink-proxy.log || true
            echo "vlink-proxy exited before unit tests" >&2
            exit 1
          fi
          ctest --test-dir build-test --output-on-failure --timeout 360 --parallel 1 --exclude-regex '^(xmltest|ucunit)$|^CUnit_'

      - name: Run Python API tests
        run: |
          export DYLD_LIBRARY_PATH="${PWD}/build-test/output/lib:${DYLD_LIBRARY_PATH:-}"
          export PYTHONPATH="${PWD}/python_api:${PWD}/build-test/output/lib"
          python python_api/test/test_vlink.py

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats || true
