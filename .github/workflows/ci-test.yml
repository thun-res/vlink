name: CI Test

on:
  pull_request:
    branches:
      - master
      - main
      - develop
  push:
    branches:
      - master
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-test-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CCACHE_COMPRESS: "true"
  CCACHE_MAXSIZE: 1G
  CTEST_OUTPUT_ON_FAILURE: 1
  VLINK_CI_CMAKE_ARGS: >-
    -G Ninja
    -DCMAKE_BUILD_TYPE=Release
    -DBUILD_SHARED_LIBS=ON
    -DENABLE_CPM=ON
    -DENABLE_CPM_SQLITE3=ON
    -DENABLE_CPM_ZSTD=ON
    -DENABLE_CPM_PROTOBUF=ON
    -DENABLE_CPM_FLATBUFFERS=ON
    -DENABLE_CXX_STD_20=OFF
    -DENABLE_VIEWER=OFF
    -DENABLE_WEBVIZ=OFF
    -DENABLE_IOX_ROUDI=OFF
    -DENABLE_EXAMPLES=OFF
    -DENABLE_TEST=ON
    -DENABLE_TEST_WARN=OFF

jobs:
  test-linux-x86:
    name: linux-x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare CI image
        id: ci-image
        uses: ./.github/actions/prepare-ci-image
        with:
          image: ghcr.io/${{ github.repository_owner }}/vlink-ci-ubuntu24:latest
          context: .github/docker/ci-ubuntu24
          dockerfile: .github/docker/ci-ubuntu24/Dockerfile
          local-tag: vlink-ci-ubuntu24:test-local
          required-tools: ccache cmake ninja python3

      - name: Restore CPM cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: ~/.vlink-cpm-cache
          key: cpm-test-linux-x86_64-${{ hashFiles('cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}
          restore-keys: cpm-test-linux-x86_64-

      - name: Setup ccache
        uses: ./.github/actions/setup-compiler-cache
        with:
          backend: ccache
          cache-key: ccache-test-linux-x86_64-${{ github.run_id }}
          restore-keys: ccache-test-linux-x86_64-
          max-size: 1G

      - name: Restore CPM build cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: build-test/_deps
          key: cpm-build-test-linux-x86_64-v1-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}

      - name: Configure, build and test
        uses: ./.github/actions/docker-run
        with:
          image: ${{ steps.ci-image.outputs.image }}
          command: |
            set -euo pipefail
            git config --global --add safe.directory "${GITHUB_WORKSPACE}"
            test "$(uname -m)" = "x86_64"
            export CCACHE_DIR="${HOME}/.ccache"
            export CCACHE_BASEDIR="${GITHUB_WORKSPACE}"
            ccache --zero-stats || true
            cmake -S . -B build-test ${VLINK_CI_CMAKE_ARGS} \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            cmake --build build-test --parallel
            ctest --test-dir build-test --output-on-failure --timeout 180 --parallel 1
            ccache --show-stats || true

  test-windows-x64:
    name: windows-x64
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup OpenSSL
        uses: ./.github/actions/setup-windows-openssl

      - name: Setup sccache
        uses: ./.github/actions/setup-compiler-cache
        with:
          backend: sccache
          cache-key: vlink-test-windows-msvc-v1

      - name: Setup MSVC tools
        uses: ./.github/actions/setup-windows-msvc-tools

      - name: Restore CPM cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: ~/.vlink-cpm-cache
          key: cpm-test-windows-x64-${{ hashFiles('cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}
          restore-keys: cpm-test-windows-x64-

      - name: Restore CPM build cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: build-test/_deps
          key: cpm-build-test-windows-x64-v1-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}

      - name: Configure and build
        uses: ./.github/actions/cmake-build
        with:
          build-dir: build-test
          cmake-args: ${{ env.VLINK_CI_CMAKE_ARGS }}
          configure-extra-args: >-
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
            -DCMAKE_C_COMPILER_LAUNCHER=sccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Run unit tests
        shell: pwsh
        run: ctest --test-dir build-test --output-on-failure --timeout 180 --parallel 1

      - name: Show sccache stats
        if: always()
        shell: pwsh
        run: sccache --show-stats || true

  test-macos-x86:
    name: macos-x86_64
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install ccache ninja openssl@3

      - name: Check toolchain
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          cmake --version
          ninja --version
          ccache --version
          patch --version | head -n 1
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "${GITHUB_ENV}"

      - name: Restore CPM cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: ~/.vlink-cpm-cache
          key: cpm-test-macos-x86_64-${{ hashFiles('cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}
          restore-keys: cpm-test-macos-x86_64-

      - name: Setup ccache
        uses: ./.github/actions/setup-compiler-cache
        with:
          backend: ccache
          cache-key: ccache-test-macos-x86_64-${{ github.run_id }}
          restore-keys: ccache-test-macos-x86_64-
          max-size: 1G

      - name: Restore CPM build cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: build-test/_deps
          key: cpm-build-test-macos-x86_64-v1-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}

      - name: Configure and build
        uses: ./.github/actions/cmake-build
        with:
          build-dir: build-test
          cmake-args: ${{ env.VLINK_CI_CMAKE_ARGS }}
          configure-extra-args: >-
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Run unit tests
        run: ctest --test-dir build-test --output-on-failure --timeout 180 --parallel 1

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats || true
