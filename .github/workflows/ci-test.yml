name: CI Test

on:
  pull_request:
    branches:
      - master
      - main
      - develop
  push:
    branches:
      - master
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-test-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CCACHE_COMPRESS: "true"
  CCACHE_MAXSIZE: 1G
  CTEST_OUTPUT_ON_FAILURE: 1
  VLINK_CI_CMAKE_ARGS: >-
    -G Ninja
    -DCMAKE_BUILD_TYPE=Release
    -DENABLE_IPO=OFF
    -DBUILD_SHARED_LIBS=ON
    -DENABLE_CPM=ON
    -DENABLE_CPM_SQLITE3=ON
    -DENABLE_CPM_ZSTD=ON
    -DENABLE_CPM_PROTOBUF=ON
    -DENABLE_CPM_FLATBUFFERS=ON
    -DENABLE_CXX_STD_20=OFF
    -DENABLE_VIEWER=OFF
    -DENABLE_WEBVIZ=ON
    -DENABLE_IOX_ROUDI=OFF
    -DENABLE_EXAMPLES=OFF
    -DENABLE_PYTHON_API=ON
    -DENABLE_TEST=ON
    -DENABLE_TEST_SANITIZE=ON
    -DENABLE_TEST_WARN=ON

jobs:
  test-linux-x86:
    name: linux-x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare CI image
        id: ci-image
        uses: ./.github/actions/prepare-ci-image
        with:
          image: ghcr.io/${{ github.repository_owner }}/vlink-ci-ubuntu24:latest
          context: .github/docker/ci-ubuntu24
          dockerfile: .github/docker/ci-ubuntu24/Dockerfile
          local-tag: vlink-ci-ubuntu24:test-local
          required-tools: /opt/vlink/python-tools/bin/python ccache cmake ninja python3 python3-config
          verify-command: /opt/vlink/python-tools/bin/python -c 'import nanobind'

      - name: Restore CPM cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: ~/.vlink-cpm-cache
          key: cpm-test-linux-x86_64-${{ hashFiles('cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}
          restore-keys: cpm-test-linux-x86_64-

      - name: Setup ccache
        uses: ./.github/actions/setup-compiler-cache
        with:
          backend: ccache
          cache-key: ccache-test-linux-x86_64-${{ github.run_id }}
          restore-keys: ccache-test-linux-x86_64-
          max-size: 1G

      - name: Restore CPM build cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: build-test/_deps
          key: cpm-build-test-linux-x86_64-v1-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}

      - name: Configure, build and test
        uses: ./.github/actions/docker-run
        with:
          image: ${{ steps.ci-image.outputs.image }}
          command: |
            set -euo pipefail
            git config --global --add safe.directory "${GITHUB_WORKSPACE}"
            test "$(uname -m)" = "x86_64"
            export CCACHE_DIR="${HOME}/.ccache"
            export CCACHE_BASEDIR="${GITHUB_WORKSPACE}"
            ccache --zero-stats || true
            cmake -S . -B build-test ${VLINK_CI_CMAKE_ARGS} \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DPython_EXECUTABLE=/opt/vlink/python-tools/bin/python \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            cmake --build build-test --parallel
            export BUILD_DIR=build-test
            export REQUIRED_CACHE="ENABLE_WEBVIZ=ON
            ENABLE_IPO=OFF
            ENABLE_PYTHON_API=ON
            ENABLE_TEST=ON
            ENABLE_TEST_SANITIZE=ON
            ENABLE_TEST_WARN=ON"
            export REQUIRED_SOURCE_PREFIXES="webviz/
            python_api/"
            python3 .github/scripts/assert-cmake-config.py
            export ASAN_OPTIONS=detect_leaks=1:halt_on_error=1:abort_on_error=1
            export LSAN_OPTIONS=print_suppressions=0
            ctest --test-dir build-test --output-on-failure --timeout 180 --parallel 1
            asan_lib="$(gcc -print-file-name=libasan.so)"
            if [ -f "${asan_lib}" ]; then
              export LD_PRELOAD="${asan_lib}${LD_PRELOAD:+:${LD_PRELOAD}}"
            fi
            export LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/build-test/output/lib:${LD_LIBRARY_PATH:-}"
            export PYTHONPATH="${GITHUB_WORKSPACE}/python_api:${GITHUB_WORKSPACE}/build-test/output/lib"
            /opt/vlink/python-tools/bin/python python_api/test/test_vlink.py
            ccache --show-stats || true

  test-windows-x64:
    name: windows-x64
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Python dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install nanobind==2.13.0
          $PythonExecutable = (python -c "import sys; print(sys.executable)").Replace("\", "/")
          "PYTHON_EXECUTABLE=$PythonExecutable" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup OpenSSL
        uses: ./.github/actions/setup-windows-openssl

      - name: Setup sccache
        uses: ./.github/actions/setup-compiler-cache
        with:
          backend: sccache
          cache-key: vlink-test-windows-msvc-v1

      - name: Setup MSVC tools
        uses: ./.github/actions/setup-windows-msvc-tools

      - name: Restore CPM cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: ~/.vlink-cpm-cache
          key: cpm-test-windows-x64-${{ hashFiles('cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}
          restore-keys: cpm-test-windows-x64-

      - name: Restore CPM build cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: build-test/_deps
          key: cpm-build-test-windows-x64-v1-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}

      - name: Configure and build
        uses: ./.github/actions/cmake-build
        with:
          build-dir: build-test
          cmake-args: ${{ env.VLINK_CI_CMAKE_ARGS }}
          configure-extra-args: >-
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
            -DCMAKE_C_COMPILER_LAUNCHER=sccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Assert configured features
        uses: ./.github/actions/assert-cmake-config
        with:
          build-dir: build-test
          required-cache: |
            ENABLE_WEBVIZ=ON
            ENABLE_IPO=OFF
            ENABLE_PYTHON_API=ON
            ENABLE_TEST=ON
            ENABLE_TEST_SANITIZE=ON
            ENABLE_TEST_WARN=ON
          required-source-prefixes: |
            webviz/
            python_api/

      - name: Run unit tests
        shell: pwsh
        run: ctest --test-dir build-test --output-on-failure --timeout 180 --parallel 1

      - name: Run Python API tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PYTHONPATH = "$PWD\python_api;$PWD\build-test\output\lib"
          $env:Path = "$PWD\build-test\output\bin;$PWD\build-test\output\lib;$env:Path"
          python python_api\test\test_vlink.py

      - name: Show sccache stats
        if: always()
        shell: pwsh
        run: sccache --show-stats || true

  test-macos-x86:
    name: macos-x86_64
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install ccache ninja openssl@3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install nanobind==2.13.0
          echo "PYTHON_EXECUTABLE=$(python -c 'import sys; print(sys.executable)')" >> "${GITHUB_ENV}"

      - name: Check toolchain
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          cmake --version
          ninja --version
          ccache --version
          patch --version | head -n 1
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "${GITHUB_ENV}"

      - name: Restore CPM cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: ~/.vlink-cpm-cache
          key: cpm-test-macos-x86_64-${{ hashFiles('cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}
          restore-keys: cpm-test-macos-x86_64-

      - name: Setup ccache
        uses: ./.github/actions/setup-compiler-cache
        with:
          backend: ccache
          cache-key: ccache-test-macos-x86_64-${{ github.run_id }}
          restore-keys: ccache-test-macos-x86_64-
          max-size: 1G

      - name: Restore CPM build cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: build-test/_deps
          key: cpm-build-test-macos-x86_64-v1-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}

      - name: Configure and build
        uses: ./.github/actions/cmake-build
        with:
          build-dir: build-test
          cmake-args: ${{ env.VLINK_CI_CMAKE_ARGS }}
          configure-extra-args: >-
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Assert configured features
        uses: ./.github/actions/assert-cmake-config
        with:
          build-dir: build-test
          required-cache: |
            ENABLE_WEBVIZ=ON
            ENABLE_IPO=OFF
            ENABLE_PYTHON_API=ON
            ENABLE_TEST=ON
            ENABLE_TEST_SANITIZE=ON
            ENABLE_TEST_WARN=ON
          required-source-prefixes: |
            webviz/
            python_api/

      - name: Run unit tests
        run: |
          export ASAN_OPTIONS=detect_leaks=1:halt_on_error=1:abort_on_error=1
          export LSAN_OPTIONS=print_suppressions=0
          ctest --test-dir build-test --output-on-failure --timeout 180 --parallel 1

      - name: Run Python API tests
        run: |
          export ASAN_OPTIONS=detect_leaks=1:halt_on_error=1:abort_on_error=1
          export LSAN_OPTIONS=print_suppressions=0
          asan_lib="$(clang -print-file-name=libclang_rt.asan_osx_dynamic.dylib || true)"
          if [ -f "${asan_lib}" ]; then
            export DYLD_INSERT_LIBRARIES="${asan_lib}${DYLD_INSERT_LIBRARIES:+:${DYLD_INSERT_LIBRARIES}}"
          fi
          export DYLD_LIBRARY_PATH="${PWD}/build-test/output/lib:${DYLD_LIBRARY_PATH:-}"
          export PYTHONPATH="${PWD}/python_api:${PWD}/build-test/output/lib"
          python python_api/test/test_vlink.py

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats || true
