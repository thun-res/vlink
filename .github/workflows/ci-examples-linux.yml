name: CI Examples Linux

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-examples-linux-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CCACHE_COMPRESS: "true"
  CCACHE_MAXSIZE: 1G
  CTEST_OUTPUT_ON_FAILURE: 1
  VLINK_CI_CMAKE_ARGS: >-
    -G Ninja
    -DCMAKE_BUILD_TYPE=Release
    -DBUILD_SHARED_LIBS=ON
    -DENABLE_CPM=ON
    -DENABLE_CPM_SQLITE3=ON
    -DENABLE_CPM_ZSTD=ON
    -DENABLE_CPM_PROTOBUF=ON
    -DENABLE_CPM_FLATBUFFERS=ON
    -DENABLE_CXX_STD_20=OFF
    -DENABLE_VIEWER=OFF
    -DENABLE_WEBVIZ=ON
    -DENABLE_IOX_ROUDI=OFF
    -DENABLE_EXAMPLES=ON
    -DENABLE_EXAMPLES_ALL=ON
    -DENABLE_TEST=OFF
    -DENABLE_TEST_WARN=ON
jobs:
  examples-linux:
    name: ubuntu20.04-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare CI image
        id: ci-image
        uses: ./.github/actions/prepare-ci-image
        with:
          image: ghcr.io/${{ github.repository_owner }}/vlink-ci-ubuntu20:latest
          context: .github/docker/ci-ubuntu20
          dockerfile: .github/docker/ci-ubuntu20/Dockerfile
          local-tag: vlink-ci-ubuntu20-examples-${{ matrix.arch }}:local
          required-tools: ccache cmake ninja patch python3

      - name: Restore CPM cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: ~/.vlink-cpm-cache
          key: cpm-examples-linux-${{ matrix.arch }}-${{ hashFiles('cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}
          restore-keys: cpm-examples-linux-${{ matrix.arch }}-

      - name: Setup ccache
        uses: ./.github/actions/setup-compiler-cache
        with:
          backend: ccache
          cache-key: ccache-examples-linux-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: ccache-examples-linux-${{ matrix.arch }}-
          max-size: 1G

      - name: Restore CPM build cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: build-examples/_deps
          key: cpm-build-examples-linux-${{ matrix.arch }}-v1-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}

      - name: Configure and build all examples
        uses: ./.github/actions/docker-run
        with:
          image: ${{ steps.ci-image.outputs.image }}
          command: |
            set -euo pipefail
            git config --global --add safe.directory "${GITHUB_WORKSPACE}"
            test "$(uname -m)" = "${{ matrix.arch }}"
            export CCACHE_DIR="${HOME}/.ccache"
            export CCACHE_BASEDIR="${GITHUB_WORKSPACE}"
            ccache --zero-stats || true
            cmake -S . -B build-examples ${VLINK_CI_CMAKE_ARGS} \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            cmake --build build-examples --parallel
            export BUILD_DIR=build-examples
            export REQUIRED_CACHE="ENABLE_WEBVIZ=ON
            ENABLE_EXAMPLES=ON
            ENABLE_EXAMPLES_ALL=ON
            ENABLE_TEST_WARN=ON"
            export REQUIRED_SOURCE_PREFIXES="examples/samples/
            examples/quickstart/
            examples/base/
            examples/serialization/
            examples/communication/
            examples/url_guide/
            examples/qos/
            examples/security/
            examples/zerocopy/
            examples/recording/
            examples/plugin/
            examples/proxy/
            examples/c_api/
            examples/node_features/
            webviz/"
            python3 .github/scripts/assert-cmake-config.py
            ccache --show-stats || true
