name: CI Coverage

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-coverage-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CCACHE_COMPRESS: "true"
  CCACHE_MAXSIZE: 1G
  CTEST_OUTPUT_ON_FAILURE: 1
  VLINK_CI_CMAKE_ARGS: >-
    -G Ninja
    -DCMAKE_BUILD_TYPE=Debug
    -DENABLE_IPO=OFF
    -DBUILD_SHARED_LIBS=ON
    -DENABLE_CPM=ON
    -DENABLE_CPM_SQLITE3=ON
    -DENABLE_CPM_ZSTD=ON
    -DENABLE_CPM_PROTOBUF=ON
    -DENABLE_CPM_FLATBUFFERS=ON
    -DFORCE_CXX=14
    -DENABLE_VIEWER=OFF
    -DENABLE_WEBVIZ=OFF
    -DENABLE_IOX_ROUDI=OFF
    -DENABLE_EXAMPLES=OFF
    -DENABLE_PYTHON_API=OFF
    -DENABLE_TEST=ON
    -DENABLE_TEST_COVERAGE=ON
    -DENABLE_TEST_SANITIZE=OFF
    -DENABLE_TEST_WARN=ON

jobs:
  coverage-linux-x86:
    name: linux-x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare CI image
        id: ci-image
        uses: ./.github/actions/prepare-ci-image
        with:
          image: ghcr.io/${{ github.repository_owner }}/vlink-ci-ubuntu24:latest
          required-tools: ccache cmake gcovr ninja python3

      - name: Restore CPM cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: ~/.vlink-cpm-cache
          key: cpm-coverage-linux-x86_64-${{ hashFiles('cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}
          restore-keys: cpm-coverage-linux-x86_64-

      - name: Setup ccache
        id: ccache
        uses: ./.github/actions/setup-compiler-cache
        with:
          backend: ccache
          cache-key: ccache-ci-linux-x86_64-coverage-${{ github.sha }}
          restore-keys: |
            ccache-ci-linux-x86_64-coverage-
          max-size: 1G

      - name: Restore CPM build cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: build-coverage/_deps
          key: cpm-build-coverage-linux-x86_64-v3-${{ hashFiles('.github/workflows/ci-coverage.yml', 'CMakeLists.txt', 'cmake/**/*.cmake', 'cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}
          restore-keys: cpm-build-coverage-linux-x86_64-v3-

      - name: Configure and build
        uses: ./.github/actions/docker-run
        with:
          image: ${{ steps.ci-image.outputs.image }}
          command: |
            set -euo pipefail
            git config --global --add safe.directory "${GITHUB_WORKSPACE}"
            test "$(uname -m)" = "x86_64"
            export CCACHE_DIR="${HOME}/.ccache"
            export CCACHE_BASEDIR="${GITHUB_WORKSPACE}"
            ccache --zero-stats || true
            cmake -S . -B build-coverage ${VLINK_CI_CMAKE_ARGS} \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCMAKE_C_FLAGS=--coverage \
              -DCMAKE_CXX_FLAGS=--coverage \
              -DCMAKE_EXE_LINKER_FLAGS=--coverage \
              -DCMAKE_SHARED_LINKER_FLAGS=--coverage
            cmake --build build-coverage --parallel
            export BUILD_DIR=build-coverage
            export REQUIRED_CACHE="ENABLE_WEBVIZ=OFF
            ENABLE_IPO=OFF
            ENABLE_PYTHON_API=OFF
            ENABLE_TEST=ON
            ENABLE_TEST_COVERAGE=ON
            ENABLE_TEST_SANITIZE=OFF
            ENABLE_TEST_WARN=ON"
            python3 .github/scripts/assert-cmake-config.py
            ccache --show-stats || true

      - name: Save ccache
        if: always() && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ccache.outputs.cache-path }}
          key: ${{ steps.ccache.outputs.cache-key }}

      - name: Run tests and generate coverage
        uses: ./.github/actions/docker-run
        with:
          image: ${{ steps.ci-image.outputs.image }}
          command: |
            set -euo pipefail
            git config --global --add safe.directory "${GITHUB_WORKSPACE}"
            export LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/build-coverage/output/bin:${GITHUB_WORKSPACE}/build-coverage/output/lib:${GITHUB_WORKSPACE}/build-coverage/output/external/lib:${LD_LIBRARY_PATH:-}"
            export BUILD_DIR=build-coverage
            export RUN_PYTHON_TESTS=0
            export SPLIT_SHM_TESTS=1
            bash .github/scripts/run-posix-ci-tests.sh
            gcda_count="$(find build-coverage -name '*.gcda' | wc -l)"
            echo "gcda files: ${gcda_count}"
            test "${gcda_count}" -gt 0
            mkdir -p build-coverage/coverage
            gcovr_args=(
              "${GITHUB_WORKSPACE}/build-coverage"
              --root "${GITHUB_WORKSPACE}"
              --object-directory "${GITHUB_WORKSPACE}/build-coverage"
              --gcov-ignore-errors
              --gcov-ignore-parse-errors
              --exclude-unreachable-branches
              --filter "src/.*"
              --filter "include/vlink/.*"
              --filter "modules/.*"
              --filter "c_api/.*"
              --filter "proxy/.*"
              --filter "exprtk/.*"
              --exclude "src/private/.*"
              --exclude "src/extension/.*"
              --exclude "include/private/.*"
              --exclude ".*/test/.*"
              --exclude "thirdparty/.*"
              --exclude "examples/.*"
              --exclude "cli/.*"
              --exclude ".*/builtin/.*"
            )
            gcovr "${gcovr_args[@]}" \
              -s \
              --html \
              --html-nested \
              --html-syntax-highlighting \
              --html-theme github.dark-green \
              --html-title "Code Coverage Report for Project [vlink]" \
              -o build-coverage/coverage/index.html \
              | tee build-coverage/coverage/summary.txt
            python3 - <<'PY'
            import pathlib
            import re
            import sys

            summary = pathlib.Path("build-coverage/coverage/summary.txt").read_text()
            match = re.search(r"^lines:\s+[\d.]+%\s+\((\d+) out of (\d+)\)", summary, re.M)
            if not match:
                sys.exit("Coverage summary does not contain a line coverage total")
            total = int(match.group(2))
            if total <= 0:
                sys.exit("Coverage report is empty")
            PY

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-linux-x86_64
          path: build-coverage/coverage
          if-no-files-found: error
