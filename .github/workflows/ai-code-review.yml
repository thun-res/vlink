name: AI Code Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to request a Codex review on.
        required: true
        type: number
  pull_request_target:
    types:
      - labeled

permissions:
  issues: write

concurrency:
  group: ai-code-review-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  request-review:
    name: Request Codex review
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'ai-review'
    defaults:
      run:
        shell: bash
    steps:
      - name: Post review trigger comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -euo pipefail

          if [[ -z "${PR_NUMBER}" || "${PR_NUMBER}" == "0" || "${PR_NUMBER}" =~ [^0-9] ]]; then
            echo "A positive PR number is required." >&2
            exit 1
          fi

          curl -fsS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --data '{"body":"@codex review"}' \
            >/dev/null

          echo "Requested Codex review for PR #${PR_NUMBER}."
