name: AI Code Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to request a Codex review on.
        required: true
        type: number
  issue_comment:
    types:
      - created

permissions:
  issues: write

concurrency:
  group: ai-code-review-${{ github.event.issue.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  request-review:
    name: Request or accept Codex review
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '@codex review')
      )
    steps:
      - name: Post manual review trigger comment
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed("A positive PR number is required.");
              return;
            }

            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            if (!issue.data.pull_request) {
              core.setFailed(`#${prNumber} is not a pull request.`);
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: "@codex review",
            });

      - name: Accept PR comment trigger
        if: github.event_name == 'issue_comment'
        run: ":"
