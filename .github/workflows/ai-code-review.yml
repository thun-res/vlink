name: AI Code Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to request a Codex review on.
        required: true
        type: number

permissions:
  contents: read
  issues: write

concurrency:
  group: ai-code-review-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  request-review:
    name: Request Codex review
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Post manual review trigger comment
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed("A positive PR number is required.");
              return;
            }

            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            if (!issue.data.pull_request) {
              core.setFailed(`#${prNumber} is not a pull request.`);
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: "@codex review",
            });

      - name: Email AI review request result
        if: always()
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
          PR_NUMBER: ${{ inputs.pr_number }}
          VLINK_NOTIFY_SMTP_HOST: ${{ secrets.VLINK_NOTIFY_SMTP_HOST }}
          VLINK_NOTIFY_SMTP_PORT: ${{ secrets.VLINK_NOTIFY_SMTP_PORT || vars.VLINK_NOTIFY_SMTP_PORT }}
          VLINK_NOTIFY_SMTP_USERNAME: ${{ secrets.VLINK_NOTIFY_SMTP_USERNAME }}
          VLINK_NOTIFY_SMTP_PASSWORD: ${{ secrets.VLINK_NOTIFY_SMTP_PASSWORD }}
          VLINK_NOTIFY_SMTP_SSL: ${{ secrets.VLINK_NOTIFY_SMTP_SSL || vars.VLINK_NOTIFY_SMTP_SSL }}
          VLINK_NOTIFY_SMTP_STARTTLS: ${{ secrets.VLINK_NOTIFY_SMTP_STARTTLS || vars.VLINK_NOTIFY_SMTP_STARTTLS }}
          VLINK_NOTIFY_EMAIL_FROM: ${{ secrets.VLINK_NOTIFY_EMAIL_FROM || vars.VLINK_NOTIFY_EMAIL_FROM }}
          VLINK_NOTIFY_EMAIL_TO: ${{ secrets.VLINK_NOTIFY_EMAIL_TO || vars.VLINK_NOTIFY_EMAIL_TO }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          {
            echo "AI code review request ${JOB_STATUS}"
            echo
            echo "Pull request: #${PR_NUMBER}"
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Commit: ${GITHUB_SHA}"
          } > "${body}"
          python3 .github/scripts/send-email-notification.py \
            --subject "[vlink] AI review request ${JOB_STATUS}: PR #${PR_NUMBER}" \
            --body-file "${body}"
