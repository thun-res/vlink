name: CI Protocols

on:
  pull_request:
    branches:
      - master
      - main
      - develop
    paths:
      - CMakeLists.txt
      - cmake/**
      - include/vlink/modules/zenoh_conf.h
      - include/vlink/modules/someip_conf.h
      - include/vlink/modules/shm2_conf.h
      - include/vlink/modules/mqtt_conf.h
      - modules/zenoh/**
      - modules/someip/**
      - modules/shm2/**
      - modules/mqtt/**
      - .github/actions/**
      - .github/docker/ci-protocols-ubuntu24/**
      - .github/scripts/assert-cmake-config.py
      - .github/workflows/ci-protocols.yml
      - .github/workflows/docker-images.yml
  push:
    branches:
      - master
      - main
      - develop
    paths:
      - CMakeLists.txt
      - cmake/**
      - include/vlink/modules/zenoh_conf.h
      - include/vlink/modules/someip_conf.h
      - include/vlink/modules/shm2_conf.h
      - include/vlink/modules/mqtt_conf.h
      - modules/zenoh/**
      - modules/someip/**
      - modules/shm2/**
      - modules/mqtt/**
      - .github/actions/**
      - .github/docker/ci-protocols-ubuntu24/**
      - .github/scripts/assert-cmake-config.py
      - .github/workflows/ci-protocols.yml
      - .github/workflows/docker-images.yml
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR protocol CI image tag.
        required: true
        type: string
        default: latest

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-protocols-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CCACHE_COMPRESS: "true"
  CCACHE_MAXSIZE: 1G
  CTEST_OUTPUT_ON_FAILURE: 1
  VLINK_CI_CMAKE_ARGS: >-
    -G Ninja
    -DCMAKE_BUILD_TYPE=Release
    -DENABLE_IPO=OFF
    -DCMAKE_PREFIX_PATH=/usr/local
    -DBUILD_SHARED_LIBS=ON
    -DENABLE_CPM=ON
    -DENABLE_CPM_SQLITE3=ON
    -DENABLE_CPM_ZSTD=ON
    -DENABLE_CPM_PROTOBUF=ON
    -DENABLE_CPM_FLATBUFFERS=ON
    -DENABLE_CXX_STD_20=OFF
    -DENABLE_ZENOH_PICO=ON
    -DENABLE_VIEWER=OFF
    -DENABLE_WEBVIZ=OFF
    -DENABLE_IOX_ROUDI=OFF
    -DENABLE_EXAMPLES=OFF
    -DENABLE_TEST=OFF
    -DENABLE_TEST_WARN=ON

jobs:
  protocol-linux-x86:
    name: linux-x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare protocol CI image
        id: protocol-image
        uses: ./.github/actions/prepare-ci-image
        with:
          image: ghcr.io/${{ github.repository_owner }}/vlink-ci-protocols-ubuntu24:${{ inputs.image_tag || 'latest' }}
          required-tools: ccache cmake ninja python3
          verify-command: |
            set -euo pipefail
            tmp="$(mktemp -d)"
            cat > "${tmp}/CMakeLists.txt" <<'EOF'
            cmake_minimum_required(VERSION 3.22)
            project(vlink-protocol-deps-check LANGUAGES C CXX)
            find_package(eclipse-paho-mqtt-c CONFIG REQUIRED)
            find_package(vsomeip3 CONFIG REQUIRED)
            find_package(zenohpico CONFIG REQUIRED)
            find_package(iceoryx2-c CONFIG REQUIRED)
            if(NOT TARGET eclipse-paho-mqtt-c::paho-mqtt3c AND NOT TARGET eclipse-paho-mqtt-c::paho-mqtt3cs)
              message(FATAL_ERROR "Missing Eclipse Paho MQTT C target")
            endif()
            if(NOT TARGET vsomeip3)
              message(FATAL_ERROR "Missing vsomeip3 target")
            endif()
            if(NOT TARGET zenohpico::zenohpico_shared AND NOT TARGET zenohpico::zenohpico_static)
              message(FATAL_ERROR "Missing zenoh-pico target")
            endif()
            if(NOT TARGET iceoryx2-c::shared-lib AND NOT TARGET iceoryx2-c::static-lib)
              message(FATAL_ERROR "Missing iceoryx2-c target")
            endif()
            EOF
            cmake -S "${tmp}" -B "${tmp}/build" -GNinja -DCMAKE_PREFIX_PATH=/usr/local

      - name: Restore CPM cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: ~/.vlink-cpm-cache
          key: cpm-protocols-linux-x86_64-${{ hashFiles('cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}
          restore-keys: cpm-protocols-linux-x86_64-

      - name: Setup ccache
        id: ccache
        uses: ./.github/actions/setup-compiler-cache
        with:
          backend: ccache
          cache-key: ccache-ci-linux-x86_64-protocols-${{ github.sha }}
          restore-keys: ccache-ci-linux-x86_64-protocols-
          max-size: 1G

      - name: Restore CPM build cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: build-protocols/_deps
          key: cpm-build-protocols-linux-x86_64-v1-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}

      - name: Configure and build protocol modules
        uses: ./.github/actions/docker-run
        with:
          image: ${{ steps.protocol-image.outputs.image }}
          command: |
            set -euo pipefail
            git config --global --add safe.directory "${GITHUB_WORKSPACE}"
            test "$(uname -m)" = "x86_64"
            export CCACHE_DIR="${HOME}/.ccache"
            export CCACHE_BASEDIR="${GITHUB_WORKSPACE}"
            ccache --zero-stats || true
            cmake -S . -B build-protocols ${VLINK_CI_CMAKE_ARGS} \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            cmake --build build-protocols --parallel
            export BUILD_DIR=build-protocols
            export REQUIRED_CACHE="ENABLE_IPO=OFF"
            export REQUIRED_DEFINES="VLINK_SUPPORT_ZENOH
            VLINK_ENABLE_ZENOH_PICO
            VLINK_SUPPORT_SOMEIP
            VLINK_SUPPORT_SHM2
            VLINK_SUPPORT_MQTT"
            export REQUIRED_SOURCE_PREFIXES="modules/zenoh/
            modules/someip/
            modules/shm2/
            modules/mqtt/"
            python3 .github/scripts/assert-cmake-config.py
            ccache --show-stats || true

      - name: Save ccache
        if: always() && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ccache.outputs.cache-path }}
          key: ${{ steps.ccache.outputs.cache-key }}
