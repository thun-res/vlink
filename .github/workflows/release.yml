name: Release

on:
  workflow_dispatch:
    inputs:
      build_portable:
        description: Build Qt/OSG/QtIFW portable packages and offline installers
        required: true
        type: boolean
        default: true
      build_linux_packages:
        description: Build deb/rpm/arch Linux distribution packages
        required: true
        type: boolean
        default: true
      docker_image_tag:
        description: GHCR Docker image tag for Linux release jobs
        required: true
        type: string
        default: latest
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-linux-container-images:
    name: verify-linux-container-images
    if: github.event_name == 'push' || inputs.build_portable || inputs.build_linux_packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IMAGE_TAG: ${{ inputs.docker_image_tag || 'latest' }}
      BUILD_PORTABLE: ${{ github.event_name == 'push' || inputs.build_portable }}
      BUILD_LINUX_PACKAGES: ${{ github.event_name == 'push' || inputs.build_linux_packages }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Linux release images
        run: |
          set -euo pipefail
          images=()
          if [ "${BUILD_PORTABLE}" = "true" ]; then
            images+=(
              "vlink-release-ubuntu20"
              "vlink-release-ubuntu20-qt-aarch64"
            )
          fi
          if [ "${BUILD_LINUX_PACKAGES}" = "true" ]; then
            images+=(
              "vlink-release-ubuntu20"
              "vlink-package-ubuntu22"
              "vlink-package-fedora43"
              "vlink-package-arch"
              "vlink-package-arch-aarch64"
            )
          fi
          mapfile -t unique_images < <(printf '%s\n' "${images[@]}" | sort -u)
          for image in "${unique_images[@]}"; do
            docker pull "ghcr.io/${{ github.repository_owner }}/${image}:${IMAGE_TAG}"
          done

  portable-linux:
    name: portable-linux
    if: github.event_name == 'push' || inputs.build_portable
    needs: verify-linux-container-images
    uses: ./.github/workflows/release-portable-linux.yml
    with:
      qt_version: "6.8.3"
      osg_sdk_repository: https://github.com/thun-res/osg_sdk.git
      osg_sdk_ref: master
      container_image_tag: ${{ inputs.docker_image_tag || 'latest' }}

  portable-macos:
    name: portable-macos
    if: github.event_name == 'push' || inputs.build_portable
    uses: ./.github/workflows/release-portable-macos.yml
    with:
      qt_version: "6.8.3"
      osg_sdk_repository: https://github.com/thun-res/osg_sdk.git
      osg_sdk_ref: master

  portable-windows:
    name: portable-windows
    if: github.event_name == 'push' || inputs.build_portable
    uses: ./.github/workflows/release-portable-windows.yml
    with:
      qt_version: "6.8.3"
      osg_sdk_repository: https://github.com/thun-res/osg_sdk.git
      osg_sdk_ref: master

  linux-packages:
    name: linux-packages
    if: github.event_name == 'push' || inputs.build_linux_packages
    needs: verify-linux-container-images
    uses: ./.github/workflows/release-linux-packages.yml
    with:
      container_image_tag: ${{ inputs.docker_image_tag || 'latest' }}

  publish-github-release:
    name: publish-github-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
      - portable-linux
      - portable-macos
      - portable-windows
      - linux-packages
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Show release files
        run: find dist -maxdepth 3 -type f -print | sort

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
