name: Docker Images

on:
  workflow_dispatch:
    inputs:
      image:
        description: Docker image to build, or all.
        required: false
        type: choice
        default: all
        options:
          - all
          - release-linux
          - vlink-ci-ubuntu24
          - vlink-ci-protocols-ubuntu24
          - vlink-ci-ubuntu20
          - vlink-release-ubuntu20
          - vlink-release-ubuntu20-qt-aarch64
          - vlink-package-ubuntu22
          - vlink-package-fedora43
          - vlink-package-arch
          - vlink-package-arch-aarch64

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: vlink-ci-ubuntu24
            runner: ubuntu-24.04
            context: .github/docker/ci-ubuntu24
            dockerfile: .github/docker/ci-ubuntu24/Dockerfile
            platforms: linux/amd64
          - image: vlink-ci-protocols-ubuntu24
            runner: ubuntu-24.04
            context: .github/docker/ci-protocols-ubuntu24
            dockerfile: .github/docker/ci-protocols-ubuntu24/Dockerfile
            platforms: linux/amd64
            cache_mode: min
          - image: vlink-ci-ubuntu20
            runner: ubuntu-24.04
            context: .github/docker/ci-ubuntu20
            dockerfile: .github/docker/ci-ubuntu20/Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: vlink-release-ubuntu20
            runner: ubuntu-24.04
            context: .github/docker/release-ubuntu20
            dockerfile: .github/docker/release-ubuntu20/Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: vlink-release-ubuntu20-qt-aarch64
            runner: ubuntu-24.04-arm
            context: .github/docker/release-ubuntu20-qt-aarch64
            dockerfile: .github/docker/release-ubuntu20-qt-aarch64/Dockerfile
            platforms: linux/arm64
            cache_mode: min
          - image: vlink-package-ubuntu22
            runner: ubuntu-24.04
            context: .github/docker/package-ubuntu22
            dockerfile: .github/docker/package-ubuntu22/Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: vlink-package-fedora43
            runner: ubuntu-24.04
            context: .github/docker/package-fedora43
            dockerfile: .github/docker/package-fedora43/Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: vlink-package-arch
            runner: ubuntu-24.04
            context: .github/docker/package-arch
            dockerfile: .github/docker/package-arch/Dockerfile
            platforms: linux/amd64
          - image: vlink-package-arch-aarch64
            runner: ubuntu-24.04-arm
            context: .github/docker/package-arch-aarch64
            dockerfile: .github/docker/package-arch-aarch64/Dockerfile
            platforms: linux/arm64
    steps:
      - name: Checkout
        if: inputs.image == 'all' || inputs.image == matrix.image || (inputs.image == 'release-linux' && (matrix.image == 'vlink-release-ubuntu20' || matrix.image == 'vlink-release-ubuntu20-qt-aarch64'))
        uses: actions/checkout@v7

      - name: Set up QEMU
        if: inputs.image == 'all' || inputs.image == matrix.image || (inputs.image == 'release-linux' && (matrix.image == 'vlink-release-ubuntu20' || matrix.image == 'vlink-release-ubuntu20-qt-aarch64'))
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: inputs.image == 'all' || inputs.image == matrix.image || (inputs.image == 'release-linux' && (matrix.image == 'vlink-release-ubuntu20' || matrix.image == 'vlink-release-ubuntu20-qt-aarch64'))
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: inputs.image == 'all' || inputs.image == matrix.image || (inputs.image == 'release-linux' && (matrix.image == 'vlink-release-ubuntu20' || matrix.image == 'vlink-release-ubuntu20-qt-aarch64'))
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: inputs.image == 'all' || inputs.image == matrix.image || (inputs.image == 'release-linux' && (matrix.image == 'vlink-release-ubuntu20' || matrix.image == 'vlink-release-ubuntu20-qt-aarch64'))
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=df-${{ hashFiles(matrix.dockerfile) }}
            type=raw,value=sha-${{ github.sha }}
            type=sha,prefix=sha-

      - name: Build and push
        if: inputs.image == 'all' || inputs.image == matrix.image || (inputs.image == 'release-linux' && (matrix.image == 'vlink-release-ubuntu20' || matrix.image == 'vlink-release-ubuntu20-qt-aarch64'))
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=${{ matrix.cache_mode || 'max' }},scope=${{ matrix.image }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
