name: Coverage Linux

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: coverage-linux-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CCACHE_COMPRESS: "true"
  CCACHE_MAXSIZE: 1G
  CTEST_OUTPUT_ON_FAILURE: 1
  VLINK_CI_CMAKE_ARGS: >-
    -G Ninja
    -DCMAKE_BUILD_TYPE=Debug
    -DBUILD_SHARED_LIBS=ON
    -DENABLE_CPM=ON
    -DENABLE_CPM_SQLITE3=ON
    -DENABLE_CPM_ZSTD=ON
    -DENABLE_CPM_PROTOBUF=ON
    -DENABLE_CPM_FLATBUFFERS=ON
    -DENABLE_CXX_STD_20=OFF
    -DENABLE_VIEWER=OFF
    -DENABLE_WEBVIZ=OFF
    -DENABLE_IOX_ROUDI=OFF
    -DENABLE_EXAMPLES=OFF
    -DENABLE_TEST=ON
    -DENABLE_TEST_WARN=OFF
    -DENABLE_TEST_COVERAGE=ON

jobs:
  coverage-linux-x86:
    name: linux-x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare CI image
        id: ci-image
        uses: ./.github/actions/prepare-ci-image
        with:
          image: ghcr.io/${{ github.repository_owner }}/vlink-ci-ubuntu24:latest
          context: .github/docker/ci-ubuntu24
          dockerfile: .github/docker/ci-ubuntu24/Dockerfile
          local-tag: vlink-ci-ubuntu24:coverage-local
          required-tools: ccache cmake gcovr lcov ninja python3

      - name: Restore CPM cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: ~/.vlink-cpm-cache
          key: cpm-coverage-linux-x86_64-${{ hashFiles('cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}
          restore-keys: cpm-coverage-linux-x86_64-

      - name: Setup ccache
        uses: ./.github/actions/setup-compiler-cache
        with:
          backend: ccache
          cache-key: ccache-coverage-linux-x86_64-${{ github.run_id }}
          restore-keys: ccache-coverage-linux-x86_64-
          max-size: 1G

      - name: Restore CPM build cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: build-coverage/_deps
          key: cpm-build-coverage-linux-x86_64-v1-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}

      - name: Build tests and generate coverage
        uses: ./.github/actions/docker-run
        with:
          image: ${{ steps.ci-image.outputs.image }}
          command: |
            set -euo pipefail
            git config --global --add safe.directory "${GITHUB_WORKSPACE}"
            test "$(uname -m)" = "x86_64"
            gcovr --version || lcov --version
            export CCACHE_DIR="${HOME}/.ccache"
            export CCACHE_BASEDIR="${GITHUB_WORKSPACE}"
            ccache --zero-stats || true
            cmake -S . -B build-coverage ${VLINK_CI_CMAKE_ARGS} \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            cmake --build build-coverage --parallel
            ctest --test-dir build-coverage --output-on-failure --timeout 180 --parallel 1
            cmake --build build-coverage --target coverage
            test -f build-coverage/coverage/index.html
            ccache --show-stats || true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: vlink-coverage-linux-x86_64
          if-no-files-found: error
          path: |
            build-coverage/coverage/**
            build-coverage/cov.info
