name: CI Build

on:
  pull_request:
    branches:
      - master
      - main
      - develop
  push:
    branches:
      - master
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CCACHE_COMPRESS: "true"
  CCACHE_MAXSIZE: 1G
  CTEST_OUTPUT_ON_FAILURE: 1
  VLINK_CI_CMAKE_ARGS: >-
    -G Ninja
    -DCMAKE_BUILD_TYPE=Release
    -DBUILD_SHARED_LIBS=ON
    -DENABLE_CPM=ON
    -DENABLE_CPM_SQLITE3=ON
    -DENABLE_CPM_ZSTD=ON
    -DENABLE_CPM_PROTOBUF=ON
    -DENABLE_CPM_FLATBUFFERS=ON
    -DENABLE_CXX_STD_20=OFF
    -DENABLE_VIEWER=OFF
    -DENABLE_WEBVIZ=ON
    -DENABLE_IOX_ROUDI=OFF
    -DENABLE_EXAMPLES=OFF
    -DENABLE_TEST=OFF
    -DENABLE_TEST_WARN=ON
  VLINK_REQUIRED_SOURCES_COMMON: |
    src/
    modules/intra/
    modules/dds/
    modules/ddsc/
    proxy/
    cli/info/
    cli/bag/
    cli/eproto/
    cli/efbs/
    cli/list/
    cli/monitor/
    cli/dump/
    cli/check/
    cli/bench/
    webviz/
  VLINK_REQUIRED_DEFINES: |
    VLINK_ENABLE_SECURITY
    VLINK_ENABLE_SQLITE
    VLINK_ENABLE_ZSTD

jobs:
  build-linux-ubuntu20:
    name: ubuntu20.04-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare CI image
        id: ci-image
        uses: ./.github/actions/prepare-ci-image
        with:
          image: ghcr.io/${{ github.repository_owner }}/vlink-ci-ubuntu20:latest
          context: .github/docker/ci-ubuntu20
          dockerfile: .github/docker/ci-ubuntu20/Dockerfile
          local-tag: vlink-ci-ubuntu20-${{ matrix.arch }}:local
          required-tools: ccache cmake ninja patch python3

      - name: Restore CPM cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: ~/.vlink-cpm-cache
          key: cpm-ci-ubuntu20-${{ matrix.arch }}-${{ hashFiles('cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}
          restore-keys: cpm-ci-ubuntu20-${{ matrix.arch }}-

      - name: Setup ccache
        uses: ./.github/actions/setup-compiler-cache
        with:
          backend: ccache
          cache-key: ccache-ci-ubuntu20-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: ccache-ci-ubuntu20-${{ matrix.arch }}-
          max-size: 1G

      - name: Restore CPM build cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: build/_deps
          key: cpm-build-ci-ubuntu20-${{ matrix.arch }}-v1-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}

      - name: Configure and build
        uses: ./.github/actions/docker-run
        with:
          image: ${{ steps.ci-image.outputs.image }}
          command: |
            set -euo pipefail
            git config --global --add safe.directory "${GITHUB_WORKSPACE}"
            test "$(uname -m)" = "${{ matrix.arch }}"
            cmake --version
            ninja --version
            patch --version | head -n 1
            export CCACHE_DIR="${HOME}/.ccache"
            export CCACHE_BASEDIR="${GITHUB_WORKSPACE}"
            ccache --version
            ccache --zero-stats || true
            cmake -S . -B build ${VLINK_CI_CMAKE_ARGS} \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            cmake --build build --parallel
            ccache --show-stats || true
            export BUILD_DIR=build
            export REQUIRED_DEFINES="VLINK_ENABLE_SECURITY
            VLINK_ENABLE_SQLITE
            VLINK_ENABLE_ZSTD"
            export REQUIRED_SOURCE_PREFIXES="src/
            modules/intra/
            modules/dds/
            modules/ddsc/
            proxy/
            cli/info/
            cli/bag/
            cli/eproto/
            cli/efbs/
            cli/list/
            cli/monitor/
            cli/dump/
            cli/check/
            cli/bench/
            modules/shm/
            webviz/"
            python3 .github/scripts/assert-cmake-config.py

  build-windows:
    name: windows-msvc
    runs-on: windows-2022
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup OpenSSL
        uses: ./.github/actions/setup-windows-openssl

      - name: Setup sccache
        uses: ./.github/actions/setup-compiler-cache
        with:
          backend: sccache
          cache-key: vlink-windows-msvc-v1

      - name: Setup MSVC tools
        uses: ./.github/actions/setup-windows-msvc-tools

      - name: Restore CPM cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: ~/.vlink-cpm-cache
          key: cpm-ci-windows-${{ hashFiles('cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}
          restore-keys: cpm-ci-windows-

      - name: Restore CPM build cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: build/_deps
          key: cpm-build-ci-windows-msvc2022-v1-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}

      - name: Configure and build
        uses: ./.github/actions/cmake-build
        with:
          build-dir: build
          cmake-args: ${{ env.VLINK_CI_CMAKE_ARGS }}
          configure-extra-args: >-
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
            -DCMAKE_C_COMPILER_LAUNCHER=sccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Show sccache stats
        if: always()
        shell: pwsh
        run: sccache --show-stats || true

      - name: Assert configured features
        uses: ./.github/actions/assert-cmake-config
        with:
          build-dir: build
          required-defines: ${{ env.VLINK_REQUIRED_DEFINES }}
          required-source-prefixes: ${{ env.VLINK_REQUIRED_SOURCES_COMMON }}

  build-macos:
    name: macos-arm64
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install ccache ninja openssl@3

      - name: Check toolchain
        run: |
          test "$(uname -m)" = "arm64"
          cmake --version
          ninja --version
          ccache --version
          patch --version | head -n 1
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "${GITHUB_ENV}"

      - name: Restore CPM cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: ~/.vlink-cpm-cache
          key: cpm-ci-macos-${{ hashFiles('cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}
          restore-keys: cpm-ci-macos-

      - name: Setup ccache
        uses: ./.github/actions/setup-compiler-cache
        with:
          backend: ccache
          cache-key: ccache-ci-macos-arm64-${{ github.run_id }}
          restore-keys: ccache-ci-macos-arm64-
          max-size: 1G

      - name: Restore CPM build cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: build/_deps
          key: cpm-build-ci-macos-arm64-v1-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}

      - name: Configure and build
        uses: ./.github/actions/cmake-build
        with:
          build-dir: build
          cmake-args: ${{ env.VLINK_CI_CMAKE_ARGS }}
          configure-extra-args: >-
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats || true

      - name: Assert configured features
        uses: ./.github/actions/assert-cmake-config
        with:
          build-dir: build
          required-defines: ${{ env.VLINK_REQUIRED_DEFINES }}
          required-source-prefixes: ${{ env.VLINK_REQUIRED_SOURCES_COMMON }}
