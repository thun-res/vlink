name: CI Build

on:
  pull_request:
    branches:
      - master
      - main
      - develop
    paths:
      - CMakeLists.txt
      - cmake/**
      - conanfile.py
      - include/**
      - src/**
      - modules/**
      - proxy/**
      - c_api/**
      - cli/**
      - exprtk/**
      - webviz/**
      - thirdparty/**
      - packup/patch/**
      - .github/actions/assert-cmake-config/**
      - .github/actions/cmake-build/**
      - .github/actions/docker-run/**
      - .github/actions/prepare-ci-image/**
      - .github/actions/restore-build-cache/**
      - .github/actions/setup-compiler-cache/**
      - .github/docker/ci-ubuntu20/**
      - .github/scripts/assert-cmake-config.py
      - .github/workflows/ci-build.yml
  push:
    branches:
      - master
      - main
      - develop
    paths:
      - CMakeLists.txt
      - cmake/**
      - conanfile.py
      - include/**
      - src/**
      - modules/**
      - proxy/**
      - c_api/**
      - cli/**
      - exprtk/**
      - webviz/**
      - thirdparty/**
      - packup/patch/**
      - .github/actions/assert-cmake-config/**
      - .github/actions/cmake-build/**
      - .github/actions/docker-run/**
      - .github/actions/prepare-ci-image/**
      - .github/actions/restore-build-cache/**
      - .github/actions/setup-compiler-cache/**
      - .github/docker/ci-ubuntu20/**
      - .github/scripts/assert-cmake-config.py
      - .github/workflows/ci-build.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CCACHE_COMPRESS: "true"
  CCACHE_MAXSIZE: 1G
  CTEST_OUTPUT_ON_FAILURE: 1
  VLINK_CI_CMAKE_ARGS: >-
    -G Ninja
    -DCMAKE_BUILD_TYPE=Release
    -DENABLE_IPO=OFF
    -DBUILD_SHARED_LIBS=ON
    -DENABLE_CPM=ON
    -DENABLE_CPM_SQLITE3=ON
    -DENABLE_CPM_ZSTD=ON
    -DENABLE_CPM_PROTOBUF=ON
    -DENABLE_CPM_FLATBUFFERS=ON
    -DENABLE_CXX_STD_20=OFF
    -DENABLE_VIEWER=OFF
    -DENABLE_WEBVIZ=ON
    -DENABLE_IOX_ROUDI=OFF
    -DENABLE_EXAMPLES=OFF
    -DENABLE_TEST=OFF
    -DENABLE_TEST_WARN=ON
  VLINK_REQUIRED_SOURCES_COMMON: |
    src/
    modules/intra/
    modules/dds/
    modules/ddsc/
    proxy/
    cli/info/
    cli/bag/
    cli/eproto/
    cli/efbs/
    cli/list/
    cli/monitor/
    cli/dump/
    cli/check/
    cli/bench/
    webviz/
  VLINK_REQUIRED_DEFINES: |
    VLINK_ENABLE_SECURITY
    VLINK_ENABLE_SQLITE
    VLINK_ENABLE_ZSTD

jobs:
  build-linux-aarch64:
    name: ubuntu20.04-aarch64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare CI image
        id: ci-image
        uses: ./.github/actions/prepare-ci-image
        with:
          image: ghcr.io/${{ github.repository_owner }}/vlink-ci-ubuntu20:latest
          required-tools: ccache cmake ninja patch python3

      - name: Restore CPM cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: ~/.vlink-cpm-cache
          key: cpm-ci-ubuntu20-aarch64-${{ hashFiles('cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}
          restore-keys: cpm-ci-ubuntu20-aarch64-

      - name: Setup ccache
        id: ccache
        uses: ./.github/actions/setup-compiler-cache
        with:
          backend: ccache
          cache-key: ccache-ci-linux-aarch64-build-${{ github.sha }}
          restore-keys: ccache-ci-linux-aarch64-
          max-size: 1G

      - name: Restore CPM build cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: build/_deps
          key: cpm-build-ci-ubuntu20-aarch64-v1-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}

      - name: Configure and build
        uses: ./.github/actions/docker-run
        with:
          image: ${{ steps.ci-image.outputs.image }}
          command: |
            set -euo pipefail
            git config --global --add safe.directory "${GITHUB_WORKSPACE}"
            test "$(uname -m)" = "aarch64"
            cmake -S . -B build ${VLINK_CI_CMAKE_ARGS} \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            cmake --build build --parallel
            export BUILD_DIR=build
            export REQUIRED_CACHE="ENABLE_IPO=OFF"
            export REQUIRED_DEFINES="VLINK_ENABLE_SECURITY
            VLINK_ENABLE_SQLITE
            VLINK_ENABLE_ZSTD"
            export REQUIRED_SOURCE_PREFIXES="src/
            modules/intra/
            modules/dds/
            modules/ddsc/
            proxy/
            cli/info/
            cli/bag/
            cli/eproto/
            cli/efbs/
            cli/list/
            cli/monitor/
            cli/dump/
            cli/check/
            cli/bench/
            modules/shm/
            webviz/"
            python3 .github/scripts/assert-cmake-config.py

      - name: Save ccache
        if: always() && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ccache.outputs.cache-path }}
          key: ${{ steps.ccache.outputs.cache-key }}

  build-macos:
    name: macos-arm64
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build tools
        run: brew install --quiet ccache ninja openssl@3

      - name: Set OpenSSL root
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "${GITHUB_ENV}"

      - name: Restore CPM cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: ~/.vlink-cpm-cache
          key: cpm-ci-macos-${{ hashFiles('cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}
          restore-keys: cpm-ci-macos-

      - name: Setup ccache
        id: ccache
        uses: ./.github/actions/setup-compiler-cache
        with:
          backend: ccache
          cache-key: ccache-ci-macos-arm64-build-${{ github.sha }}
          restore-keys: ccache-ci-macos-arm64-
          max-size: 1G

      - name: Restore CPM build cache
        uses: ./.github/actions/restore-build-cache
        with:
          path: build/_deps
          key: cpm-build-ci-macos-arm64-v1-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', 'cmake/cpm.cmake', 'cmake/cpm_thirdparty.cmake', 'packup/patch/*.patch') }}

      - name: Configure and build
        uses: ./.github/actions/cmake-build
        with:
          build-dir: build
          cmake-args: ${{ env.VLINK_CI_CMAKE_ARGS }}
          configure-extra-args: >-
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Save ccache
        if: always() && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.ccache.outputs.cache-path }}
          key: ${{ steps.ccache.outputs.cache-key }}

      - name: Assert configured features
        uses: ./.github/actions/assert-cmake-config
        with:
          build-dir: build
          required-cache: |
            ENABLE_IPO=OFF
          required-defines: ${{ env.VLINK_REQUIRED_DEFINES }}
          required-source-prefixes: ${{ env.VLINK_REQUIRED_SOURCES_COMMON }}
