name: Setup OSG SDK
description: Fetch thun-res/osg_sdk, pull LFS files, validate platform files, and expose OSG_DIR.

inputs:
  repository:
    description: OSG SDK git repository.
    required: true
  ref:
    description: OSG SDK git ref.
    required: false
    default: master
  platform-dir:
    description: Platform subdirectory inside the OSG SDK.
    required: true
  validation-paths:
    description: Newline separated paths that must exist under OSG_DIR.
    required: true
  cache-suffix:
    description: Cache key suffix.
    required: false
    default: v1

runs:
  using: composite
  steps:
    - name: Restore OSG SDK cache
      uses: actions/cache@v4
      with:
        path: ~/.vlink-ci/osg_sdk
        key: osg-sdk-${{ runner.os }}-${{ runner.arch }}-${{ inputs.platform-dir }}-${{ inputs.cache-suffix }}
        restore-keys: |
          osg-sdk-${{ runner.os }}-${{ runner.arch }}-${{ inputs.platform-dir }}-

    - name: Install OSG SDK
      if: runner.os != 'Windows'
      shell: bash
      env:
        OSG_SDK_REPOSITORY: ${{ inputs.repository }}
        OSG_SDK_REF: ${{ inputs.ref }}
        OSG_PLATFORM_DIR: ${{ inputs.platform-dir }}
        OSG_VALIDATION_PATHS: ${{ inputs.validation-paths }}
      run: |
        set -euo pipefail
        OSG_SDK_ROOT="${HOME}/.vlink-ci/osg_sdk"
        if [ -d "${OSG_SDK_ROOT}/.git" ]; then
          git -C "${OSG_SDK_ROOT}" remote set-url origin "${OSG_SDK_REPOSITORY}"
          git -C "${OSG_SDK_ROOT}" fetch --depth 1 origin "${OSG_SDK_REF}"
          git -C "${OSG_SDK_ROOT}" reset --hard FETCH_HEAD
        else
          rm -rf "${OSG_SDK_ROOT}"
          git clone --depth 1 --branch "${OSG_SDK_REF}" "${OSG_SDK_REPOSITORY}" "${OSG_SDK_ROOT}"
        fi
        git -C "${OSG_SDK_ROOT}" lfs install --local
        git -C "${OSG_SDK_ROOT}" lfs pull

        OSG_DIR="${OSG_SDK_ROOT}/${OSG_PLATFORM_DIR}"
        while IFS= read -r rel; do
          [ -n "${rel}" ] || continue
          if [ ! -e "${OSG_DIR}/${rel}" ]; then
            echo "Missing OSG SDK path: ${OSG_DIR}/${rel}" >&2
            exit 1
          fi
        done <<< "${OSG_VALIDATION_PATHS}"

        echo "OSG_DIR=${OSG_DIR}" >> "${GITHUB_ENV}"
        echo "Resolved OSG_DIR=${OSG_DIR}"

    - name: Install OSG SDK
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        OSG_SDK_REPOSITORY: ${{ inputs.repository }}
        OSG_SDK_REF: ${{ inputs.ref }}
        OSG_PLATFORM_DIR: ${{ inputs.platform-dir }}
        OSG_VALIDATION_PATHS: ${{ inputs.validation-paths }}
      run: |
        $ErrorActionPreference = "Stop"
        $OsgSdkRoot = Join-Path $env:USERPROFILE ".vlink-ci\osg_sdk"
        if (Test-Path (Join-Path $OsgSdkRoot ".git")) {
          git -C $OsgSdkRoot remote set-url origin $env:OSG_SDK_REPOSITORY
          git -C $OsgSdkRoot fetch --depth 1 origin $env:OSG_SDK_REF
          git -C $OsgSdkRoot reset --hard FETCH_HEAD
        } else {
          if (Test-Path $OsgSdkRoot) {
            Remove-Item -Recurse -Force $OsgSdkRoot
          }
          git clone --depth 1 --branch $env:OSG_SDK_REF $env:OSG_SDK_REPOSITORY $OsgSdkRoot
        }
        git -C $OsgSdkRoot lfs install --local
        git -C $OsgSdkRoot lfs pull

        $OsgDir = Join-Path $OsgSdkRoot $env:OSG_PLATFORM_DIR
        $ValidationPaths = $env:OSG_VALIDATION_PATHS -split "`n"
        foreach ($Rel in $ValidationPaths) {
          $Rel = $Rel.Trim()
          if (-not $Rel) {
            continue
          }
          $FullPath = Join-Path $OsgDir $Rel
          if (-not (Test-Path $FullPath)) {
            throw "Missing OSG SDK path: $FullPath"
          }
        }

        "OSG_DIR=$OsgDir" | Out-File -FilePath $env:GITHUB_ENV -Append
        Write-Host "Resolved OSG_DIR=$OsgDir"
