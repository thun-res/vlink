name: Restore Build Cache
description: Restore a build cache with a repository-standard key/restore-key shape.

inputs:
  path:
    description: Cache paths.
    required: true
  key:
    description: Full cache key.
    required: true
  restore-keys:
    description: Restore key prefixes.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Restore cache
      uses: actions/cache@v4
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
        restore-keys: ${{ inputs.restore-keys }}
