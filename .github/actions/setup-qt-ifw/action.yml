name: Setup Qt And QtIFW
description: Install Qt with aqt, install QtIFW, and expose QT_DIR/QTIFW_DIR.

inputs:
  host:
    description: "aqt host value: linux, mac, or windows."
    required: true
  qt-version:
    description: Qt version.
    required: true
  qt-arch:
    description: aqt Qt architecture value.
    required: true
  qt-modules:
    description: Space separated Qt modules to install.
    required: false
    default: ""
  qtifw-package:
    description: QtIFW aqt package name, or latest.
    required: false
    default: latest
  cache-suffix:
    description: Cache key suffix for this Qt layout.
    required: true
  install-conan:
    description: Install conan into the aqt venv.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Restore pip cache
      if: runner.os != 'Windows'
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: pip-release-${{ runner.os }}-${{ runner.arch }}-aqt-conan-v3

    - name: Restore pip cache
      if: runner.os == 'Windows'
      uses: actions/cache@v5
      with:
        path: ~\AppData\Local\pip\Cache
        key: pip-release-${{ runner.os }}-${{ runner.arch }}-aqt-conan-v3

    - name: Restore Qt cache
      id: qt_cache
      uses: actions/cache@v5
      with:
        path: ~/.vlink-ci/qt
        key: qt-${{ runner.os }}-${{ runner.arch }}-${{ inputs.qt-version }}-${{ inputs.cache-suffix }}-v3
        restore-keys: |
          qt-${{ runner.os }}-${{ runner.arch }}-${{ inputs.qt-version }}-

    - name: Use cached Qt and QtIFW
      id: cached_qt_unix
      if: runner.os != 'Windows'
      shell: bash
      env:
        QT_HOST: ${{ inputs.host }}
        QT_VERSION: ${{ inputs.qt-version }}
        QT_ARCH: ${{ inputs.qt-arch }}
        QT_MODULES: ${{ inputs.qt-modules }}
        QTIFW_PACKAGE_INPUT: ${{ inputs.qtifw-package }}
        INSTALL_CONAN: ${{ inputs.install-conan }}
      run: |
        set -euo pipefail
        AQT_VENV="${HOME}/.vlink-ci/aqt-venv"
        QT_ROOT="${HOME}/.vlink-ci/qt"
        QT_LAYOUT_ROOT="${QT_ROOT}/${QT_VERSION}"
        QT_MARKER="${QT_LAYOUT_ROOT}/.vlink-qt-${QT_ARCH}.marker"
        QT_MARKER_VALUE="${QT_HOST}|${QT_VERSION}|${QT_ARCH}|${QT_MODULES}"
        IFW_ROOT="${QT_ROOT}/Tools/QtInstallerFramework"
        IFW_MARKER="${IFW_ROOT}/.vlink-ifw-package"

        QT_QMAKE=$(find "${QT_LAYOUT_ROOT}" -type f -path "*/bin/qmake" -print -quit 2>/dev/null || true)
        QT_QCONFIG=$(find "${QT_LAYOUT_ROOT}" -type f -path "*/mkspecs/qconfig.pri" -print -quit 2>/dev/null || true)
        QTIFW_BINARYCREATOR=$(find "${IFW_ROOT}" -type f -name binarycreator -print -quit 2>/dev/null || true)
        if [ -z "${QT_QMAKE}" ] || [ -z "${QT_QCONFIG}" ] || [ -z "${QTIFW_BINARYCREATOR}" ]; then
          exit 0
        fi
        if [ ! -f "${QT_MARKER}" ] || [ "$(cat "${QT_MARKER}" 2>/dev/null || true)" != "${QT_MARKER_VALUE}" ]; then
          exit 0
        fi
        if [ ! -f "${IFW_MARKER}" ]; then
          exit 0
        fi
        if [ "${QTIFW_PACKAGE_INPUT}" != "latest" ] && [ "$(cat "${IFW_MARKER}" 2>/dev/null || true)" != "${QTIFW_PACKAGE_INPUT}" ]; then
          exit 0
        fi

        QT_DIR=$(dirname "$(dirname "${QT_QMAKE}")")
        QTIFW_DIR=$(dirname "$(dirname "${QTIFW_BINARYCREATOR}")")
        "${QT_DIR}/bin/qmake" -query QT_VERSION | grep -q "^${QT_VERSION}$"
        test -x "${QTIFW_BINARYCREATOR}"

        if [ "${INSTALL_CONAN}" = "true" ] && [ ! -x "${AQT_VENV}/bin/conan" ]; then
          AQT_PYTHON="${VLINK_AQT_PYTHON:-}"
          if [ -n "${AQT_PYTHON}" ]; then
            AQT_PYTHON=$(command -v "${AQT_PYTHON}" 2>/dev/null || printf '%s' "${AQT_PYTHON}")
          else
            AQT_PYTHON=""
            for candidate in python3.12 python3.11 python3.10 python3; do
              if command -v "${candidate}" >/dev/null 2>&1 && "${candidate}" - <<'PY'
        import sys
        raise SystemExit(0 if sys.version_info >= (3, 10) else 1)
        PY
              then
                AQT_PYTHON=$(command -v "${candidate}")
                break
              fi
            done
          fi
          if [ -z "${AQT_PYTHON}" ] || [ ! -x "${AQT_PYTHON}" ]; then
            exit 0
          fi
          rm -rf "${AQT_VENV}"
          "${AQT_PYTHON}" -m venv "${AQT_VENV}"
          "${AQT_VENV}/bin/python" -m pip install --upgrade pip setuptools wheel
          "${AQT_VENV}/bin/python" -m pip install --upgrade conan
        fi

        echo "QT_DIR=${QT_DIR}" >> "${GITHUB_ENV}"
        echo "QTIFW_DIR=${QTIFW_DIR}" >> "${GITHUB_ENV}"
        if [ -d "${AQT_VENV}/bin" ]; then
          echo "${AQT_VENV}/bin" >> "${GITHUB_PATH}"
        fi
        echo "Using cached Qt: ${QT_DIR}"
        echo "Using cached QtIFW: ${QTIFW_DIR}"
        if [ "${INSTALL_CONAN}" = "true" ]; then
          "${AQT_VENV}/bin/conan" --version
        fi
        echo "ready=true" >> "${GITHUB_OUTPUT}"

    - name: Use cached Qt and QtIFW
      id: cached_qt_windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        QT_HOST: ${{ inputs.host }}
        QT_VERSION: ${{ inputs.qt-version }}
        QT_ARCH: ${{ inputs.qt-arch }}
        QT_MODULES: ${{ inputs.qt-modules }}
        QTIFW_PACKAGE_INPUT: ${{ inputs.qtifw-package }}
        INSTALL_CONAN: ${{ inputs.install-conan }}
      run: |
        $ErrorActionPreference = "Stop"
        $AqtVenv = Join-Path $env:USERPROFILE ".vlink-ci\aqt-venv"
        $QtRoot = Join-Path $env:USERPROFILE ".vlink-ci\qt"
        $QtLayoutRoot = Join-Path $QtRoot $env:QT_VERSION
        $QtMarker = Join-Path $QtLayoutRoot ".vlink-qt-$($env:QT_ARCH).marker"
        $QtMarkerValue = "$($env:QT_HOST)|$($env:QT_VERSION)|$($env:QT_ARCH)|$($env:QT_MODULES)"
        $IfwRoot = Join-Path $QtRoot "Tools\QtInstallerFramework"
        $IfwMarker = Join-Path $IfwRoot ".vlink-ifw-package"

        $Qmake = Get-ChildItem -Path $QtLayoutRoot -Filter qmake.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        $Qconfig = Get-ChildItem -Path $QtLayoutRoot -Filter qconfig.pri -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        $BinaryCreator = Get-ChildItem -Path $IfwRoot -Filter binarycreator.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        if ((-not $Qmake) -or (-not $Qconfig) -or (-not $BinaryCreator)) {
          exit 0
        }
        if ((-not (Test-Path $QtMarker)) -or ((Get-Content $QtMarker -Raw).Trim() -ne $QtMarkerValue)) {
          exit 0
        }
        if (-not (Test-Path $IfwMarker)) {
          exit 0
        }
        if (($env:QTIFW_PACKAGE_INPUT -ne "latest") -and ((Get-Content $IfwMarker -Raw).Trim() -ne $env:QTIFW_PACKAGE_INPUT)) {
          exit 0
        }

        $QtDir = $Qmake.Directory.Parent.FullName
        $QtIfwDir = $BinaryCreator.Directory.Parent.FullName
        $QtVersion = & "$QtDir\bin\qmake.exe" -query QT_VERSION
        if ($QtVersion.Trim() -ne $env:QT_VERSION) {
          exit 0
        }

        $ConanExe = Join-Path $AqtVenv "Scripts\conan.exe"
        if (($env:INSTALL_CONAN -eq "true") -and (-not (Test-Path $ConanExe))) {
          if (-not (Get-Command python -ErrorAction SilentlyContinue)) {
            exit 0
          }
          if (Test-Path $AqtVenv) {
            Remove-Item -Recurse -Force $AqtVenv
          }
          python -m venv $AqtVenv
          & "$AqtVenv\Scripts\python.exe" -m pip install --upgrade pip setuptools wheel
          & "$AqtVenv\Scripts\python.exe" -m pip install --upgrade conan
        }

        "QT_DIR=$QtDir" | Out-File -FilePath $env:GITHUB_ENV -Append
        "QTIFW_DIR=$QtIfwDir" | Out-File -FilePath $env:GITHUB_ENV -Append
        if (Test-Path (Join-Path $AqtVenv "Scripts")) {
          "$AqtVenv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Append
        }
        Write-Host "Using cached Qt: $QtDir"
        Write-Host "Using cached QtIFW: $QtIfwDir"
        if ($env:INSTALL_CONAN -eq "true") {
          & $ConanExe --version
        }
        "ready=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    - name: Install Qt and QtIFW
      if: runner.os != 'Windows' && steps.cached_qt_unix.outputs.ready != 'true'
      shell: bash
      env:
        QT_HOST: ${{ inputs.host }}
        QT_VERSION: ${{ inputs.qt-version }}
        QT_ARCH: ${{ inputs.qt-arch }}
        QT_MODULES: ${{ inputs.qt-modules }}
        QTIFW_PACKAGE_INPUT: ${{ inputs.qtifw-package }}
        INSTALL_CONAN: ${{ inputs.install-conan }}
      run: |
        set -euo pipefail
        AQT_VENV="${HOME}/.vlink-ci/aqt-venv"
        QT_ROOT="${HOME}/.vlink-ci/qt"
        export PIP_CACHE_DIR="${HOME}/.cache/pip"
        install_python_standalone() {
          local python_arch python_url
          case "$(uname -m)" in
            x86_64) python_arch=x86_64 ;;
            aarch64|arm64) python_arch=aarch64 ;;
            *)
              echo "Unsupported Python standalone architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          if ! command -v curl >/dev/null 2>&1; then
            if [ "$(id -u)" = "0" ] && command -v apt-get >/dev/null 2>&1; then
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates curl tar
            else
              echo "curl is required to install Python standalone for aqtinstall." >&2
              exit 1
            fi
          fi
          PYTHON_STANDALONE_RELEASE=20260610
          PYTHON_STANDALONE_VERSION=3.10.20
          PYTHON_STANDALONE_ROOT="${HOME}/.vlink-ci/python/cp310"
          if [ ! -x "${PYTHON_STANDALONE_ROOT}/bin/python3.10" ]; then
            rm -rf "${PYTHON_STANDALONE_ROOT}"
            mkdir -p "${PYTHON_STANDALONE_ROOT}"
            python_url="https://github.com/astral-sh/python-build-standalone/releases/download/${PYTHON_STANDALONE_RELEASE}/cpython-${PYTHON_STANDALONE_VERSION}%2B${PYTHON_STANDALONE_RELEASE}-${python_arch}-unknown-linux-gnu-install_only_stripped.tar.gz"
            for attempt in 1 2 3 4 5; do
              if curl -fL --connect-timeout 30 --speed-limit 1024 --speed-time 60 "${python_url}" -o /tmp/vlink-python-standalone.tar.gz; then
                break
              fi
              rm -f /tmp/vlink-python-standalone.tar.gz
              if [ "${attempt}" = "5" ]; then
                exit 1
              fi
              sleep "$((attempt * 5))"
            done
            tar -xzf /tmp/vlink-python-standalone.tar.gz -C "${PYTHON_STANDALONE_ROOT}" --strip-components=1
            rm -f /tmp/vlink-python-standalone.tar.gz
          fi
          AQT_PYTHON="${PYTHON_STANDALONE_ROOT}/bin/python3.10"
        }
        AQT_PYTHON="${VLINK_AQT_PYTHON:-}"
        if [ -n "${AQT_PYTHON}" ]; then
          AQT_PYTHON=$(command -v "${AQT_PYTHON}" 2>/dev/null || printf '%s' "${AQT_PYTHON}")
          if [ ! -x "${AQT_PYTHON}" ]; then
            echo "Configured VLINK_AQT_PYTHON is not executable: ${AQT_PYTHON}" >&2
            exit 1
          fi
        else
          for candidate in python3.12 python3.11 python3.10 python3; do
            if command -v "${candidate}" >/dev/null 2>&1 && "${candidate}" - <<'PY'
        import sys
        raise SystemExit(0 if sys.version_info >= (3, 10) else 1)
        PY
            then
              AQT_PYTHON=$(command -v "${candidate}")
              break
            fi
          done
        fi
        if [ -z "${AQT_PYTHON}" ]; then
          install_python_standalone
        fi
        if [ -z "${AQT_PYTHON}" ]; then
          echo "Python >= 3.10 is required for aqtinstall with Qt ${QT_VERSION}." >&2
          exit 1
        fi
        "${AQT_PYTHON}" - <<'PY'
        import sys
        raise SystemExit(0 if sys.version_info >= (3, 10) else 1)
        PY
        echo "Using aqt Python: ${AQT_PYTHON}"
        PY_INCLUDE=$("${AQT_PYTHON}" - <<'PY'
        import sysconfig
        print(sysconfig.get_path("include") or "")
        PY
        )
        if [ -n "${PY_INCLUDE}" ] && [ ! -f "${PY_INCLUDE}/Python.h" ]; then
          echo "Selected Python has no Python.h under ${PY_INCLUDE}; using Python standalone."
          install_python_standalone
          PY_INCLUDE=$("${AQT_PYTHON}" - <<'PY'
        import sysconfig
        print(sysconfig.get_path("include") or "")
        PY
        )
          test -f "${PY_INCLUDE}/Python.h"
        fi
        rm -rf "${AQT_VENV}"
        "${AQT_PYTHON}" -m venv "${AQT_VENV}"
        packages=("aqtinstall>=3.3.0,<4")
        [ "${INSTALL_CONAN}" = "true" ] && packages+=(conan)
        "${AQT_VENV}/bin/python" -m pip install --upgrade pip setuptools wheel
        "${AQT_VENV}/bin/python" -m pip install --upgrade "${packages[@]}"
        "${AQT_VENV}/bin/python" - <<'PY'
        import re
        from importlib.metadata import version
        current = tuple(int(part) for part in re.match(r"^(\d+)\.(\d+)\.(\d+)", version("aqtinstall")).groups())
        raise SystemExit(0 if current >= (3, 3, 0) else 1)
        PY
        AQT="${AQT_VENV}/bin/aqt"

        QT_LAYOUT_ROOT="${QT_ROOT}/${QT_VERSION}"
        QT_MARKER="${QT_LAYOUT_ROOT}/.vlink-qt-${QT_ARCH}.marker"
        QT_MARKER_VALUE="${QT_HOST}|${QT_VERSION}|${QT_ARCH}|${QT_MODULES}"
        QT_QMAKE=$(find "${QT_LAYOUT_ROOT}" -type f -path "*/bin/qmake" -print -quit 2>/dev/null || true)
        QT_QCONFIG=$(find "${QT_LAYOUT_ROOT}" -type f -path "*/mkspecs/qconfig.pri" -print -quit 2>/dev/null || true)
        if [ -z "${QT_QMAKE}" ] || [ -z "${QT_QCONFIG}" ] || [ ! -f "${QT_MARKER}" ] || [ "$(cat "${QT_MARKER}" 2>/dev/null || true)" != "${QT_MARKER_VALUE}" ]; then
          rm -rf "${QT_LAYOUT_ROOT}"
          read -r -a modules <<< "${QT_MODULES}"
          if [ ${#modules[@]} -gt 0 ]; then
            "${AQT}" install-qt "${QT_HOST}" desktop "${QT_VERSION}" "${QT_ARCH}" -O "${QT_ROOT}" -m "${modules[@]}"
          else
            "${AQT}" install-qt "${QT_HOST}" desktop "${QT_VERSION}" "${QT_ARCH}" -O "${QT_ROOT}"
          fi
          QT_QMAKE=$(find "${QT_LAYOUT_ROOT}" -type f -path "*/bin/qmake" -print -quit)
          QT_QCONFIG=$(find "${QT_LAYOUT_ROOT}" -type f -path "*/mkspecs/qconfig.pri" -print -quit)
          test -n "${QT_QMAKE}"
          test -n "${QT_QCONFIG}"
          printf '%s\n' "${QT_MARKER_VALUE}" > "${QT_MARKER}"
        fi

        if [ "${QTIFW_PACKAGE_INPUT}" = "latest" ]; then
          IFW_LIST=$("${AQT}" list-tool "${QT_HOST}" desktop tools_ifw)
          IFW_PACKAGE=$(printf '%s\n' "${IFW_LIST}" | "${AQT_VENV}/bin/python" -c '
          import re
          import sys
          packages = re.findall(r"qt\.tools\.ifw\.[0-9.]+", sys.stdin.read())
          def version_key(package):
              version = package.removeprefix("qt.tools.ifw.").strip(".")
              return tuple(int(part) for part in version.split(".") if part)
          if packages:
              print(sorted(set(packages), key=version_key)[-1])
          ')
        else
          IFW_PACKAGE="${QTIFW_PACKAGE_INPUT}"
        fi
        if [ -z "${IFW_PACKAGE}" ]; then
          echo "No Qt Installer Framework package found by aqt." >&2
          exit 1
        fi

        IFW_ROOT="${QT_ROOT}/Tools/QtInstallerFramework"
        IFW_MARKER="${IFW_ROOT}/.vlink-ifw-package"
        QTIFW_BINARYCREATOR=$(find "${IFW_ROOT}" -type f -name binarycreator -print -quit 2>/dev/null || true)
        if [ ! -f "${IFW_MARKER}" ] || [ "$(cat "${IFW_MARKER}")" != "${IFW_PACKAGE}" ] || [ -z "${QTIFW_BINARYCREATOR}" ]; then
          rm -rf "${IFW_ROOT}"
          "${AQT}" install-tool "${QT_HOST}" desktop tools_ifw "${IFW_PACKAGE}" -O "${QT_ROOT}"
          mkdir -p "${IFW_ROOT}"
          printf '%s\n' "${IFW_PACKAGE}" > "${IFW_MARKER}"
        fi

        QT_QMAKE=$(find "${QT_ROOT}/${QT_VERSION}" -type f -path "*/bin/qmake" -print -quit)
        QTIFW_BINARYCREATOR=$(find "${IFW_ROOT}" -type f -name binarycreator -print -quit)
        test -n "${QT_QMAKE}"
        test -n "${QTIFW_BINARYCREATOR}"

        QT_DIR=$(dirname "$(dirname "${QT_QMAKE}")")
        QTIFW_DIR=$(dirname "$(dirname "${QTIFW_BINARYCREATOR}")")
        echo "QT_DIR=${QT_DIR}" >> "${GITHUB_ENV}"
        echo "QTIFW_DIR=${QTIFW_DIR}" >> "${GITHUB_ENV}"
        echo "${AQT_VENV}/bin" >> "${GITHUB_PATH}"
        "${QT_DIR}/bin/qmake" -query QT_VERSION
        test -x "${QTIFW_BINARYCREATOR}"
        echo "QTIFW binarycreator: ${QTIFW_BINARYCREATOR}"
        if [ "${INSTALL_CONAN}" = "true" ]; then
          "${AQT_VENV}/bin/conan" --version
        fi

    - name: Install Qt and QtIFW
      if: runner.os == 'Windows' && steps.cached_qt_windows.outputs.ready != 'true'
      shell: pwsh
      env:
        QT_HOST: ${{ inputs.host }}
        QT_VERSION: ${{ inputs.qt-version }}
        QT_ARCH: ${{ inputs.qt-arch }}
        QT_MODULES: ${{ inputs.qt-modules }}
        QTIFW_PACKAGE_INPUT: ${{ inputs.qtifw-package }}
        INSTALL_CONAN: ${{ inputs.install-conan }}
      run: |
        $ErrorActionPreference = "Stop"
        $AqtVenv = Join-Path $env:USERPROFILE ".vlink-ci\aqt-venv"
        $QtRoot = Join-Path $env:USERPROFILE ".vlink-ci\qt"
        python -m venv $AqtVenv
        $Packages = @("aqtinstall>=3.3.0,<4")
        if ($env:INSTALL_CONAN -eq "true") {
          $Packages += "conan"
        }
        & "$AqtVenv\Scripts\python.exe" -m pip install --upgrade pip setuptools wheel
        & "$AqtVenv\Scripts\python.exe" -m pip install --upgrade $Packages
        $Aqt = "$AqtVenv\Scripts\aqt.exe"

        $QtLayoutRoot = Join-Path $QtRoot $env:QT_VERSION
        $QtMarker = Join-Path $QtLayoutRoot ".vlink-qt-$($env:QT_ARCH).marker"
        $QtMarkerValue = "$($env:QT_HOST)|$($env:QT_VERSION)|$($env:QT_ARCH)|$($env:QT_MODULES)"
        $ExistingQmake = Get-ChildItem -Path $QtLayoutRoot -Filter qmake.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        $ExistingQconfig = Get-ChildItem -Path $QtLayoutRoot -Filter qconfig.pri -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        $CachedQtMarker = ""
        if (Test-Path $QtMarker) {
          $CachedQtMarker = (Get-Content $QtMarker -Raw).Trim()
        }
        if ((-not $ExistingQmake) -or (-not $ExistingQconfig) -or (-not (Test-Path $QtMarker)) -or ($CachedQtMarker -ne $QtMarkerValue)) {
          if (Test-Path $QtLayoutRoot) {
            Remove-Item -Recurse -Force $QtLayoutRoot
          }
          $Args = @("install-qt", $env:QT_HOST, "desktop", $env:QT_VERSION, $env:QT_ARCH, "-O", $QtRoot)
          $Modules = @()
          if ($env:QT_MODULES.Trim()) {
            $Modules = $env:QT_MODULES -split '\s+'
          }
          if ($Modules.Count -gt 0) {
            $Args += "-m"
            $Args += $Modules
          }
          & $Aqt @Args
          $ExistingQmake = Get-ChildItem -Path $QtLayoutRoot -Filter qmake.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          $ExistingQconfig = Get-ChildItem -Path $QtLayoutRoot -Filter qconfig.pri -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $ExistingQmake) {
            throw "qmake.exe not found under $QtLayoutRoot"
          }
          if (-not $ExistingQconfig) {
            throw "qconfig.pri not found under $QtLayoutRoot"
          }
          New-Item -ItemType Directory -Force -Path $QtLayoutRoot | Out-Null
          $QtMarkerValue | Out-File -FilePath $QtMarker -Encoding ascii
        }

        if ($env:QTIFW_PACKAGE_INPUT -eq "latest") {
          $IfwList = & $Aqt list-tool $env:QT_HOST desktop tools_ifw
          $IfwPackage = $IfwList |
            Select-String -Pattern 'qt\.tools\.ifw\.[0-9.]+' -AllMatches |
            ForEach-Object { $_.Matches.Value } |
            Sort-Object { [version](($_ -replace '^qt\.tools\.ifw\.', '') -replace '\.$', '') } |
            Select-Object -Last 1
        } else {
          $IfwPackage = $env:QTIFW_PACKAGE_INPUT
        }
        if (-not $IfwPackage) {
          throw "No Qt Installer Framework package found by aqt."
        }

        $IfwRoot = Join-Path $QtRoot "Tools\QtInstallerFramework"
        $IfwMarker = Join-Path $IfwRoot ".vlink-ifw-package"
        $BinaryCreator = Get-ChildItem -Path $IfwRoot -Filter binarycreator.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        $NeedsIfwInstall = $true
        if ((Test-Path $IfwMarker) -and $BinaryCreator) {
          $CachedPackage = (Get-Content $IfwMarker -Raw).Trim()
          $NeedsIfwInstall = ($CachedPackage -ne $IfwPackage)
        }
        if ($NeedsIfwInstall -and (Test-Path $IfwRoot)) {
          Remove-Item -Recurse -Force $IfwRoot
        }
        if ($NeedsIfwInstall) {
          & $Aqt install-tool $env:QT_HOST desktop tools_ifw $IfwPackage -O $QtRoot
          New-Item -ItemType Directory -Force -Path $IfwRoot | Out-Null
          $IfwPackage | Out-File -FilePath $IfwMarker -Encoding ascii
        }

        $Qmake = Get-ChildItem -Path $QtLayoutRoot -Filter qmake.exe -Recurse | Select-Object -First 1
        $BinaryCreator = Get-ChildItem -Path (Join-Path $QtRoot "Tools\QtInstallerFramework") -Filter binarycreator.exe -Recurse | Select-Object -First 1
        if (-not $Qmake) {
          throw "qmake.exe not found under $QtLayoutRoot"
        }
        if (-not $BinaryCreator) {
          throw "binarycreator.exe not found under $QtRoot\Tools\QtInstallerFramework"
        }

        $QtDir = $Qmake.Directory.Parent.FullName
        $QtIfwDir = $BinaryCreator.Directory.Parent.FullName
        "QT_DIR=$QtDir" | Out-File -FilePath $env:GITHUB_ENV -Append
        "QTIFW_DIR=$QtIfwDir" | Out-File -FilePath $env:GITHUB_ENV -Append
        "$AqtVenv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Append
        & "$QtDir\bin\qmake.exe" -query QT_VERSION
        Write-Host "QtIFW binarycreator: $($BinaryCreator.FullName)"
        if ($env:INSTALL_CONAN -eq "true") {
          & "$AqtVenv\Scripts\conan.exe" --version
        }
