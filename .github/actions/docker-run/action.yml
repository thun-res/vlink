name: Docker Run
description: Run a CI command inside a prepared Docker image with workspace and build caches mounted.

inputs:
  image:
    description: Docker image tag.
    required: true
  command:
    description: Bash command to run inside the container.
    required: true

runs:
  using: composite
  steps:
    - name: Run command in Docker
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        COMMAND: ${{ inputs.command }}
      run: |
        set -euo pipefail
        if [ -z "${IMAGE}" ]; then
          echo "::error::Docker image input is empty."
          exit 1
        fi
        mkdir -p "${HOME}/.ccache" "${HOME}/.conan2" "${HOME}/.vlink-ci" "${HOME}/.vlink-cpm-cache" "${HOME}/.vlink-docker-home"
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          --volume "${GITHUB_WORKSPACE}:/work/vlink" \
          --volume "${HOME}/.vlink-docker-home:/github/home" \
          --volume "${HOME}/.vlink-ci:/github/home/.vlink-ci" \
          --volume "${HOME}/.ccache:/github/home/.ccache" \
          --volume "${HOME}/.conan2:/github/home/.conan2" \
          --volume "${HOME}/.vlink-cpm-cache:/github/home/.vlink-cpm-cache" \
          --workdir /work/vlink \
          --env HOME=/github/home \
          --env GITHUB_WORKSPACE=/work/vlink \
          --env CCACHE_DIR=/github/home/.ccache \
          --env CCACHE_BASEDIR=/work/vlink \
          --env VLINK_CMAKE_DISABLE_IPO \
          --env CMAKE_BUILD_PARALLEL_LEVEL \
          --env CLANG_TIDY_JOBS \
          --env CCACHE_COMPRESS \
          --env CCACHE_MAXSIZE \
          --env CTEST_OUTPUT_ON_FAILURE \
          --env PIP_DISABLE_PIP_VERSION_CHECK \
          --env VLINK_CI_CMAKE_ARGS \
          "${IMAGE}" \
          bash -lc "${COMMAND}"
