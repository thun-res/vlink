name: Prepare CI Image
description: Pull a GHCR CI image, or build a local fallback image when it is not published yet.

inputs:
  image:
    description: GHCR image to pull.
    required: true
  context:
    description: Docker build context for the local fallback.
    required: true
  dockerfile:
    description: Dockerfile for the local fallback.
    required: true
  local-tag:
    description: Local fallback image tag.
    required: true
  required-tools:
    description: Space-separated tools that must exist in a pulled image before it can be reused.
    required: false
    default: ""
  verify-command:
    description: Optional bash command that must pass inside a pulled image before it can be reused.
    required: false
    default: ""

outputs:
  image:
    description: Resolved Docker image tag.
    value: ${{ steps.prepare.outputs.image }}

runs:
  using: composite
  steps:
    - name: Pull or build image
      id: prepare
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        CONTEXT: ${{ inputs.context }}
        DOCKERFILE: ${{ inputs.dockerfile }}
        LOCAL_TAG: ${{ inputs.local-tag }}
        REQUIRED_TOOLS: ${{ inputs.required-tools }}
        VERIFY_COMMAND: ${{ inputs.verify-command }}
      run: |
        set -euo pipefail
        if docker pull "${IMAGE}"; then
          image_ok=true
          if [ -n "${REQUIRED_TOOLS}" ]; then
            docker run --rm "${IMAGE}" bash -lc 'for tool in '"${REQUIRED_TOOLS}"'; do command -v "${tool}" >/dev/null || exit 1; done' || image_ok=false
          fi
          if [ "${image_ok}" = "true" ] && [ -n "${VERIFY_COMMAND}" ]; then
            docker run --rm "${IMAGE}" bash -lc "${VERIFY_COMMAND}" || image_ok=false
          fi
          if [ "${image_ok}" = "true" ]; then
            echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "::warning::Image ${IMAGE} is available but failed validation. Building local fallback ${LOCAL_TAG}."
        else
          echo "::warning::Image ${IMAGE} is not available; building local fallback ${LOCAL_TAG}."
        fi

        DOCKER_BUILDKIT=1 docker build --pull -t "${LOCAL_TAG}" -f "${DOCKERFILE}" "${CONTEXT}"
        echo "image=${LOCAL_TAG}" >> "${GITHUB_OUTPUT}"
