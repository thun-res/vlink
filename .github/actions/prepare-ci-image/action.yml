name: Prepare CI Image
description: Pull and validate a prebuilt GHCR CI image.

inputs:
  image:
    description: GHCR image to pull.
    required: true
  required-tools:
    description: Space-separated tools that must exist in the image before it can be reused.
    required: false
    default: ""
  verify-command:
    description: Optional bash command that must pass inside the image before it can be reused.
    required: false
    default: ""

outputs:
  image:
    description: Resolved Docker image tag.
    value: ${{ steps.prepare.outputs.image }}

runs:
  using: composite
  steps:
    - name: Pull and validate image
      id: prepare
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        REQUIRED_TOOLS: ${{ inputs.required-tools }}
        VERIFY_COMMAND: ${{ inputs.verify-command }}
      run: |
        set -euo pipefail

        docker pull --quiet "${IMAGE}" >/dev/null

        if [ -n "${REQUIRED_TOOLS}" ]; then
          docker run --rm --env LANG=C.UTF-8 --env LC_ALL=C.UTF-8 "${IMAGE}" bash -lc 'for tool in '"${REQUIRED_TOOLS}"'; do command -v "${tool}" >/dev/null || exit 1; done'
        fi

        if [ -n "${VERIFY_COMMAND}" ]; then
          docker run --rm --env LANG=C.UTF-8 --env LC_ALL=C.UTF-8 "${IMAGE}" bash -lc "${VERIFY_COMMAND}"
        fi

        echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
