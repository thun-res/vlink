name: Run Clang-Tidy
description: Run clang-tidy over project source files from compile_commands.json.

inputs:
  build-dir:
    description: Build directory containing compile_commands.json.
    required: true

runs:
  using: composite
  steps:
    - name: Run clang-tidy
      shell: bash
      env:
        BUILD_DIR: ${{ inputs.build-dir }}
      run: |
        set -euo pipefail
        python3 .github/scripts/run-clang-tidy.py
