name: CMake Configure And Build
description: Configure and optionally build vlink with a shared CMake invocation.

inputs:
  source-dir:
    description: Source directory.
    required: false
    default: "."
  build-dir:
    description: Build directory.
    required: true
  cmake-args:
    description: CMake configure arguments.
    required: true
  configure-extra-args:
    description: Extra configure arguments.
    required: false
    default: ""
  build-args:
    description: Arguments passed after cmake --build <dir>.
    required: false
    default: "--parallel"
  configure-only:
    description: Set to true to skip cmake --build.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Configure
      if: runner.os != 'Windows'
      shell: bash
      env:
        SOURCE_DIR: ${{ inputs.source-dir }}
        BUILD_DIR: ${{ inputs.build-dir }}
        CMAKE_ARGS: ${{ inputs.cmake-args }}
        CONFIGURE_EXTRA_ARGS: ${{ inputs.configure-extra-args }}
      run: |
        set -euo pipefail
        env_extra_args=()
        if [ -n "${OPENSSL_ROOT_DIR:-}" ]; then
          env_extra_args+=("-DOPENSSL_ROOT_DIR=${OPENSSL_ROOT_DIR}")
        fi
        cmake -S "${SOURCE_DIR}" -B "${BUILD_DIR}" ${CMAKE_ARGS} ${CONFIGURE_EXTRA_ARGS} "${env_extra_args[@]}"

    - name: Configure
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        SOURCE_DIR: ${{ inputs.source-dir }}
        BUILD_DIR: ${{ inputs.build-dir }}
        CMAKE_ARGS: ${{ inputs.cmake-args }}
        CONFIGURE_EXTRA_ARGS: ${{ inputs.configure-extra-args }}
      run: |
        $ErrorActionPreference = "Stop"
        $ArgsList = @("-S", $env:SOURCE_DIR, "-B", $env:BUILD_DIR)
        if ($env:CMAKE_ARGS -and $env:CMAKE_ARGS.Trim()) {
          $ArgsList += $env:CMAKE_ARGS -split '\s+'
        }
        if ($env:CONFIGURE_EXTRA_ARGS -and $env:CONFIGURE_EXTRA_ARGS.Trim()) {
          $ArgsList += $env:CONFIGURE_EXTRA_ARGS -split '\s+'
        }
        if ($env:OPENSSL_ROOT_DIR) {
          $ArgsList += "-DOPENSSL_ROOT_DIR=$env:OPENSSL_ROOT_DIR"
        }
        & cmake @ArgsList

    - name: Build
      if: inputs.configure-only != 'true' && runner.os != 'Windows'
      shell: bash
      env:
        BUILD_DIR: ${{ inputs.build-dir }}
        BUILD_ARGS: ${{ inputs.build-args }}
      run: |
        set -euo pipefail
        cmake --build "${BUILD_DIR}" ${BUILD_ARGS}

    - name: Build
      if: inputs.configure-only != 'true' && runner.os == 'Windows'
      shell: pwsh
      env:
        BUILD_DIR: ${{ inputs.build-dir }}
        BUILD_ARGS: ${{ inputs.build-args }}
      run: |
        $ErrorActionPreference = "Stop"
        $ArgsList = @("--build", $env:BUILD_DIR)
        if ($env:BUILD_ARGS -and $env:BUILD_ARGS.Trim()) {
          $ArgsList += $env:BUILD_ARGS -split '\s+'
        }
        & cmake @ArgsList
