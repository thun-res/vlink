name: Setup Compiler Cache
description: Configure ccache or sccache with repository-standard cache keys.

inputs:
  backend:
    description: "Compiler cache backend: ccache or sccache."
    required: true
  cache-key:
    description: Primary cache key for ccache, or SCCACHE_GHA_VERSION for sccache.
    required: true
  restore-keys:
    description: Restore key prefixes for ccache.
    required: false
    default: ""
  cache-path:
    description: Cache path for ccache.
    required: false
    default: ~/.ccache
  max-size:
    description: Maximum ccache size.
    required: false
    default: 1G
  cmake-wrapper:
    description: Prepend a cmake wrapper that injects compiler launcher args on configure calls.
    required: false
    default: "false"
  disable-ipo:
    description: Inject -DENABLE_IPO=OFF into wrapped CMake configure calls.
    required: false
    default: "false"

outputs:
  cache-hit:
    description: Whether ccache restored an exact primary-key match.
    value: ${{ steps.restore-ccache.outputs.cache-hit }}
  cache-key:
    description: Primary ccache key to save after compilation.
    value: ${{ inputs.cache-key }}
  cache-path:
    description: ccache path to save after compilation.
    value: ${{ inputs.cache-path }}

runs:
  using: composite
  steps:
    - name: Restore ccache
      id: restore-ccache
      if: inputs.backend == 'ccache'
      uses: actions/cache/restore@v5
      with:
        path: ${{ inputs.cache-path }}
        key: ${{ inputs.cache-key }}
        restore-keys: ${{ inputs.restore-keys }}

    - name: Configure ccache
      if: inputs.backend == 'ccache' && runner.os != 'Windows'
      shell: bash
      env:
        CACHE_PATH: ${{ inputs.cache-path }}
        MAX_SIZE: ${{ inputs.max-size }}
        CMAKE_WRAPPER: ${{ inputs.cmake-wrapper }}
        DISABLE_IPO: ${{ inputs.disable-ipo }}
      run: |
        set -euo pipefail
        cache_dir="${CACHE_PATH/#\~/${HOME}}"
        mkdir -p "${cache_dir}"
        {
          echo "CCACHE_DIR=${cache_dir}"
          echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
          echo "CCACHE_COMPRESS=true"
          echo "CCACHE_COMPILERCHECK=content"
          echo "CCACHE_MAXSIZE=${MAX_SIZE}"
          echo "VLINK_CMAKE_DISABLE_IPO=${DISABLE_IPO}"
        } >> "${GITHUB_ENV}"
        if command -v ccache >/dev/null 2>&1; then
          ccache --zero-stats || true
        elif [ "${CMAKE_WRAPPER}" = "true" ]; then
          echo "::error::ccache is required when cmake-wrapper is enabled."
          exit 1
        fi

        if [ "${CMAKE_WRAPPER}" = "true" ]; then
          real_cmake="$(command -v cmake)"
          wrapper_dir="${RUNNER_TEMP}/vlink-cmake-wrapper"
          mkdir -p "${wrapper_dir}"
          cat > "${wrapper_dir}/cmake" <<'EOF'
        #!/usr/bin/env bash
        set -euo pipefail
        args=("$@")
        inject=1
        have_c=0
        have_cxx=0
        have_ipo=0
        for arg in "$@"; do
          case "${arg}" in
            --build|--install|-E|-P|--version|--help|--help-*|--system-information|--find-package|--workflow)
              inject=0
              break
              ;;
            -DCMAKE_C_COMPILER_LAUNCHER=*) have_c=1 ;;
            -DCMAKE_CXX_COMPILER_LAUNCHER=*) have_cxx=1 ;;
            -DENABLE_IPO=*) have_ipo=1 ;;
          esac
        done
        if [ "${inject}" = "1" ]; then
          [ "${have_c}" = "1" ] || args+=("-DCMAKE_C_COMPILER_LAUNCHER=ccache")
          [ "${have_cxx}" = "1" ] || args+=("-DCMAKE_CXX_COMPILER_LAUNCHER=ccache")
          if [ "${VLINK_CMAKE_DISABLE_IPO:-false}" = "true" ] && [ "${have_ipo}" = "0" ]; then
            args+=("-DENABLE_IPO=OFF")
          fi
        fi
        exec "${VLINK_REAL_CMAKE}" "${args[@]}"
        EOF
          chmod +x "${wrapper_dir}/cmake"
          echo "VLINK_REAL_CMAKE=${real_cmake}" >> "${GITHUB_ENV}"
          echo "${wrapper_dir}" >> "${GITHUB_PATH}"
        fi

    - name: Configure sccache environment
      if: inputs.backend == 'sccache'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        "SCCACHE_GHA_ENABLED=true" | Out-File -FilePath $env:GITHUB_ENV -Append
        "SCCACHE_CACHE_SIZE=10G" | Out-File -FilePath $env:GITHUB_ENV -Append
        "SCCACHE_IDLE_TIMEOUT=0" | Out-File -FilePath $env:GITHUB_ENV -Append
        "SCCACHE_GHA_VERSION=${{ inputs.cache-key }}" | Out-File -FilePath $env:GITHUB_ENV -Append
        "VLINK_CMAKE_DISABLE_IPO=${{ inputs.disable-ipo }}" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Setup sccache
      if: inputs.backend == 'sccache'
      uses: mozilla-actions/sccache-action@v0.0.10
      with:
        version: "v0.15.0"

    - name: Start sccache
      if: inputs.backend == 'sccache'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        sccache --start-server
        sccache --show-stats
