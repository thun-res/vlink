name: Feature Request
description: Propose a vlink feature or packaging improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use Case
      description: What workflow or integration does this unlock?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the desired behavior or interface.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Core library
        - CLI
        - Proxy
        - Viewer
        - Webviz
        - Packaging
        - CI/CD
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Existing workaround or design alternatives.
