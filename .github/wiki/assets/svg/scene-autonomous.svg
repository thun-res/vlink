<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="VLink powering autonomous driving data flow">
  <defs>
    <linearGradient id="ad-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#0B1228"/>
      <stop offset="1"   stop-color="#070B18"/>
    </linearGradient>
    <linearGradient id="ad-road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182758"/>
      <stop offset="1" stop-color="#0B1228"/>
    </linearGradient>
    <linearGradient id="ad-lidar" x1="0" x2="1">
      <stop offset="0"   stop-color="#00e5b0" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#00e5b0" stop-opacity="0.5"/>
      <stop offset="1"   stop-color="#00e5b0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ad-cam" x1="0" x2="1">
      <stop offset="0" stop-color="#4faafd" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4faafd" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4faafd" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ad-lidar-ring" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.6" stop-color="transparent"/>
      <stop offset="0.8" stop-color="#00e5b0" stop-opacity="0.35"/>
      <stop offset="1"   stop-color="transparent"/>
    </radialGradient>
    <filter id="ad-glow"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>

  <!-- backdrop -->
  <rect width="800" height="450" fill="url(#ad-bg)"/>

  <!-- Road perspective lines -->
  <g opacity="0.6">
    <path d="M 400 450 L 100 220" stroke="#182758" stroke-width="1.2" fill="none"/>
    <path d="M 400 450 L 700 220" stroke="#182758" stroke-width="1.2" fill="none"/>
    <path d="M 400 450 L 250 220" stroke="#182758" stroke-width="0.8" fill="none" stroke-dasharray="6 8"/>
    <path d="M 400 450 L 550 220" stroke="#182758" stroke-width="0.8" fill="none" stroke-dasharray="6 8"/>
  </g>

  <!-- Grid horizon -->
  <g opacity="0.35">
    <line x1="120" y1="220" x2="680" y2="220" stroke="#2a3a6c" stroke-width="0.5"/>
    <line x1="160" y1="260" x2="640" y2="260" stroke="#2a3a6c" stroke-width="0.5"/>
    <line x1="200" y1="300" x2="600" y2="300" stroke="#2a3a6c" stroke-width="0.5"/>
    <line x1="250" y1="345" x2="550" y2="345" stroke="#2a3a6c" stroke-width="0.5"/>
  </g>

  <!-- LiDAR scanning rings (animated) -->
  <g transform="translate(400 315)">
    <circle r="60" fill="none" stroke="#00e5b0" stroke-opacity="0.35" stroke-width="1">
      <animate attributeName="r" from="20" to="150" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" from="0.5" to="0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="60" fill="none" stroke="#00e5b0" stroke-opacity="0.35" stroke-width="1">
      <animate attributeName="r" from="20" to="150" dur="3s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" from="0.5" to="0" dur="3s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle r="60" fill="none" stroke="#00e5b0" stroke-opacity="0.35" stroke-width="1">
      <animate attributeName="r" from="20" to="150" dur="3s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" from="0.5" to="0" dur="3s" begin="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Camera cones (front & sides) -->
  <g opacity="0.55">
    <path d="M 400 310 L 280 180 L 520 180 Z" fill="url(#ad-cam)"/>
    <path d="M 400 310 L 220 260 L 170 345 Z" fill="url(#ad-cam)" opacity="0.6"/>
    <path d="M 400 310 L 580 260 L 630 345 Z" fill="url(#ad-cam)" opacity="0.6"/>
  </g>

  <!-- Car (top-down simplified) -->
  <g transform="translate(400 315)">
    <!-- Body -->
    <rect x="-30" y="-48" width="60" height="96" rx="14" fill="#1a2a5e" stroke="#4faafd" stroke-width="1.5"/>
    <!-- Windshield -->
    <path d="M -22 -30 L 22 -30 L 18 -8 L -18 -8 Z" fill="#4faafd" opacity="0.3"/>
    <!-- Rear window -->
    <path d="M -22 34 L 22 34 L 18 18 L -18 18 Z" fill="#4faafd" opacity="0.18"/>
    <!-- Headlights -->
    <circle cx="-20" cy="-46" r="3" fill="#4faafd"/>
    <circle cx="20"  cy="-46" r="3" fill="#4faafd"/>
    <!-- Roof LiDAR -->
    <circle r="6" fill="#00e5b0" filter="url(#ad-glow)"/>
    <circle r="9" fill="none" stroke="#00e5b0" stroke-opacity="0.5"/>
  </g>

  <!-- Data packets flowing from car to topics -->
  <g>
    <!-- Packet 1: LiDAR → perception -->
    <circle r="3.5" fill="#00e5b0">
      <animateMotion dur="2.4s" repeatCount="indefinite" path="M 400 315 Q 520 250 680 140"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" fill="#00e5b0">
      <animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite" path="M 400 315 Q 520 250 680 140"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    </circle>

    <!-- Packet 2: Camera → fusion -->
    <circle r="3.5" fill="#4faafd">
      <animateMotion dur="2.4s" begin="0.4s" repeatCount="indefinite" path="M 400 315 Q 260 240 120 140"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" fill="#4faafd">
      <animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M 400 315 Q 260 240 120 140"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>

    <!-- Packet 3: IMU → localization -->
    <circle r="3" fill="#ffd166">
      <animateMotion dur="2s" repeatCount="indefinite" path="M 400 315 Q 340 210 400 80"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Subscriber nodes (perception / planning / localization / control) -->
  <g font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">
    <g transform="translate(120 135)">
      <rect x="-66" y="-22" width="132" height="44" rx="10" fill="#0f193b" stroke="#4faafd" stroke-width="1.2"/>
      <text y="-4" fill="#C8D1EE">perception</text>
      <text y="14" fill="#5A6687" font-size="9">dds://camera/front</text>
    </g>
    <g transform="translate(400 80)">
      <rect x="-70" y="-22" width="140" height="44" rx="10" fill="#0f193b" stroke="#ffd166" stroke-width="1.2"/>
      <text y="-4" fill="#C8D1EE">localization</text>
      <text y="14" fill="#5A6687" font-size="9">shm://vehicle/imu</text>
    </g>
    <g transform="translate(680 135)">
      <rect x="-66" y="-22" width="132" height="44" rx="10" fill="#0f193b" stroke="#00e5b0" stroke-width="1.2"/>
      <text y="-4" fill="#C8D1EE">fusion</text>
      <text y="14" fill="#5A6687" font-size="9">shm://lidar/points</text>
    </g>
    <g transform="translate(680 345)">
      <rect x="-66" y="-22" width="132" height="44" rx="10" fill="#0f193b" stroke="#4faafd" stroke-width="1.2"/>
      <text y="-4" fill="#C8D1EE">planning</text>
      <text y="14" fill="#5A6687" font-size="9">dds://plan/path</text>
    </g>
    <g transform="translate(120 345)">
      <rect x="-66" y="-22" width="132" height="44" rx="10" fill="#0f193b" stroke="#4faafd" stroke-width="1.2"/>
      <text y="-4" fill="#C8D1EE">control</text>
      <text y="14" fill="#5A6687" font-size="9">intra://ctrl/cmd</text>
    </g>
  </g>

  <!-- Bidirectional connectors (control/planning) -->
  <g stroke-dasharray="3 5" stroke-width="1" fill="none" opacity="0.35">
    <path d="M 400 315 Q 240 300 160 335" stroke="#4faafd"/>
    <path d="M 400 315 Q 560 300 640 335" stroke="#4faafd"/>
  </g>

  <!-- Corner caption -->
  <g font-family="JetBrains Mono, monospace" font-size="10">
    <text x="24" y="34" fill="#4faafd" letter-spacing="2" opacity="0.9">VLINK · AUTONOMY STACK</text>
    <text x="24" y="50" fill="#5A6687">6 sensors · 5 nodes · 3 transports · one API</text>
  </g>

  <!-- Bottom stats -->
  <g font-family="JetBrains Mono, monospace" font-size="11" fill="#8C98B9">
    <text x="24" y="430"><tspan fill="#00e5b0">●</tspan> LiDAR 10 Hz · 100 MB/s</text>
    <text x="260" y="430"><tspan fill="#4faafd">●</tspan> Camera 30 Hz · 280 MB/s</text>
    <text x="520" y="430"><tspan fill="#ffd166">●</tspan> IMU 200 Hz · 0.1 MB/s</text>
  </g>
</svg>
