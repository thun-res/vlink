<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="VLink for humanoid robot &amp; embodied AI">
  <defs>
    <linearGradient id="rb-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1228"/>
      <stop offset="1" stop-color="#070B18"/>
    </linearGradient>
    <filter id="rb-glow"><feGaussianBlur stdDeviation="2.5"/></filter>
    <linearGradient id="rb-body" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#4faafd"/>
      <stop offset="1" stop-color="#345af6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#rb-bg)"/>

  <!-- Circular radial grid (factory floor) -->
  <g transform="translate(400 410)" opacity="0.4">
    <ellipse rx="340" ry="38" fill="none" stroke="#1a2a5e" stroke-width="1"/>
    <ellipse rx="280" ry="32" fill="none" stroke="#1a2a5e" stroke-width="1"/>
    <ellipse rx="220" ry="26" fill="none" stroke="#1a2a5e" stroke-width="1"/>
    <ellipse rx="160" ry="20" fill="none" stroke="#1a2a5e" stroke-width="1"/>
  </g>

  <!-- Humanoid silhouette (center) -->
  <g transform="translate(400 225)">
    <!-- Head -->
    <circle cx="0" cy="-110" r="26" fill="#1a2a5e" stroke="#4faafd" stroke-width="1.5"/>
    <!-- Eye sensor -->
    <rect x="-14" y="-118" width="28" height="6" rx="3" fill="#00e5b0" filter="url(#rb-glow)"/>
    <!-- Neck -->
    <rect x="-6" y="-86" width="12" height="12" fill="#1a2a5e" stroke="#4faafd" stroke-width="1"/>
    <!-- Torso -->
    <rect x="-35" y="-74" width="70" height="80" rx="10" fill="url(#rb-body)" opacity="0.9"/>
    <rect x="-35" y="-74" width="70" height="80" rx="10" fill="none" stroke="#4faafd" stroke-width="1.5"/>
    <!-- Chest core -->
    <circle cx="0" cy="-34" r="8" fill="#00e5b0" filter="url(#rb-glow)"/>
    <circle cx="0" cy="-34" r="14" fill="none" stroke="#00e5b0" stroke-opacity="0.4"/>
    <!-- Shoulders -->
    <circle cx="-42" cy="-70" r="7" fill="#1a2a5e" stroke="#4faafd"/>
    <circle cx="42"  cy="-70" r="7" fill="#1a2a5e" stroke="#4faafd"/>
    <!-- Arms -->
    <rect x="-52" y="-65" width="14" height="50" rx="5" fill="#1a2a5e" stroke="#4faafd"/>
    <rect x="38"  y="-65" width="14" height="50" rx="5" fill="#1a2a5e" stroke="#4faafd"/>
    <!-- Elbows -->
    <circle cx="-45" cy="-13" r="6" fill="#4faafd" opacity="0.7"/>
    <circle cx="45"  cy="-13" r="6" fill="#4faafd" opacity="0.7"/>
    <!-- Forearms (animated) -->
    <g transform="translate(-45 -13)">
      <rect x="-6" y="0" width="12" height="50" rx="4" fill="#1a2a5e" stroke="#4faafd">
        <animateTransform attributeName="transform" type="rotate" values="-12;12;-12" dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g transform="translate(45 -13)">
      <rect x="-6" y="0" width="12" height="50" rx="4" fill="#1a2a5e" stroke="#4faafd">
        <animateTransform attributeName="transform" type="rotate" values="10;-10;10" dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- Pelvis -->
    <rect x="-28" y="6" width="56" height="20" rx="6" fill="#1a2a5e" stroke="#4faafd"/>
    <!-- Legs -->
    <rect x="-22" y="26" width="14" height="60" rx="5" fill="#1a2a5e" stroke="#4faafd"/>
    <rect x="8"   y="26" width="14" height="60" rx="5" fill="#1a2a5e" stroke="#4faafd"/>
    <!-- Knees -->
    <circle cx="-15" cy="86" r="5" fill="#4faafd" opacity="0.7"/>
    <circle cx="15"  cy="86" r="5" fill="#4faafd" opacity="0.7"/>
    <!-- Shins -->
    <rect x="-20" y="90" width="10" height="56" rx="4" fill="#1a2a5e" stroke="#4faafd"/>
    <rect x="10"  y="90" width="10" height="56" rx="4" fill="#1a2a5e" stroke="#4faafd"/>
    <!-- Feet -->
    <rect x="-26" y="146" width="22" height="10" rx="3" fill="#4faafd"/>
    <rect x="4"   y="146" width="22" height="10" rx="3" fill="#4faafd"/>

    <!-- Joint data pulse rings -->
    <g fill="none" stroke="#00e5b0" stroke-width="1" opacity="0.7">
      <circle cx="-45" cy="-13" r="10">
        <animate attributeName="r" from="6" to="18" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" from="0.8" to="0" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="45" cy="-13" r="10">
        <animate attributeName="r" from="6" to="18" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" from="0.8" to="0" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-15" cy="86" r="10">
        <animate attributeName="r" from="6" to="18" dur="1.6s" begin="0.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" from="0.8" to="0" dur="1.6s" begin="0.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="15" cy="86" r="10">
        <animate attributeName="r" from="6" to="18" dur="1.6s" begin="1.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" from="0.8" to="0" dur="1.6s" begin="1.1s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Vision cone from head -->
  <path d="M 400 115 L 280 20 L 520 20 Z" fill="#4faafd" opacity="0.1"/>
  <path d="M 400 115 L 320 60 L 480 60 Z" fill="#4faafd" opacity="0.15"/>

  <!-- Data stream lines from robot to edges -->
  <g stroke-width="1" fill="none" opacity="0.3">
    <path d="M 400 190 Q 280 130 120 90" stroke="#4faafd"/>
    <path d="M 400 190 Q 520 130 680 90" stroke="#00e5b0"/>
    <path d="M 400 370 Q 260 380 120 390" stroke="#ffd166"/>
    <path d="M 400 370 Q 540 380 680 390" stroke="#4faafd"/>
  </g>

  <!-- Packets -->
  <g>
    <circle r="3" fill="#4faafd">
      <animateMotion dur="2s" repeatCount="indefinite" path="M 400 190 Q 280 130 120 90"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#00e5b0">
      <animateMotion dur="2s" begin="0.5s" repeatCount="indefinite" path="M 400 190 Q 520 130 680 90"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#ffd166">
      <animateMotion dur="2s" begin="1s" repeatCount="indefinite" path="M 400 370 Q 260 380 120 390"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#4faafd">
      <animateMotion dur="2s" begin="1.5s" repeatCount="indefinite" path="M 400 370 Q 540 380 680 390"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Subscriber nodes around robot -->
  <g font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle">
    <g transform="translate(120 90)">
      <rect x="-60" y="-18" width="120" height="36" rx="8" fill="#0f193b" stroke="#4faafd"/>
      <text y="-2" fill="#C8D1EE">vision/RGB-D</text>
      <text y="12" fill="#5A6687" font-size="8">shm://cam/rgbd</text>
    </g>
    <g transform="translate(680 90)">
      <rect x="-60" y="-18" width="120" height="36" rx="8" fill="#0f193b" stroke="#00e5b0"/>
      <text y="-2" fill="#C8D1EE">tactile/force</text>
      <text y="12" fill="#5A6687" font-size="8">intra://hand/force</text>
    </g>
    <g transform="translate(120 390)">
      <rect x="-60" y="-18" width="120" height="36" rx="8" fill="#0f193b" stroke="#ffd166"/>
      <text y="-2" fill="#C8D1EE">joint/state</text>
      <text y="12" fill="#5A6687" font-size="8">shm://joints/pos</text>
    </g>
    <g transform="translate(680 390)">
      <rect x="-60" y="-18" width="120" height="36" rx="8" fill="#0f193b" stroke="#4faafd"/>
      <text y="-2" fill="#C8D1EE">motion/plan</text>
      <text y="12" fill="#5A6687" font-size="8">dds://motion/cmd</text>
    </g>
  </g>

  <!-- Caption -->
  <g font-family="JetBrains Mono, monospace" font-size="10">
    <text x="24" y="34" fill="#4faafd" letter-spacing="2">VLINK · EMBODIED AI</text>
    <text x="24" y="50" fill="#5A6687">humanoid · 40+ joints · sub-millisecond loop</text>
  </g>
</svg>
