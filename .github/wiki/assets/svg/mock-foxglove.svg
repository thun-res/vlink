<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" preserveAspectRatio="xMidYMid meet" font-family="'Inter','PingFang SC',sans-serif">
  <defs>
    <linearGradient id="f-win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141b34"/>
      <stop offset="1" stop-color="#0e1528"/>
    </linearGradient>
    <linearGradient id="f-3d" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1a3a"/>
      <stop offset="1" stop-color="#040816"/>
    </linearGradient>
    <radialGradient id="f-pc" cx="0.5" cy="0.6" r="0.5">
      <stop offset="0"   stop-color="#00e5b0" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#4faafd" stop-opacity="0.7"/>
      <stop offset="1"   stop-color="#345af6" stop-opacity="0.15"/>
    </radialGradient>
    <linearGradient id="f-scrub" x1="0" x2="1">
      <stop offset="0" stop-color="#345af6"/>
      <stop offset="1" stop-color="#4faafd"/>
    </linearGradient>
  </defs>

  <rect width="720" height="420" rx="10" fill="url(#f-win)" stroke="#2a3668"/>

  <!-- ─── Browser chrome ─── -->
  <rect x="0" y="0" width="720" height="32" rx="10" fill="#171e3f"/>
  <rect x="0" y="22" width="720" height="10" fill="#171e3f"/>
  <circle cx="14" cy="16" r="5" fill="#ff5f56"/>
  <circle cx="30" cy="16" r="5" fill="#ffbd2e"/>
  <circle cx="46" cy="16" r="5" fill="#27c93f"/>
  <!-- URL bar -->
  <rect x="66" y="8" width="588" height="16" rx="8" fill="#0b1228" stroke="#2a3668"/>
  <text x="80" y="19" fill="#7c8aad" font-size="10" font-family="'JetBrains Mono',monospace">
    ws://localhost:8765   ·   vlink-foxglove bridge   ·   <tspan fill="#00e5b0">● connected</tspan>
  </text>
  <text x="680" y="19" fill="#8C98B9" font-size="12" text-anchor="middle">⚙</text>

  <!-- ─── App top bar ─── -->
  <rect x="0" y="32" width="720" height="26" fill="#101734"/>
  <text x="14" y="49" fill="#C8D1EE" font-size="11" font-weight="700">Foxglove Studio</text>
  <g font-size="11" fill="#7c8aad">
    <text x="110" y="49">File</text>
    <text x="140" y="49">Layout</text>
    <text x="182" y="49">Panels</text>
    <text x="224" y="49">View</text>
    <text x="260" y="49">Help</text>
  </g>
  <text x="700" y="49" text-anchor="end" fill="#00e5b0" font-size="11" font-weight="700">VLink bridge</text>

  <!-- ─── Layout: LEFT panel (Topics) ─── -->
  <rect x="0" y="58" width="156" height="310" fill="#0a1230"/>
  <rect x="0" y="58" width="156" height="26" fill="#0e1630"/>
  <text x="12" y="75" fill="#C8D1EE" font-size="11" font-weight="700">Topics · 12</text>
  <text x="144" y="75" fill="#5A6687" font-size="11" text-anchor="end">⋯</text>

  <g font-family="'JetBrains Mono',monospace" font-size="9.5" fill="#C8D1EE">
    <text x="10" y="100" fill="#4faafd">▼ Sensors</text>
    <rect x="8" y="104" width="144" height="14" fill="#1a3561" opacity="0.8"/>
    <text x="18" y="115" fill="#ffffff">● shm://lidar/points</text>
    <text x="30" y="127" fill="#5A6687" font-size="8.5">PointCloud · 10 Hz</text>

    <text x="18" y="141" fill="#C8D1EE">● dds://camera/front</text>
    <text x="30" y="153" fill="#5A6687" font-size="8.5">RawImage · 30 Hz</text>

    <text x="18" y="167">  dds://camera/rear</text>
    <text x="18" y="181">  dds://radar/tracks</text>

    <text x="10" y="199" fill="#4faafd">▼ Perception</text>
    <text x="18" y="213">  dds://perception/obs</text>
    <text x="18" y="227">  dds://perception/lanes</text>

    <text x="10" y="245" fill="#4faafd">▼ Frames (TF)</text>
    <text x="18" y="259" fill="#ffd166">⛊ map → odom</text>
    <text x="18" y="273" fill="#ffd166">⛊ odom → base_link</text>
    <text x="18" y="287" fill="#ffd166">⛊ base_link → lidar</text>

    <text x="10" y="305" fill="#4faafd">▼ Motion</text>
    <text x="18" y="319">  shm://vehicle/imu</text>
    <text x="18" y="333">  dds://plan/path</text>
    <text x="18" y="347">  dds://localization/pose</text>
  </g>

  <!-- ─── Layout: CENTER 3D viewport ─── -->
  <rect x="156" y="58" width="408" height="250" fill="url(#f-3d)"/>
  <!-- viewport header -->
  <rect x="156" y="58" width="408" height="22" fill="#0a1028"/>
  <text x="166" y="73" fill="#C8D1EE" font-size="10.5" font-weight="700">3D</text>
  <text x="196" y="73" fill="#5A6687" font-size="10">shm://lidar/points · frame: lidar</text>
  <g fill="#4faafd" font-size="11" text-anchor="middle">
    <rect x="498" y="62" width="20" height="14" rx="3" fill="#1a2244"/>
    <text x="508" y="73">⌂</text>
    <rect x="522" y="62" width="20" height="14" rx="3" fill="#1a2244"/>
    <text x="532" y="73">+</text>
    <rect x="546" y="62" width="14" height="14" rx="3" fill="#1a2244"/>
    <text x="553" y="73">−</text>
  </g>

  <!-- ground grid (perspective) -->
  <g stroke="#1a2650" stroke-width="0.6">
    <line x1="170" y1="240" x2="550" y2="240"/>
    <line x1="200" y1="220" x2="520" y2="220"/>
    <line x1="230" y1="200" x2="490" y2="200"/>
    <line x1="260" y1="185" x2="460" y2="185"/>
    <line x1="280" y1="175" x2="440" y2="175"/>
    <!-- vertical guides -->
    <line x1="360" y1="175" x2="175" y2="290" stroke-dasharray="2 3"/>
    <line x1="360" y1="175" x2="545" y2="290" stroke-dasharray="2 3"/>
    <line x1="360" y1="175" x2="280" y2="290" stroke-dasharray="2 3"/>
    <line x1="360" y1="175" x2="440" y2="290" stroke-dasharray="2 3"/>
  </g>
  <line x1="170" y1="260" x2="550" y2="260" stroke="#2a3668" stroke-width="0.8"/>

  <!-- Ego vehicle (top-down) -->
  <g transform="translate(360 260)">
    <rect x="-16" y="-10" width="32" height="20" rx="4" fill="#1a2a5e" stroke="#4faafd" stroke-width="1.2"/>
    <rect x="-12" y="-7" width="24" height="4" fill="#4faafd" opacity="0.45"/>
    <rect x="-12" y="3"  width="24" height="4" fill="#4faafd" opacity="0.3"/>
    <circle r="3" fill="#00e5b0"/>
  </g>

  <!-- LiDAR point cloud dots -->
  <g fill="url(#f-pc)">
    <circle cx="300" cy="220" r="1.5"/><circle cx="316" cy="214" r="1.5"/><circle cx="332" cy="210" r="1.5"/><circle cx="348" cy="208" r="1.5"/><circle cx="364" cy="207" r="1.5"/><circle cx="380" cy="208" r="1.5"/><circle cx="396" cy="210" r="1.5"/><circle cx="412" cy="214" r="1.5"/><circle cx="428" cy="220" r="1.5"/>
    <circle cx="280" cy="238" r="1.8"/><circle cx="300" cy="232" r="1.8"/><circle cx="320" cy="228" r="1.8"/><circle cx="340" cy="225" r="1.8"/><circle cx="360" cy="224" r="1.8"/><circle cx="380" cy="225" r="1.8"/><circle cx="400" cy="228" r="1.8"/><circle cx="420" cy="232" r="1.8"/><circle cx="440" cy="238" r="1.8"/>
    <circle cx="258" cy="258" r="2.1"/><circle cx="285" cy="250" r="2.1"/><circle cx="315" cy="244" r="2.1"/><circle cx="345" cy="240" r="2.1"/><circle cx="375" cy="240" r="2.1"/><circle cx="405" cy="244" r="2.1"/><circle cx="435" cy="250" r="2.1"/><circle cx="462" cy="258" r="2.1"/>
  </g>
  <!-- obstacle bounding boxes -->
  <rect x="234" y="208" width="22" height="26" fill="#ff6b6b" opacity="0.55" stroke="#ff6b6b"/>
  <rect x="468" y="202" width="28" height="30" fill="#ffd166" opacity="0.55" stroke="#ffd166"/>
  <rect x="400" y="160" width="20" height="20" fill="#00e5b0" opacity="0.55" stroke="#00e5b0"/>

  <!-- Camera thumbnail (inset) -->
  <g transform="translate(166 90)">
    <rect width="116" height="68" rx="4" fill="#0b1228" stroke="#2a3668"/>
    <text x="6" y="12" fill="#4faafd" font-size="9" font-family="'JetBrains Mono',monospace">camera/front</text>
    <rect x="4" y="16" width="108" height="48" fill="#152048"/>
    <path d="M 4 54 L 58 46 L 112 54 L 112 64 L 4 64 Z" fill="#3a4a7a" opacity="0.6"/>
    <rect x="40" y="38" width="12" height="18" fill="#ff6b6b"/>
    <rect x="68" y="36" width="18" height="20" fill="#00e5b0"/>
    <rect x="94" y="40" width="14" height="16" fill="#ffd166" opacity="0.7"/>
  </g>

  <!-- Compass -->
  <g transform="translate(538 104)">
    <circle r="14" fill="#0a1028" stroke="#2a3668"/>
    <line x1="0" y1="-11" x2="0" y2="11" stroke="#4faafd"/>
    <line x1="-11" y1="0" x2="11" y2="0" stroke="#2a3668"/>
    <text y="-16" fill="#4faafd" font-size="9" text-anchor="middle">N</text>
  </g>

  <!-- ─── Layout: RIGHT panel (Inspect / Schemas) ─── -->
  <rect x="564" y="58" width="156" height="310" fill="#0a1230"/>
  <rect x="564" y="58" width="156" height="26" fill="#0e1630"/>
  <text x="574" y="75" fill="#C8D1EE" font-size="11" font-weight="700">Inspector</text>
  <text x="712" y="75" fill="#5A6687" font-size="11" text-anchor="end">⋯</text>

  <g font-family="'JetBrains Mono',monospace" font-size="9.5" fill="#C8D1EE">
    <text x="572" y="98">schema</text>
    <text x="712" y="98" fill="#00e5b0" text-anchor="end">PointCloud</text>
    <line x1="572" y1="104" x2="712" y2="104" stroke="#1e2a56"/>

    <text x="572" y="118">timestamp</text>
    <text x="712" y="118" fill="#ffd166" text-anchor="end">…401234</text>
    <text x="572" y="132">frame_id</text>
    <text x="712" y="132" fill="#00e5b0" text-anchor="end">"lidar"</text>
    <text x="572" y="146">pose.x</text>
    <text x="712" y="146" fill="#ffd166" text-anchor="end">0.00</text>
    <text x="572" y="160">pose.y</text>
    <text x="712" y="160" fill="#ffd166" text-anchor="end">0.00</text>
    <text x="572" y="174">pose.z</text>
    <text x="712" y="174" fill="#ffd166" text-anchor="end">1.80</text>
    <text x="572" y="188">point_stride</text>
    <text x="712" y="188" fill="#ffd166" text-anchor="end">16 B</text>
    <text x="572" y="202">N points</text>
    <text x="712" y="202" fill="#ffd166" text-anchor="end">131 072</text>
  </g>

  <line x1="572" y1="216" x2="712" y2="216" stroke="#1e2a56"/>
  <text x="572" y="232" fill="#4faafd" font-size="10.5" font-weight="700">Foxglove Schemas</text>
  <g font-family="'JetBrains Mono',monospace" font-size="9.5" fill="#8C98B9">
    <text x="572" y="248">· PointCloud</text>
    <text x="572" y="262">· RawImage</text>
    <text x="572" y="276">· LaserScan</text>
    <text x="572" y="290">· SceneUpdate</text>
    <text x="572" y="304">· FrameTransforms</text>
    <text x="572" y="318">· JointStates</text>
    <text x="572" y="332">· Pose · Log · Grid</text>
    <text x="572" y="350" fill="#5A6687">+ 41 more types</text>
  </g>

  <!-- ─── Timeline (bottom) ─── -->
  <rect x="156" y="308" width="408" height="60" fill="#0b1228" stroke="#1e2a56"/>
  <g font-family="'JetBrains Mono',monospace" font-size="9" fill="#8C98B9">
    <text x="170" y="323">0s</text>
    <text x="240" y="323">10s</text>
    <text x="310" y="323">20s</text>
    <text x="380" y="323">30s</text>
    <text x="450" y="323">40s</text>
    <text x="520" y="323">50s</text>
  </g>
  <rect x="170" y="328" width="380" height="10" rx="5" fill="#070d22"/>
  <rect x="170" y="328" width="216" height="10" rx="5" fill="url(#f-scrub)"/>
  <circle cx="386" cy="333" r="7" fill="#4faafd" stroke="#fff" stroke-width="1.5"/>
  <!-- transport controls -->
  <g transform="translate(236 348)">
    <circle cx="0" cy="8" r="10" fill="#1a2244"/>
    <path d="M -3 4 L -3 12 L 4 8 Z" fill="#4faafd"/>
    <circle cx="28" cy="8" r="10" fill="#345af6"/>
    <rect x="24" y="3" width="2.5" height="10" fill="#fff"/>
    <rect x="29" y="3" width="2.5" height="10" fill="#fff"/>
    <circle cx="56" cy="8" r="10" fill="#1a2244"/>
    <path d="M 52 12 L 52 4 L 60 8 Z" fill="#4faafd"/>
    <text x="86" y="12" fill="#C8D1EE" font-size="11" font-family="'JetBrains Mono',monospace">1.0×</text>
    <text x="200" y="12" fill="#5A6687" font-size="10.5" font-family="'JetBrains Mono',monospace" text-anchor="end">00:22.984 / 00:60.123</text>
  </g>

  <!-- ─── Status bar ─── -->
  <rect x="0" y="394" width="720" height="26" fill="#0a0e22"/>
  <text x="14" y="411" fill="#5A6687" font-size="10.5" font-family="'JetBrains Mono',monospace">
    <tspan fill="#00e5b0">● bridge OK</tspan>
    <tspan dx="12">8.4 MB/s</tspan>
    <tspan dx="12">ws://:8765</tspan>
  </text>
  <text x="706" y="411" text-anchor="end" fill="#5A6687" font-size="10.5" font-family="'JetBrains Mono',monospace">vlink-foxglove</text>
</svg>
